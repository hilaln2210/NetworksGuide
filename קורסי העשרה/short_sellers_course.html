<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>שורטיסטים ומלכודות שורט — Short Sellers & Short Traps</title>
<script src="/_bridge.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #f8fafc;
  --bg2:      #ffffff;
  --bg3:      #f1f5f9;
  --surface:  #ffffff;
  --border:   #e2e8f0;
  --border2:  #cbd5e1;
  --accent:   #dc2626;
  --accent2:  #b91c1c;
  --accentfg: #ffffff;
  --green:    #16a34a;
  --green2:   #15803d;
  --greenfg:  #ffffff;
  --yellow:   #f59e0b;
  --yellowfg: #78350f;
  --red:      #ef4444;
  --redfg:    #ffffff;
  --blue:     #0284c7;
  --bluefg:   #ffffff;
  --text:     #0f172a;
  --text2:    #475569;
  --text3:    #94a3b8;
  --mono:     'Courier New', 'Consolas', monospace;
  --sans:     -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --r:        12px;
  --r2:       18px;
  --r3:       24px;
}

html[data-theme="dark"] {
  --bg:       #0b1120;
  --bg2:      #151f32;
  --bg3:      #1e293b;
  --surface:  #151f32;
  --border:   #2d3d56;
  --border2:  #3e5270;
  --text:     #f1f5f9;
  --text2:    #cbd5e1;
  --text3:    #94a3b8;
  --accent:   #f87171;
  --accent2:  #ef4444;
}

html, body {
  height: 100%;
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
.header {
  position: fixed; top: 0; left: 0; right: 0; height: 60px; z-index: 200;
  background: var(--bg2); border-bottom: 2px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; gap: 12px;
}
.header-logo {
  font-weight: 900; font-size: 15.5px; color: var(--accent);
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  letter-spacing: -0.3px;
}
.header-logo-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--red); box-shadow: 0 0 8px var(--red);
}
.header-chname {
  font-size: 13px; font-weight: 700; color: var(--text2);
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.course-prog-wrap {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg3); border: 1.5px solid var(--border);
  padding: 4px 10px; border-radius: 99px;
  font-size: 11.5px; font-weight: 800; color: var(--text2); flex-shrink: 0;
}
.course-prog-bar {
  width: 60px; height: 7px; background: var(--border); border-radius: 99px; overflow: hidden;
}
.course-prog-fill {
  height: 100%; background: linear-gradient(90deg, #dc2626, #f59e0b, #16a34a);
  border-radius: 99px; transition: width 0.35s ease;
}
@media (max-width: 720px) { .course-prog-wrap { display: none; } }

.escape-header-btn {
  flex-shrink: 0; padding: 6px 13px;
  background: linear-gradient(135deg, #16a34a, #059669) !important;
  color: #ffffff !important; border: 2px solid #047857 !important;
  border-bottom: 3px solid #065f46 !important; border-radius: var(--r);
  font-size: 12px; font-weight: 800; cursor: pointer; transition: all .15s;
  display: inline-flex; align-items: center; gap: 5px;
  box-shadow: 0 2px 8px rgba(22, 163, 74, 0.25);
}
.escape-header-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
.escape-header-btn.active {
  background: linear-gradient(135deg, #dc2626, #b91c1c) !important;
  border-color: #991b1b !important;
}
.review-btn {
  flex-shrink: 0; padding: 6px 12px; background: var(--accent); color: #fff;
  border: 2px solid var(--accent2); border-bottom: 3px solid var(--accent2);
  border-radius: var(--r); font-size: 12px; font-weight: 800; cursor: pointer; transition: all .15s;
}
.review-btn:hover { opacity: .9; transform: translateY(-1px); }
.lang-btn {
  font-size: 12px; font-weight: 800; padding: 6px 12px; border-radius: var(--r);
  border: 2px solid var(--border2); border-bottom: 3px solid var(--border2);
  background: var(--bg2); color: var(--text2); cursor: pointer; flex-shrink: 0; transition: all .1s;
}
.lang-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent2); }

/* ── CHAPTER NAV BAR ── */
.ch-nav {
  position: fixed; top: 60px; left: 0; right: 0; z-index: 150;
  background: var(--bg2); border-bottom: 2px solid var(--border);
  overflow-x: auto; display: flex; padding: 8px 16px; gap: 6px;
  scrollbar-width: none; -ms-overflow-style: none;
}
.ch-nav::-webkit-scrollbar { display: none; }
.ch-btn {
  display: flex; flex-direction: column; align-items: center;
  padding: 7px 12px; gap: 3px; border: 2px solid transparent;
  background: var(--bg3); border-radius: var(--r2);
  cursor: pointer; transition: all .15s; flex-shrink: 0;
  color: var(--text2); min-width: 58px;
  border-bottom: 4px solid var(--border);
}
.ch-btn:hover { background: var(--bg2); border-color: var(--border2); color: var(--text); }
.ch-btn.active {
  background: linear-gradient(135deg, #dc2626, #b91c1c) !important;
  color: #ffffff !important;
  border-color: #991b1b !important;
  border-bottom-color: #7f1d1d !important;
  box-shadow: 0 3px 10px rgba(220, 38, 38, 0.28) !important;
}
.ch-btn.active .ch-num, .ch-btn.active .ch-title-text, .ch-btn.active .ch-stars { color: #ffffff !important; }
.ch-btn.done:not(.active) { border-color: rgba(22, 163, 74, 0.55) !important; border-bottom-color: var(--green2) !important; }
.ch-num { font-size: 11px; font-weight: 900; font-family: var(--mono); }
.ch-title-text { font-size: 9.5px; font-weight: 700; max-width: 74px; text-align: center; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ch-stars { font-size: 10px; min-height: 12px; }
.ch-btn.escape-nav-btn {
  background: linear-gradient(135deg, #16a34a, #059669) !important;
  color: #ffffff !important; border-color: #047857 !important; border-bottom-color: #065f46 !important;
  min-width: 82px;
}
.ch-btn.escape-nav-btn .ch-title-text, .ch-btn.escape-nav-btn .ch-num { color: #ffffff !important; font-weight: 800; }

/* ── LAYOUT ── */
.main {
  padding-top: 122px; min-height: 100vh;
  max-width: 840px; margin: 0 auto;
  padding-left: 20px; padding-right: 20px; padding-bottom: 70px;
}
.chapter { display: none; }
.chapter.active { display: block; }

/* ── CHAPTER HERO ── */
.ch-hero {
  padding: 26px 0 22px; border-bottom: 2px solid var(--border); margin-bottom: 26px;
}
.ch-tag {
  display: inline-block; font-size: 11px; font-weight: 800;
  color: var(--accent); background: rgba(220, 38, 38, 0.1);
  border: 1px solid rgba(220, 38, 38, 0.25);
  padding: 3px 11px; border-radius: 20px; margin-bottom: 10px;
  letter-spacing: .05em; text-transform: uppercase; font-family: var(--mono);
}
.ch-title { font-size: 27px; font-weight: 900; color: var(--text); margin-bottom: 8px; letter-spacing: -.5px; line-height: 1.22; }
.ch-desc { font-size: 14.5px; color: var(--text2); margin-bottom: 20px; line-height: 1.65; }
.tabs-bar { display: flex; gap: 6px; flex-wrap: wrap; }
.tab-btn {
  padding: 8px 18px; font-size: 13px; font-weight: 800; border-radius: var(--r2);
  border: 2px solid var(--border); border-bottom: 4px solid var(--border2);
  background: var(--bg2); color: var(--text2);
  cursor: pointer; transition: all .1s;
}
.tab-btn:hover { color: var(--text); border-color: var(--border2); }
.tab-btn.active {
  background: linear-gradient(135deg, #dc2626, #b91c1c) !important;
  color: #ffffff !important;
  border-color: #991b1b !important;
  border-bottom-color: #7f1d1d !important;
}
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── LEARN TYPOGRAPHY & BOXES ── */
.did-you-know {
  background: linear-gradient(135deg, #fffbeb, #fef3c7);
  border: 2px solid #f59e0b; border-radius: var(--r2);
  padding: 16px 18px; font-size: 14px; color: #78350f;
  margin-bottom: 26px; line-height: 1.65;
  box-shadow: 0 3px 0 #d97706;
}
html[data-theme="dark"] .did-you-know {
  background: rgba(245, 158, 11, 0.14) !important;
  border-color: rgba(251, 191, 36, 0.45) !important;
  color: #fef3c7 !important;
}
.section-title {
  font-size: 18px; font-weight: 900; color: var(--text);
  margin: 32px 0 12px; letter-spacing: -.2px;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 2px solid var(--border); padding-bottom: 6px;
}
.prose {
  font-size: 15px; color: var(--text2); line-height: 1.8; margin-bottom: 16px;
}
.prose strong { color: var(--text); font-weight: 800; }
.prose code, code {
  font-family: var(--mono); font-size: 12.5px;
  background: var(--bg3); padding: 2px 6px;
  border-radius: 6px; color: var(--accent); font-weight: 700;
  border: 1px solid var(--border);
}
ol.prose, ul.prose { padding-inline-start: 22px; margin-bottom: 18px; }
ol.prose li, ul.prose li { margin-bottom: 8px; line-height: 1.75; color: var(--text2); }

/* ── CALLOUTS ── */
.callout { padding: 15px 18px; border-radius: var(--r2); font-size: 13.8px; line-height: 1.68; margin: 18px 0; border: 2px solid; }
.callout.idea, .callout-info {
  background: #f0f9ff; border-color: #38bdf8; color: #0c4a6e; box-shadow: 0 3px 0 #7dd3fc;
}
.callout.warn, .callout-warn {
  background: #fffbeb; border-color: #fbbf24; color: #78350f; box-shadow: 0 3px 0 #fcd34d;
}
.callout.danger {
  background: #fef2f2; border-color: #f87171; color: #7f1d1d; box-shadow: 0 3px 0 #fca5a5;
}
.callout.tip, .callout-tip {
  background: #f0fdf4; border-color: #4ade80; color: #14532d; box-shadow: 0 3px 0 #86efac;
}
html[data-theme="dark"] .callout.idea, html[data-theme="dark"] .callout-info {
  background: rgba(14, 116, 144, 0.2) !important; border-color: #38bdf8 !important; color: #e0f2fe !important;
}
html[data-theme="dark"] .callout.warn, html[data-theme="dark"] .callout-warn {
  background: rgba(245, 158, 11, 0.16) !important; border-color: #fbbf24 !important; color: #fef3c7 !important;
}
html[data-theme="dark"] .callout.danger {
  background: rgba(239, 68, 68, 0.18) !important; border-color: #f87171 !important; color: #fee2e2 !important;
}
html[data-theme="dark"] .callout.tip, html[data-theme="dark"] .callout-tip {
  background: rgba(34, 197, 94, 0.16) !important; border-color: #4ade80 !important; color: #dcfce7 !important;
}

/* ── CARDS & GRIDS ── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 16px 0 24px; }
.grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin: 16px 0 24px; }
.card {
  background: var(--bg2); border: 2px solid var(--border);
  border-bottom: 4px solid var(--border2); border-radius: var(--r2);
  padding: 18px; display: flex; flex-direction: column; gap: 8px;
}
.card-icon { font-size: 26px; }
.card-title { font-size: 14px; font-weight: 900; color: var(--text); }
.card-body { font-size: 13px; color: var(--text2); line-height: 1.6; }

/* ── TABLES ── */
.table-wrap {
  overflow-x: auto; margin: 16px 0 24px;
  border-radius: var(--r2); border: 2px solid var(--border);
  box-shadow: 0 4px 0 var(--border);
}
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--bg2); }
.data-table thead, .data-table tr:first-child { background: var(--bg3); }
.data-table th {
  padding: 11px 14px; text-align: inherit; font-weight: 800;
  color: var(--text); font-size: 12px; border-bottom: 2px solid var(--border);
}
.data-table td { padding: 11px 14px; color: var(--text2); border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.55; }
.data-table tr:last-child td { border-bottom: none; }

/* ── TOOL / FORMULA TERMINAL BOX ── */
.td { border: 2px solid var(--border); border-radius: var(--r2); overflow: hidden; margin: 18px 0; background: var(--bg2); box-shadow: 0 3px 10px rgba(0,0,0,.05); }
.td-bar { display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: var(--bg3); border-bottom: 1px solid var(--border); }
.td-dots { display: flex; gap: 5px; flex-shrink: 0; }
.td-dot { width: 11px; height: 11px; border-radius: 50%; }
.td-r { background: #ff5f57; } .td-y { background: #febc2e; } .td-g { background: #28c840; }
.td-url { flex: 1; min-width: 0; background: var(--bg2); border: 1px solid var(--border2); border-radius: 6px; padding: 3px 10px; font-size: 11.5px; color: var(--text2); font-family: var(--mono); font-weight: 700; direction: ltr; text-align: left; }
.td-body { padding: 16px 18px; font-size: 13.5px; line-height: 1.7; }
pre {
  background: #0f172a; color: #e2e8f0; border: 2px solid #1e293b;
  border-radius: var(--r2); padding: 16px 18px; margin: 14px 0 20px;
  overflow-x: auto; font-family: var(--mono); font-size: 12.5px; line-height: 1.75;
  direction: ltr; text-align: left;
}
pre code { background: none !important; color: inherit !important; border: none !important; padding: 0 !important; }

/* ── INTERACTIVE SIMULATORS ── */
.sim-box {
  background: var(--bg2); border: 2px solid var(--accent);
  border-bottom: 5px solid var(--accent2); border-radius: var(--r2);
  margin: 26px 0; overflow: hidden;
  box-shadow: 0 6px 20px rgba(220, 38, 38, 0.08);
}
.sim-head {
  background: linear-gradient(135deg, rgba(220, 38, 38, 0.12), rgba(245, 158, 11, 0.08));
  border-bottom: 2px solid var(--border); padding: 14px 18px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
}
.sim-title { font-size: 14.5px; font-weight: 900; color: var(--accent); display: flex; align-items: center; gap: 8px; }
.sim-badge {
  font-family: var(--mono); font-size: 10.5px; font-weight: 800;
  padding: 3px 10px; border-radius: 99px; background: var(--accent); color: #fff;
  text-transform: uppercase; letter-spacing: .04em;
}
.sim-body { padding: 20px; }
.sim-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 18px; }
.sim-ctrl {
  background: var(--bg3); border: 1.5px solid var(--border);
  border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;
}
.sim-ctrl-top { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; font-weight: 800; color: var(--text); }
.sim-ctrl-val { font-family: var(--mono); font-size: 13.5px; font-weight: 900; color: var(--accent); direction: ltr; }
.sim-ctrl input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
.sim-ctrl select {
  width: 100%; padding: 6px 10px; border-radius: 8px; border: 1.5px solid var(--border2);
  background: var(--bg2); color: var(--text); font-weight: 700; font-size: 13px;
}
.sim-kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr)); gap: 10px; margin-top: 12px; }
.sim-kpi {
  background: var(--bg3); border: 2px solid var(--border); border-radius: var(--r);
  padding: 12px; text-align: center;
}
.sim-kpi-val { font-family: var(--mono); font-size: 19px; font-weight: 900; color: var(--text); direction: ltr; }
.sim-kpi-lbl { font-size: 11.5px; font-weight: 700; color: var(--text2); margin-top: 3px; }
.sim-alert {
  margin-top: 14px; padding: 13px 16px; border-radius: var(--r);
  font-size: 13.5px; font-weight: 700; line-height: 1.6; border: 2px solid;
}

/* ── END OF CHAPTER NAV ── */
.ch-end-nav {
  display: flex; gap: 12px; margin-top: 36px; padding-top: 24px;
  border-top: 2px solid var(--border); justify-content: center; flex-wrap: wrap;
}
.ch-end-btn {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 14px 22px; border-radius: var(--r2); cursor: pointer;
  border: 2px solid var(--border); border-bottom: 4px solid var(--border2);
  background: var(--bg2); color: var(--text2); font-weight: 800;
  font-size: 13px; transition: all .1s; min-width: 125px;
}
.ch-end-btn:hover { transform: translateY(-2px); border-color: var(--accent); color: var(--accent); }
.ch-end-btn.primary {
  background: var(--green); color: #fff; border-color: var(--green2); border-bottom-color: var(--green2);
}
.ch-end-btn-icon { font-size: 22px; }
.ch-end-btn-label { font-size: 11.5px; }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 20px; border-radius: var(--r2); font-size: 13.5px;
  font-weight: 800; border: 2px solid; cursor: pointer; transition: all .1s;
}
.btn-primary {
  background: var(--green); color: #fff; border-color: var(--green2); border-bottom: 4px solid var(--green2);
}
.btn-primary:hover { filter: brightness(1.06); }
.btn-ghost {
  background: var(--bg2); color: var(--text2); border-color: var(--border2); border-bottom: 4px solid var(--border2);
}
.btn-ghost:hover { background: var(--bg3); color: var(--text); }

/* ── QUIZ ── */
.quiz-wrap { max-width: 720px; }
.quiz-prog { display: flex; gap: 5px; margin-bottom: 22px; }
.quiz-pip { flex: 1; height: 8px; border-radius: 4px; background: var(--border2); transition: background .2s; }
.quiz-pip.done { background: var(--green); }
.quiz-pip.cur  { background: var(--accent); }
.quiz-q-card { display: none; }
.quiz-q-card.active { display: block; }
.quiz-meta { font-size: 11.5px; font-weight: 800; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
.quiz-q { font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 18px; line-height: 1.45; }
.quiz-opts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.quiz-opt {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: inherit;
  padding: 13px 16px; border-radius: var(--r2);
  border: 2px solid var(--border); border-bottom: 4px solid var(--border2);
  background: var(--bg2); cursor: pointer; transition: all .1s;
  font-size: 14px; font-weight: 600; color: var(--text);
}
.quiz-opt:hover:not(:disabled) { border-color: var(--accent); transform: translateY(-1px); }
.quiz-opt.correct { border-color: var(--green) !important; border-bottom-color: var(--green2) !important; background: rgba(22, 163, 74, 0.14) !important; }
.quiz-opt.wrong   { border-color: var(--red) !important; border-bottom-color: #b91c1c !important; background: rgba(239, 68, 68, 0.14) !important; }
.opt-letter {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--bg3); border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 900; flex-shrink: 0; color: var(--accent); font-family: var(--mono);
}
.quiz-exp {
  padding: 14px 18px; background: rgba(22, 163, 74, 0.12); border-radius: var(--r2);
  border: 2px solid var(--green); font-size: 13.5px; color: var(--text); margin: 12px 0; line-height: 1.65;
}
.quiz-result { text-align: center; padding: 28px 16px; background: var(--bg2); border: 2px solid var(--border); border-radius: var(--r2); margin-top: 16px; }
.qr-score { font-size: 52px; font-weight: 900; font-family: var(--mono); color: var(--green); }
.qr-label { font-size: 19px; font-weight: 900; color: var(--text); margin-bottom: 18px; }
.quiz-nav { display: flex; justify-content: space-between; margin-top: 14px; gap: 10px; }

/* ── MATCH GAME ── */
.match-board { padding: 8px 0; }
.match-success { text-align: center; font-size: 17px; font-weight: 800; color: var(--green); padding: 16px; background: rgba(22, 163, 74, 0.12); border-radius: 12px; margin-bottom: 16px; border: 2px solid var(--green); }
.match-restart-btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 9px 22px; font-size: 13.5px; font-weight: 800; cursor: pointer; }
.match-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.match-col { display: flex; flex-direction: column; gap: 8px; }
.match-card { padding: 12px 14px; border: 2px solid var(--border); border-bottom: 4px solid var(--border2); border-radius: 12px; background: var(--bg2); font-size: 13px; font-weight: 600; line-height: 1.45; cursor: pointer; transition: all .15s; }
.match-card:hover:not(.match-done) { border-color: var(--accent); transform: translateY(-1px); }
.match-sel { border-color: var(--accent) !important; background: rgba(220, 38, 38, 0.1) !important; }

<script>
let currentLang = localStorage.getItem('ng_lang') || 'he';
let currentCh = 0;
const completedChapters = new Set(JSON.parse(localStorage.getItem('ng_shorts_done') || '[]'));
const quizScores = JSON.parse(localStorage.getItem('ng_shorts_quiz') || '{}');

function awardXP(amount) {
  try {
    if (typeof window.ngXP === 'function') window.ngXP(amount);
    else if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'ng_xp', amount: amount }, '*');
    }
  } catch (e) {}
}

function saveDone(ch) {
  completedChapters.add(ch);
  try { localStorage.setItem('ng_shorts_done', JSON.stringify([...completedChapters])); } catch (e) {}
  updateCourseProgress();
}

function updateCourseProgress() {
  const count = completedChapters.size;
  const pct = Math.min(100, Math.round((count / 10) * 100));
  const txt = document.getElementById('courseProgText');
  const fill = document.getElementById('courseProgFill');
  if (txt) txt.textContent = count + '/10 (' + pct + '%)';
  if (fill) fill.style.width = pct + '%';
  for (let i = 0; i < 10; i++) {
    const btn = document.getElementById('nav-' + i);
    const stars = document.getElementById('chstars-' + i);
    if (btn) btn.classList.toggle('done', completedChapters.has(i));
    if (stars) stars.textContent = completedChapters.has(i) ? '✓' : '';
  }
}

/* ── INTERACTIVE SIMULATOR FUNCTIONS ── */
function updateCtbSim() {
  const entry = parseFloat(document.getElementById('sim-ctb-entry')?.value || 10);
  const curr = parseFloat(document.getElementById('sim-ctb-curr')?.value || 18);
  const shares = parseInt(document.getElementById('sim-ctb-shares')?.value || 1000, 10);
  const ctb = parseFloat(document.getElementById('sim-ctb-rate')?.value || 85);
  const days = parseInt(document.getElementById('sim-ctb-days')?.value || 30, 10);
  const div = parseFloat(document.getElementById('sim-ctb-div')?.value || 0.5);

  document.getElementById('val-ctb-entry').textContent = '$' + entry.toFixed(2);
  document.getElementById('val-ctb-curr').textContent = '$' + curr.toFixed(2);
  document.getElementById('val-ctb-shares').textContent = shares.toLocaleString();
  document.getElementById('val-ctb-rate').textContent = ctb + '%';
  document.getElementById('val-ctb-days').textContent = days + (currentLang === 'en' ? 'd' : ' ימים');
  document.getElementById('val-ctb-div').textContent = '$' + div.toFixed(2);

  const dailyBorrow = (curr * shares * (ctb / 100)) / 360;
  const weekendBurn = dailyBorrow * 3; // Fri-Sat-Sun 3-day charge
  const totalBorrow = dailyBorrow * days;
  const totalDiv = div * shares;
  const pricePnl = (entry - curr) * shares;
  const netPnl = pricePnl - totalBorrow - totalDiv;
  const breakeven = Math.max(0, entry - (totalBorrow + totalDiv) / shares);

  document.getElementById('kpi-ctb-daily').textContent = '-$' + dailyBorrow.toFixed(2);
  document.getElementById('kpi-ctb-wknd').textContent = '-$' + weekendBurn.toFixed(2);
  document.getElementById('kpi-ctb-total').textContent = '-$' + (totalBorrow + totalDiv).toFixed(0);
  document.getElementById('kpi-ctb-be').textContent = '$' + breakeven.toFixed(2);
  const pnlEl = document.getElementById('kpi-ctb-pnl');
  pnlEl.textContent = (netPnl >= 0 ? '+$' : '-$') + Math.abs(netPnl).toFixed(0);
  pnlEl.style.color = netPnl >= 0 ? 'var(--green)' : 'var(--red)';

  const alertEl = document.getElementById('sim-ctb-alert');
  if (curr > entry && ctb >= 50) {
    alertEl.style.borderColor = 'var(--red)';
    alertEl.style.background = 'rgba(239,68,68,0.12)';
    alertEl.innerHTML = currentLang === 'en'
      ? '🚨 <strong>Double Compounding Trap!</strong> Both share price ($' + curr + ') and CTB (' + ctb + '%) rose. Since CTB is charged on CURRENT market value 365 days/year, your daily fee exploded to <strong>$' + dailyBorrow.toFixed(2) + '/day</strong>. Even if the stock drops back to $' + entry.toFixed(2) + ', you lose <strong>$' + (totalBorrow + totalDiv).toFixed(0) + '</strong> unless it drops below <strong>$' + breakeven.toFixed(2) + '</strong>!'
      : '🚨 <strong>מלכודת המכפלה הכפולה!</strong> גם מחיר המניה ($' + curr + ') וגם ה-CTB (' + ctb + '%) עלו. מכיוון שעמלת ההשאלה מחושבת לפי <strong>שווי השוק הנוכחי</strong> 365 ימים בשנה, העלות היומית זינקה ל-<strong>$' + dailyBorrow.toFixed(2) + ' ליום</strong>. גם אם המניה תחזור למחיר הכניסה ($' + entry.toFixed(2) + '), עדיין תפסיד <strong>$' + (totalBorrow + totalDiv).toFixed(0) + '</strong> אם לא תרד מתחת לנקודת האיזון <strong>$' + breakeven.toFixed(2) + '</strong>!';
  } else {

      : '✅ <strong>עלות החזקה נשלטת:</strong> מחיר האיזון האמיתי שלך (Breakeven) אחרי ' + days + ' ימי השאלה ודיבידנד הוא <strong>$' + breakeven.toFixed(2) + '</strong>.';

function updatePainSim() {
  const cash = parseFloat(document.getElementById('sim-pain-cash')?.value || 15000);
  const entry = parseFloat(document.getElementById('sim-pain-entry')?.value || 10);
  const curr = parseFloat(document.getElementById('sim-pain-curr')?.value || 16);
  const maint = parseFloat(document.getElementById('sim-pain-maint')?.value || 50);
  const shares = 1000;

  document.getElementById('val-pain-cash').textContent = '$' + cash.toLocaleString();
  document.getElementById('val-pain-entry').textContent = '$' + entry.toFixed(2);
  document.getElementById('val-pain-curr').textContent = '$' + curr.toFixed(2);
  document.getElementById('val-pain-maint').textContent = maint + '%';

  const shortProceeds = entry * shares;
  const totalCashOnBook = cash + shortProceeds;
  const posValue = curr * shares;
  const accountEquity = totalCashOnBook - posValue;
  const reqMargin = posValue * (maint / 100);
  const marginPct = posValue > 0 ? (accountEquity / posValue) * 100 : 0;
  const marginCallPrice = totalCashOnBook / (shares * (1 + (maint / 100)));

  document.getElementById('kpi-pain-pos').textContent = '$' + posValue.toLocaleString();
  const eqEl = document.getElementById('kpi-pain-eq');
  eqEl.textContent = (accountEquity >= 0 ? '$' : '-$') + Math.abs(accountEquity).toLocaleString();
  eqEl.style.color = accountEquity > reqMargin ? 'var(--green)' : 'var(--red)';
  document.getElementById('kpi-pain-req').textContent = '$' + Math.round(reqMargin).toLocaleString();
  document.getElementById('kpi-pain-mcprice').textContent = '$' + marginCallPrice.toFixed(2);

  const alertEl = document.getElementById('sim-pain-alert');
  if (accountEquity <= 0) {
    alertEl.style.borderColor = 'var(--red)';
    alertEl.style.background = 'rgba(239,68,68,0.18)';
    alertEl.innerHTML = currentLang === 'en'
      ? '💀 <strong>ACCOUNT WIPED OUT (Negative Equity)!</strong> The position value ($' + posValue.toLocaleString() + ') exceeded your entire collateral ($' + totalCashOnBook.toLocaleString() + '). You owe the broker money!'
      : '💀 <strong>מחיקת תיק מוחלטת (Negative Equity)!</strong> שווי הפוזיציה ($' + posValue.toLocaleString() + ') עבר את סך המזומן והבטוחות בחשבון ($' + totalCashOnBook.toLocaleString() + '). החשבון במינוס מול הברוקר!';
  } else if (accountEquity < reqMargin) {
    alertEl.style.borderColor = 'var(--red)';
    alertEl.style.background = 'rgba(239,68,68,0.14)';
    alertEl.innerHTML = currentLang === 'en'
      ? '🚨 <strong>MARGIN CALL & FORCED BUY-IN TRIGGERED!</strong> Your equity ($' + accountEquity.toLocaleString() + ', ' + marginPct.toFixed(1) + '%) fell below the broker House Margin requirement of ' + maint + '% ($' + Math.round(reqMargin).toLocaleString() + '). The broker risk engine automatically sends a Market Buy order at $' + curr.toFixed(2) + '!'
      : '🚨 <strong>MARGIN CALL וחיסול כפוי (Forced Buy-In)!</strong> ההון העצמי שלך ($' + accountEquity.toLocaleString() + ', שהם ' + marginPct.toFixed(1) + '%) צנח מתחת לדרישת הבטוחה של הברוקר (' + maint + '% = $' + Math.round(reqMargin).toLocaleString() + '). מנוע הסיכונים של הברוקר קונה לך במחירי שוק ($' + curr.toFixed(2) + ') בלי לשאול אותך!';
  } else {
    alertEl.style.borderColor = 'var(--green)';
    alertEl.style.background = 'rgba(22,163,74,0.1)';
    alertEl.innerHTML = currentLang === 'en'
      ? '🛡️ <strong>Above Maintenance Margin:</strong> Current equity ratio is <strong>' + marginPct.toFixed(1) + '%</strong> (required: ' + maint + '%). Your Margin Call trigger price is <strong>$' + marginCallPrice.toFixed(2) + '</strong>. Watch out if the broker hikes House Margin from ' + maint + '% to 100%!'
      : '🛡️ <strong>מעל דרישת הבטוחה:</strong> יחס ההון הנוכחי שלך הוא <strong>' + marginPct.toFixed(1) + '%</strong> (נדרש: ' + maint + '%). מחיר ה-Margin Call שלך הוא <strong>$' + marginCallPrice.toFixed(2) + '</strong>. שים לב: אם הברוקר יקפיץ דרישת בטוחה ל-100%, מחיר החיסול יצנח מיד!';
  }
}

function updateConvSim() {
  const mktPrice = parseFloat(document.getElementById('sim-conv-mkt')?.value || 14);
  const convPrice = parseFloat(document.getElementById('sim-conv-strike')?.value || 8);
  const blocker = parseFloat(document.getElementById('sim-conv-blocker')?.value || 4.99);
  const s1Status = document.getElementById('sim-conv-s1')?.value || 'locked';
  const outShares = 5000000; // 5M shares outstanding
  const totalWarrants = 3000000; // 3M warrants/convertibles

  document.getElementById('val-conv-mkt').textContent = '$' + mktPrice.toFixed(2);
  document.getElementById('val-conv-strike').textContent = '$' + convPrice.toFixed(2);
  document.getElementById('val-conv-blocker').textContent = blocker + '%';

  const maxInstantByBlocker = Math.floor(outShares * (blocker / 100));
  const cashlessShares = mktPrice > convPrice ? Math.floor(totalWarrants * ((mktPrice - convPrice) / mktPrice)) : 0;
  const canDumpNow = (mktPrice > convPrice) && (s1Status === 'effective');

  document.getElementById('kpi-conv-itm').textContent = mktPrice > convPrice ? (currentLang === 'en' ? 'IN THE MONEY' : 'בכסף (ITM)') : (currentLang === 'en' ? 'OUT OF MONEY' : 'מחוץ לכסף (OTM)');
  document.getElementById('kpi-conv-maxblk').textContent = maxInstantByBlocker.toLocaleString();
  document.getElementById('kpi-conv-cashless').textContent = cashlessShares.toLocaleString();
  document.getElementById('kpi-conv-supply').textContent = canDumpNow ? (currentLang === 'en' ? 'ACTIVE DILUTION' : 'דילול פעיל עכשיו') : (currentLang === 'en' ? 'LOCKED / ZERO' : 'נעול — 0 היצע!');

  const alertEl = document.getElementById('sim-conv-alert');
  if (s1Status !== 'effective' && mktPrice > convPrice) {
    alertEl.style.borderColor = 'var(--red)';
    alertEl.style.background = 'rgba(239,68,68,0.14)';
    alertEl.innerHTML = currentLang === 'en'
      ? '🪤 <strong>SHORT TRAP DETECTED!</strong> The warrants/convertibles are In-The-Money ($' + mktPrice + ' > $' + convPrice + '), so retail shorts expect 3,000,000 shares to dump. BUT the S-1 Registration Statement is <strong>NOT EFFECTIVE YET</strong>! Not a single share can be sold on the open market — the float is locked and ripe for a violent squeeze!'
      : '🪤 <strong>זוהתה מלכודת שורטיסטים קטלנית!</strong> הוורנטים/אג"ח עמוק בכסף ($' + mktPrice + ' מול $' + convPrice + '), ולכן שורטיסטים חובבים בטוחים ש-3 מיליון מניות ישפכו לשוק. אבל <strong>תשקיף ה-S-1 עדיין לא אושר (Not Effective)</strong>! מחזיקי הוורנטים לא יכולים למכור אפילו מניה אחת בשוק החופשי — ה-Float נעול והסקוויז מתפוצץ!';
  } else if (mktPrice <= convPrice) {
    alertEl.style.borderColor = 'var(--yellow)';
    alertEl.style.background = 'rgba(245,158,11,0.14)';
    alertEl.innerHTML = currentLang === 'en'
      ? '⚠️ <strong>Out-of-the-Money Overhang:</strong> Market price ($' + mktPrice + ') is below conversion/exercise price ($' + convPrice + '). Holders have no incentive to convert until price rises above $' + convPrice + '.'
      : '⚠️ <strong>היצע רדום (מחוץ לכסף):</strong> מחיר השוק ($' + mktPrice + ') נמוך ממחיר ההמרה/מימוש ($' + convPrice + '). למחזיקים אין שום כדאיות כלכלית להמיר עד שהמניה תעלה מעל $' + convPrice + '.';
  } else {
    alertEl.style.borderColor = 'var(--green)';
    alertEl.style.background = 'rgba(22,163,74,0.12)';
    alertEl.innerHTML = currentLang === 'en'
      ? '📉 <strong>Active Dilution Overhang:</strong> Both ITM and S-1 Effective! Note that the <strong>' + blocker + '% Ownership Blocker</strong> still caps each holder chunk to ' + maxInstantByBlocker.toLocaleString() + ' shares at a time (unless they sell down and convert in waves).'
      : '📉 <strong>דילול חי ופעיל בשוק:</strong> גם בכסף וגם S-1 מאושר! שים לב שמגבלת ה-<strong>Blocker של ' + blocker + '%</strong> עדיין מתירה לכל קרן להמיר במנות של עד ' + maxInstantByBlocker.toLocaleString() + ' מניות בכל סבב מכירה.';
  }
}

function updateSqzSim() {
  const floatM = parseFloat(document.getElementById('sim-sqz-float')?.value || 2.5);
  const siPct = parseFloat(document.getElementById('sim-sqz-si')?.value || 38);
  const callsK = parseFloat(document.getElementById('sim-sqz-calls')?.value || 45);
  const volM = parseFloat(document.getElementById('sim-sqz-vol')?.value || 0.8);

  document.getElementById('val-sqz-float').textContent = floatM.toFixed(1) + 'M';
  document.getElementById('val-sqz-si').textContent = siPct + '%';
  document.getElementById('val-sqz-calls').textContent = callsK + 'K contracts';
  document.getElementById('val-sqz-vol').textContent = volM.toFixed(1) + 'M';

  const shortSharesM = floatM * (siPct / 100);
  const dtc = volM > 0 ? (shortSharesM / volM) : 0;
  // Assume average delta ramp of 0.55 during squeeze = 55 shares per contract
  const mmHedgeSharesM = (callsK * 100 * 0.55) / 1000000;
  const totalForcedBuyM = shortSharesM + mmHedgeSharesM;
  const demandToFloatPct = (totalForcedBuyM / floatM) * 100;

  document.getElementById('kpi-sqz-shorts').textContent = shortSharesM.toFixed(2) + 'M';
  document.getElementById('kpi-sqz-dtc').textContent = dtc.toFixed(1) + 'd';
  document.getElementById('kpi-sqz-gamma').textContent = mmHedgeSharesM.toFixed(2) + 'M';
  const ratioEl = document.getElementById('kpi-sqz-ratio');
  ratioEl.textContent = demandToFloatPct.toFixed(0) + '%';
  ratioEl.style.color = demandToFloatPct >= 80 ? 'var(--red)' : 'var(--text)';

  const alertEl = document.getElementById('sim-sqz-alert');
  if (demandToFloatPct >= 90 || dtc >= 3) {
    alertEl.style.borderColor = 'var(--red)';
    alertEl.style.background = 'rgba(239,68,68,0.16)';
    alertEl.innerHTML = currentLang === 'en'
      ? '💥 <strong>NUCLEAR SHORT + GAMMA SQUEEZE!</strong> Forced buying from shorts (' + shortSharesM.toFixed(2) + 'M shares) + Market Maker Delta Hedging (' + mmHedgeSharesM.toFixed(2) + 'M shares) equals <strong>' + demandToFloatPct.toFixed(0) + '% of the entire tradable float</strong>! With Days-to-Cover at ' + dtc.toFixed(1) + ' days, the Order Book hits an air-pocket vacuum.'
      : '💥 <strong>פיצוץ כפול: Short + Gamma Squeeze!</strong> סך הקנייה הכפויה של שורטיסטים (' + shortSharesM.toFixed(2) + 'M מניות) יחד עם גידור הדלתא של עושי השוק באופציות (' + mmHedgeSharesM.toFixed(2) + 'M מניות) מגיע ל-<strong>' + demandToFloatPct.toFixed(0) + '% מכל ה-Float הסחיר</strong>! ספר הפקודות מתרוקן ממוכרים והמחיר מזנק במאות אחוזים.';
  } else {
    alertEl.style.borderColor = 'var(--green)';
    alertEl.style.background = 'rgba(22,163,74,0.1)';
    alertEl.innerHTML = currentLang === 'en'
      ? '📊 <strong>Moderate Squeeze Pressure:</strong> Combined forced demand is ' + demandToFloatPct.toFixed(0) + '% of float with DTC of ' + dtc.toFixed(1) + ' days.'
      : '📊 <strong>לחץ סקוויז מתון:</strong> הביקוש הכפוי המשותף מהווה ' + demandToFloatPct.toFixed(0) + '% מה-Float עם DTC של ' + dtc.toFixed(1) + ' ימים.';
  }
}

const CHAPTERS_0_2 = [{"id":0,"num":"00","titleHe":"מכונת השורט ואסימטריה","titleEn":"The Short Machine & Asymmetry","tagHe":"פרק 00 · יסודות המכניקה","tagEn":"Chapter 00 · Core Mechanics","descHe":"מה באמת קורה מאחורי הקלעים כשלוחצים Sell Short? שרשרת ההשאלה, Locate, FTDs, והאסימטריה המתמטית שהופכת כל שורט למשחק עם חוקים הפוכים.","descEn":"What really happens behind the scenes when you click Sell Short? The Stock Loan chain, Locate, FTDs, and the mathematical asymmetry of shorting.","learnHe":"\n      <div class=\"did-you-know\">💡 <strong>כלל הברזל של וול-סטריט:</strong> בפוזיציית לונג (Long), אם אתה טועה — הפוזיציה שלך מתכווצת והופכת לחלק קטן יותר מהתיק. בפוזיציית שורט (Short), אם אתה טועה — <strong>הפוזיציה המפסידה מתנפחת והופכת לחלק ענק מהתיק שלך</strong> בדיוק ברגע הכי מסוכן!</div>\n      <div class=\"section-title\">⚙️ שרשרת השאלת המניות (The Stock Loan Chain)</div>\n      <p class=\"prose\">כאשר אתה פותח פוזיציית שורט, אתה מוכר מניה <strong>שאינה בבעלותך</strong>. כדי שהמכירה תהיה חוקית, הברוקר שלך חייב לאתר (<strong>Locate</strong>) ולהשאיל את המניה מבעל מניות קיים ולהעביר אותה לקונה בתוך יום סליקה אחד (<code>T+1</code>).</p>\n      <div class=\"grid-3\">\n        <div class=\"card\"><div class=\"card-icon\">🏦</div><div class=\"card-title\">1. המלווה (Lender)</div><div class=\"card-body\">קרנות פנסיה, תעודות סל (BlackRock, Vanguard) או לקוחות Margin שמאפשרים לברוקר להשאיל את מניותיהם (Fully Paid Lending) בתמורה לחלק מעמלת ההשאלה.</div></div>\n        <div class=\"card\"><div class=\"card-icon\">🔗</div><div class=\"card-title\">2. הברוקר / Prime Broker</div><div class=\"card-body\">מבצע <code>Locate</code>, נועל את המניה, מעביר אותה לקונה החדש בשוק, ומחזיק את מזומן המכירה (Short Proceeds) כבטוחה משועבדת.</div></div>\n        <div class=\"card\"><div class=\"card-icon\">🩳</div><div class=\"card-title\">3. השורטיסט (Borrower)</div><div class=\"card-body\">חייב להחזיר <strong>מניות באותה כמות</strong> (לא דולרים!) למלווה בעתיד, ולשלם ריבית השאלה יומית ודיבידנדים כל עוד הפוזיציה פתוחה.</div></div>\n      </div>\n      <div class=\"section-title\">📐 האסימטריה המתמטית של השורט</div>\n      <div class=\"table-wrap\"><table class=\"data-table\">\n        <thead><tr><th>פרמטר</th><th>פוזיציית לונג (Long)</th><th>פוזיציית שורט (Short)</th></tr></thead>\n        <tbody>\n          <tr><td><strong>רווח מקסימלי</strong></td><td>אינסופי (מניה יכולה לעלות 1,000%+)</td><td><strong>מוגבל ל-100%</strong> (גם אם החברה פושטת רגל ל-$0.00)</td></tr>\n          <tr><td><strong>הפסד מקסימלי</strong></td><td>מוגבל ל-100% מהסכום שהושקע</td><td><strong>אינסופי תיאורטית</strong> (מניה ב-$10 יכולה לעלות ל-$80 = הפסד 700%-)</td></tr>\n          <tr><td><strong>משקל הפוזיציה בהפסד</strong></td><td>קטן אוטומטית ככל שהמחיר יורד</td><td><strong>גדל אוטומטית</strong> ככל שהמחיר עולה ובולע את הבטוחות בתיק</td></tr>\n          <tr><td><strong>עלות החזקה לאורך זמן</strong></td><td>0% (במזומן) + מקבל דיבידנד</td><td>משלם <strong>CTB יומי (כולל סופ\"ש)</strong> + משלם דיבידנד מכיסו</td></tr>\n        </tbody>\n      </table></div>\n      <div class=\"section-title\">🔍 ETB מול HTB, Naked Shorting ו-FTDs (Reg SHO)</div>\n      <ul class=\"prose\">\n        <li><strong>Easy-to-Borrow (ETB):</strong> מניות נזילות (כמו AAPL, MSFT) שבהן הברוקר מאתר השאלה אוטומטית ובחינם או בעמלה זניחה (0.3%–1% שנתי).</li>\n        <li><strong>Hard-to-Borrow (HTB):</strong> מניות עם היצע השאלה נמוך וביקוש גבוה לשורט. דורשות <code>Locate</code> יזום בתשלום מראש לפני שליחת הפקודה, ועמלת השאלה שעלולה להגיע ל-50%–500%+ בשנה.</li>\n        <li><strong>Fails-to-Deliver (FTD) ו-Reg SHO Rule 204:</strong> אם מניה נמכרה בשורט (למשל על ידי עושה שוק באישור חריג או שורט עירום) ולא סופקה במסלקת ה-DTCC במועד <code>T+1</code>, נוצר <strong>FTD</strong>. לפי תקנה <code>Rule 204</code>, הברוקר מחויב לסגור את הכשל תוך ימים ספורים (<code>T+2</code> / <code>T+4</code>) באמצעות קנייה כפויה בשוק בפתיחת המסחר (<strong>Pre-Market / Open Buy-In</strong>) — מנוע מוכח לקפיצות בוקר חדות!</li>\n        <li><strong>Threshold Security List:</strong> רשימת מניות שבהן יש FTDs של מעל 10,000 מניות ו-0.5% מסך המניות במשך 5 ימי סליקה רצופים — אחרי 13 ימים כאלה מופעל <strong>חיסול כפוי חובה</strong>.</li>\n      </ul>\n    ","learnEn":"\n      <div class=\"did-you-know\">💡 <strong>Wall Street's Iron Law:</strong> In a Long position, when you are wrong, the position shrinks as a percentage of your portfolio. In a Short position, when you are wrong, <strong>your losing position grows larger and consumes your portfolio</strong> right at the most dangerous moment!</div>\n      <div class=\"section-title\">⚙️ The Stock Loan Chain</div>\n      <p class=\"prose\">When you sell short, you sell shares <strong>you do not own</strong>. Your broker must <strong>Locate</strong> and borrow those shares from an existing holder to deliver to the buyer at settlement (<code>T+1</code>).</p>\n      <div class=\"table-wrap\"><table class=\"data-table\">\n        <thead><tr><th>Metric</th><th>Long Position</th><th>Short Position</th></tr></thead>\n        <tbody>\n          <tr><td><strong>Max Profit</strong></td><td>Unlimited (+1,000%+)</td><td><strong>Capped at 100%</strong> (if stock goes to $0.00)</td></tr>\n          <tr><td><strong>Max Loss</strong></td><td>Capped at 100% invested</td><td><strong>Theoretically Unlimited</strong> ($10 → $80 = -700% loss)</td></tr>\n          <tr><td><strong>Portfolio Weight on Loss</strong></td><td>Shrinks as price falls</td><td><strong>Expands aggressively</strong> as price rises</td></tr>\n          <tr><td><strong>Carry Cost</strong></td><td>0% (cash) + earns dividends</td><td>Pays daily <strong>CTB (365d/yr)</strong> + pays dividends out of pocket</td></tr>\n        </tbody>\n      </table></div>\n    ","cheatHe":[{"l":"כלל האסימטריה","t":"רווח מקסימלי בשורט: <strong>100%</strong>. הפסד מקסימלי: <strong>אינסופי</strong>. פוזיציה מפסידה בשורט תופחת כמשקל בתיק."},{"l":"Locate: ETB vs HTB","t":"במניות <strong>HTB</strong> משלמים עמלת איתור (Locate Fee) עוד לפני הביצוע, בתוספת ריבית השאלה שנתית גבוהה."},{"l":"FTDs & Reg SHO 204","t":"כשל במסירה (FTD) מחייב את הברוקר לבצע <strong>Close-Out קנייה כפויה</strong> בשוק, לרוב בפתיחת המסחר."}],"cheatEn":[{"l":"Asymmetry Rule","t":"Max profit: <strong>100%</strong>. Max loss: <strong>Unlimited</strong>. Losing shorts expand as % of portfolio."},{"l":"Locate: ETB vs HTB","t":"Hard-to-Borrow (HTB) stocks require a paid Locate before execution plus high daily borrow fees."},{"l":"FTDs & Reg SHO 204","t":"Fails-to-Deliver force brokers into mandatory market Buy-Ins at market open."}],"gameHe":[["Locate","איתור ונעילת מניות להשאלה לפני ביצוע פקודת שורט"],["HTB (Hard to Borrow)","מניה עם היצע השאלה נדיר ועמלת השאלה יקרה"],["FTD (Fail to Deliver)","מניה שנמכרה ולא סופקה למסלקה במועד T+1"],["Reg SHO Rule 204","תקנה המחייבת ברוקר לסגור FTD בקנייה כפויה בשוק"],["אסימטריית השורט","רווח מוגבל ל-100% מול הפסד פוטנציאלי בלתי מוגבל"]],"gameEn":[["Locate","Securing borrowable shares before executing a short sale"],["HTB (Hard to Borrow)","Stock with scarce borrow supply and high borrow fees"],["FTD (Fail to Deliver)","Shares sold but not delivered at T+1 settlement"],["Reg SHO Rule 204","SEC rule forcing mandatory buy-in of FTDs"],["Short Asymmetry","Max gain capped at 100% vs unlimited downside risk"]],"quiz":[{"qHe":"מה קורה למשקל של פוזיציית שורט בתיק ההשקעות כאשר מחיר המניה עולה ב-100%?","qEn":"What happens to a short position's portfolio weight when the stock price rises 100%?","optsHe":["המשקל שלה קטן בחצי","המשקל שלה מוכפל וצורך פי 2 יותר בטוחות מהתיק","המשקל נשאר קבוע כי מספר המניות לא השתנה","הברוקר ממיר אותה לפוזיציית לונג"],"optsEn":["Its weight shrinks by half","Its weight doubles and consumes 2x more collateral","Its weight stays constant","The broker converts it to Long"],"ans":1,"expHe":"בשורט החוב שלך נקוב במניות. כשהמחיר מוכפל, שווי ההתחייבות שלך בדולרים מוכפל בזמן שההון העצמי שלך נשחק — ולכן הפוזיציה תופסת נתח הולך וגדל מהתיק."},{"qHe":"מהו הרווח המקסימלי האפשרי בעסקת שורט ישירה (ללא מינוף) אם חברה פושטת רגל ומחיר המניה יורד מ-$50 ל-$0?","qEn":"What is the maximum percentage gain on an unleveraged short sale if a stock drops from $50 to $0?","optsHe":["אינסופי","500%","100%","200%"],"optsEn":["Unlimited","500%","100%","200%"],"ans":2,"expHe":"מניה לא יכולה לרדת מתחת ל-$0.00. לכן אם מכרת בשורט ב-$50 וקנית חזרה ב-$0, הרווח המקסימלי הוא $50 למניה = 100%."},{"qHe":"מה מחייבת תקנת Reg SHO Rule 204 כאשר נוצר כשל מסירה (FTD) שלא נסגר בזמן?","qEn":"What does SEC Reg SHO Rule 204 require when a Fail-to-Deliver (FTD) is not resolved on time?","optsHe":["ביטול העסקה של הקונה","קנייה כפויה בשוק (Mandatory Buy-In) של המניות החסרות","הקפאת המניה ל-30 יום","קנס של 1% בלבד ללא צורך בקנייה"],"optsEn":["Canceling the buyer trade","Mandatory market Buy-In of the undelivered shares","Halting the stock for 30 days","A 1% fine with no buy-in"],"ans":1,"expHe":"Rule 204 מחייב את הברוקר/חבר המסלקה לרכוש את המניות בשוק החופשי (Close-out) כדי לכסות את ה-FTD, לרוב בתחילת יום המסחר."},{"qHe":"מתי מניה מוגדרת כ-Threshold Security לפי חוקי ה-SEC?","qEn":"When is a stock placed on the Regulation SHO Threshold Security List?","optsHe":["כשהיא יורדת 10% ביום אחד","כשיש בה FTDs של לפחות 10,000 מניות ו-0.5% מסך המניות במשך 5 ימי סליקה רצופים","כשה-CTB עובר 50%","כשחברה מדווחת על הפסד רבעוני"],"optsEn":["When it drops 10% in one day","When FTDs exceed 10,000 shares and 0.5% of TSO for 5 consecutive settlement days","When CTB exceeds 50%","When a company posts a quarterly loss"],"ans":1,"expHe":"רשימת ה-Threshold מצביעה על כשלי מסירה מתמשכים ומפעילה מגבלות מחמירות וחיסולים כפויים אחרי 13 ימי סליקה."},{"qHe":"מה ההבדל בין מניית ETB למניית HTB עבור שורטיסט?","qEn":"What is the difference between an ETB and HTB stock for a short seller?","optsHe":["ב-HTB אסור לעשות שורט בכלל","ב-HTB יש לבצע Locate יזום (לעיתים בתשלום) ולשלם עמלת השאלה שנתית גבוהה ומשתנה","ב-ETB משלמים עמלת השאלה של 100%","אין שום הבדל"],"optsEn":["HTB cannot be shorted at all","HTB requires an explicit Locate (often paid) and carries a high variable borrow rate","ETB costs 100% borrow fee","No difference"],"ans":1,"expHe":"במניות Hard-to-Borrow ההיצע להשאלה מוגבל מאוד, ולכן נדרש Locate מראש בתשלום ועמלת CTB יומית גבוהה."}]},{"id":1,"num":"01","titleHe":"CTB, Rebate ודיבידנדים","titleEn":"CTB, Rebate & Dividends","tagHe":"פרק 01 · המונה שדופק 24/7","tagEn":"Chapter 01 · 24/7 Carry Burn","descHe":"עמלות השאלה (Cost to Borrow), חישוב יומי כולל סופי שבוע לפי שווי שוק נוכחי, Rebate Rate, ומלכודת הדיבידנדים שגומרת שורטיסטים.","descEn":"Cost to Borrow (CTB), 365-day mark-to-market daily fee compounding, Short Rebate rates, and Payment-in-Lieu of dividends.","learnHe":"\n      <div class=\"did-you-know\">⏳ <strong>המלכודת השקטה של עולם השורט:</strong> עמלת ההשאלה (CTB) לא מחושבת על המחיר שבו פתחת את השורט — היא מחושבת כל יום מחדש על <strong>שווי השוק הנוכחי של המניה</strong>, ונגבית גם בשבת, בראשון ובחגים!</div>\n      <div class=\"section-title\">💸 נוסחת ה-CTB ואפקט המכפלה הכפולה</div>\n      <p class=\"prose\">ריבית ההשאלה השנתית (<strong>Cost to Borrow / Borrow Fee Rate</strong>) משתנה מדי יום לפי היצע וביקוש בשוק ההשאלות. החיוב היומי מחושב כך:</p>\n      <pre><code>Daily Borrow Fee = (Current Share Price × Shares × Annual CTB %) / 360</code></pre>\n      <div class=\"callout danger\">\n        <strong>🔥 למה שורטיסטים נמחקים מעמלות גם בלי Margin Call? (אפקט המכפלה הכפולה):</strong><br>\n        נניח שנכנסת לשורט על 1,000 מניות ב-<code>$10</code> כשה-CTB היה <code>15%</code>. העלות היומית שלך הייתה <strong>$4.16 ליום</strong>.<br>\n        עכשיו המניה זינקה ל-<code>$30</code> (פי 3) ובמקביל בגלל מחסור במניות ה-CTB זינק ל-<code>180%</code> (פי 12).<br>\n        החיוב היומי החדש שלך הוא <code>($30 × 1,000 × 180%) / 360 = $150 ליום!</code> — <strong>פי 36 יותר יקר לכל יום קלנדרי</strong>! על סוף שבוע אחד (שישי-שבת-ראשון, חיוב משולש ב-Triple-Swap של יום רביעי/שישי) תשלם <strong>$450</strong> רק כדי להישאר בפוזיציה!\n      </div>\n      <div class=\"section-title\">🏦 Short Rebate Rate וגזירת הקופון של הברוקרים</div>\n      <p class=\"prose\">כשאתה מוכר מניה בשורט ב-$10,000, נוצר בחשבון שלך מזומן משועבד (<strong>Short Sale Proceeds</strong>). קרנות גידור גדולות מקבלות מה-Prime Broker <strong>ריבית זכות (Positive Rebate)</strong> על המזומן הזה (ריבית הפד פחות עמלת ההשאלה). לעומת זאת, רוב הברוקרים הקמעונאיים <strong>לא משלמים לסוחר הקטן אגורה של ריבית זכות</strong>, אבל גובים ממנו 100% מעמלת ה-HTB (Negative Rebate)!</p>\n      <div class=\"section-title\">💣 דיבידנדים בשורט (Payment in Lieu) ונשק ה-Special Dividend</div>\n      <ul class=\"prose\">\n        <li><strong>מי משלם את הדיבידנד?</strong> מכיוון שהשאלת מניה מבעל מניות א׳ ומכרת אותה לקונה ב׳, החברה משלמת דיבידנד רק לקונה ב׳ (המחזיק הרשום). לכן, ביום ה-<strong>Ex-Dividend Date</strong>, הברוקר גובה ממך השורטיסט את מלוא סכום הדיבידנד במזומן ומעביר אותו למלווה א׳ כ-<code>Payment in Lieu of Dividend (PIL)</code>.</li>\n        <li><strong>מלכודת ה-Ex-Date:</strong> אם אתה מחזיק שורט בדקת הסגירה של הערב שלפני ה-Ex-Date — חויבת בדיבידנד המלא!</li>\n        <li><strong>נשק יום הדין — דיבידנד מיוחד / דיבידנד בעין (Special / Digital / Spin-off Dividend):</strong> חברות שנלחמות בשורטיסטים (כמו Overstock עם OSTKO או חברות שמחלקות מניות של חברת בת / Warrant Dividend) יוצרות מצב שבו השורטיסט חייב לספק למלווה נכס שאינו נסחר בקלות בשוק — מה שמוביל לריצת אמוק של סגירת שורטים לפני ה-Ex-Date!</li>\n      </ul>\n\n      <div class=\"sim-box\">\n        <div class=\"sim-head\">\n          <div class=\"sim-title\">🧮 סימולטור #1: מחשבון שחיקת CTB, סופ\"ש ונקודת איזון אמיתית</div>\n          <span class=\"sim-badge\">Interactive Calculator</span>\n        </div>\n        <div class=\"sim-body\">\n          <div class=\"sim-grid\">\n            <div class=\"sim-ctrl\"><div class=\"sim-ctrl-top\"><span>מחיר כניסה לשורט</span><span class=\"sim-ctrl-val\" id=\"val-ctb-entry\">$10.00</span></div><input type=\"range\" id=\"sim-ctb-entry\" min=\"2\" max=\"50\" step=\"0.5\" value=\"10\" oninput=\"updateCtbSim()\"></div>\n            <div class=\"sim-ctrl\"><div class=\"sim-ctrl-top\"><span>מחיר מניה נוכחי (Mark)</span><span class=\"sim-ctrl-val\" id=\"val-ctb-curr\">$18.00</span></div><input type=\"range\" id=\"sim-ctb-curr\" min=\"2\" max=\"60\" step=\"0.5\" value=\"18\" oninput=\"updateCtbSim()\"></div>\n            <div class=\"sim-ctrl\"><div class=\"sim-ctrl-top\"><span>כמות מניות בשורט</span><span class=\"sim-ctrl-val\" id=\"val-ctb-shares\">1,000</span></div><input type=\"range\" id=\"sim-ctb-shares\" min=\"100\" max=\"5000\" step=\"100\" value=\"1000\" oninput=\"updateCtbSim()\"></div>\n            <div class=\"sim-ctrl\"><div class=\"sim-ctrl-top\"><span>ריבית השאלה שנתית (CTB %)</span><span class=\"sim-ctrl-val\" id=\"val-ctb-rate\">85%</span></div><input type=\"range\" id=\"sim-ctb-rate\" min=\"1\" max=\"350\" step=\"1\" value=\"85\" oninput=\"updateCtbSim()\"></div>\n            <div class=\"sim-ctrl\"><div class=\"sim-ctrl-top\"><span>ימים קלנדריים בהחזקה</span><span class=\"sim-ctrl-val\" id=\"val-ctb-days\">30 ימים</span></div><input type=\"range\" id=\"sim-ctb-days\" min=\"1\" max=\"120\" step=\"1\" value=\"30\" oninput=\"updateCtbSim()\"></div>\n            <div class=\"sim-ctrl\"><div class=\"sim-ctrl-top\"><span>דיבידנד למניה בתקופה ($)</span><span class=\"sim-ctrl-val\" id=\"val-ctb-div\">$0.50</span></div><input type=\"range\" id=\"sim-ctb-div\" min=\"0\" max=\"5\" step=\"0.25\" value=\"0.5\" oninput=\"updateCtbSim()\"></div>\n          </div>\n          <div class=\"sim-kpi-grid\">\n            <div class=\"sim-kpi\"><div class=\"sim-kpi-val\" id=\"kpi-ctb-daily\">-$42.50</div><div class=\"sim-kpi-lbl\">עלות CTB ליום בודד</div></div>\n            <div class=\"sim-kpi\"><div class=\"sim-kpi-val\" id=\"kpi-ctb-wknd\">-$127.50</div><div class=\"sim-kpi-lbl\">קנס סופ\"ש (3 ימים)</div></div>\n            <div class=\"sim-kpi\"><div class=\"sim-kpi-val\" id=\"kpi-ctb-total\">-$1,775</div><div class=\"sim-kpi-lbl\">סה\"כ שחיקת עמלות+דיב׳</div></div>\n            <div class=\"sim-kpi\"><div class=\"sim-kpi-val\" id=\"kpi-ctb-be\">$8.23</div><div class=\"sim-kpi-lbl\">מחיר איזון חדש (Breakeven)</div></div>\n            <div class=\"sim-kpi\"><div class=\"sim-kpi-val\" id=\"kpi-ctb-pnl\">-$9,775</div><div class=\"sim-kpi-lbl\">רווח/הפסד נטו כולל</div></div>\n          </div>\n          <div class=\"sim-alert\" id=\"sim-ctb-alert\"></div>\n        </div>\n      </div>\n    ","learnEn":"\n      <div class=\"did-you-know\">⏳ <strong>The Silent Short Killer:</strong> Cost to Borrow (CTB) is NOT calculated on your entry price — it is recalculated daily on the <strong>current market price</strong> and charged 365 calendar days a year (including weekends)!</div>\n      <div class=\"section-title\">💸 The CTB Formula & Double Compounding Trap</div>\n      <pre><code>Daily Borrow Fee = (Current Share Price × Shares × Annual CTB %) / 360</code></pre>\n      <p class=\"prose\">When a stock triples in price AND its CTB jumps from 15% to 180%, your daily borrow fee multiplies by <strong>36x</strong>. In addition, if you hold short through an <strong>Ex-Dividend Date</strong>, you pay the full dividend out of your own cash (Payment in Lieu).</p>\n    ","cheatHe":[{"l":"נוסחת CTB יומית","t":"<code>(מחיר נוכחי × מניות × CTB%) / 360</code> — נגבה 365 ימים בשנה כולל שבת וראשון!"},{"l":"מלכודת יום רביעי/שישי","t":"החזקת שורט מעבר לסליקה של סוף השבוע מחייבת ב-<strong>3 ימי CTB בבת אחת</strong> (Triple Borrow Charge)."},{"l":"Payment in Lieu (דיבידנד)","t":"החזקת שורט בערב שלפני ה-Ex-Dividend Date מחייבת אותך לשלם את מלוא הדיבידנד מכיסך."}],"cheatEn":[{"l":"Daily CTB Formula","t":"<code>(Current Price × Shares × CTB%) / 360</code> — charged 365 calendar days/year!"},{"l":"Weekend Triple Charge","t":"Holding across weekend settlement incurs 3 full days of CTB fees."},{"l":"Payment in Lieu","t":"Holding short into the Ex-Dividend Date forces you to pay 100% of the dividend."}],"gameHe":[["CTB (Cost to Borrow)","ריבית השאלה שנתית המחושבת יומית לפי שווי השוק הנוכחי"],["Triple Charge","חיוב עמלת השאלה של 3 ימים עבור החזקה בסוף השבוע"],["Payment in Lieu (PIL)","תשלום דיבידנד שנגבה מחשבון השורטיסט ומועבר למלווה"],["Negative Rebate","מצב במניות HTB שבו עלות ההשאלה גבוהה מריבית הזכות על הבטוחה"],["Special Dividend Squeeze","חלוקת דיבידנד מיוחד שמאלצת שורטיסטים לסגור פוזיציות לפני ה-Ex-Date"]],"gameEn":[["CTB (Cost to Borrow)","Annualized borrow fee charged daily on current market value"],["Triple Charge","3-day borrow fee charged for holding short over the weekend"],["Payment in Lieu (PIL)","Dividend cash deducted from the short seller to pay the lender"],["Negative Rebate","When HTB borrow fees exceed interest earned on short proceeds"],["Special Dividend Squeeze","Non-standard dividend forcing shorts to cover before Ex-Date"]],"quiz":[{"qHe":"נכנסת לשורט על 1,000 מניות ב-$10. המניה עלתה ל-$20 וה-CTB השנתי הוא 180%. מה תהיה עמלת ההשאלה היומית שלך?","qEn":"You shorted 1,000 shares at $10. The stock is now $20 and CTB is 180%. What is your daily borrow fee?","optsHe":["$50 ליום (לפי מחיר כניסה $10)","$100 ליום (לפי מחיר שוק נוכחי $20)","$0 אם לא ביצעת פעולה","$20 ליום"],"optsEn":["$50/day (based on $10 entry)","$100/day (based on $20 current price)","$0 if you do not trade","$20/day"],"ans":1,"expHe":"החישוב נעשה תמיד לפי מחיר השוק הנוכחי (Mark-to-Market): ($20 × 1,000 × 1.80) / 360 = $100 לכל יום קלנדרי!"},{"qHe":"האם עמלת ההשאלה (CTB) נגבית גם על ימי שבת וראשון שבהם הבורסה סגורה?","qEn":"Is Cost to Borrow (CTB) charged for Saturdays and Sundays when the market is closed?","optsHe":["לא, רק בימי מסחר פעילים","כן, עמלת ההשאלה נגבית על כל 365 הימים הקלנדריים בשנה כולל סופי שבוע וחגים","רק אם המניה יורדת","רק בחשבונות מעל מיליון דולר"],"optsEn":["No, only trading days","Yes, borrow fees accrue 365 calendar days a year including weekends and holidays","Only if the stock drops","Only for institutional accounts"],"ans":1,"expHe":"השאלת ניירות ערך היא הלוואה פיננסית לכל דבר, ולכן המונה דופק 7 ימים בשבוע (כולל סופ\"ש וחגים)."},{"qHe":"מניה בשורט מחלקת דיבידנד של $1.50 למניה. מתי תחויב לשלם את הדיבידנד מכיסך?","qEn":"A shorted stock pays a $1.50 dividend. When are you liable to pay it out of pocket?","optsHe":["אם אתה מחזיק בפוזיציית השורט בסגירת המסחר של היום שלפני ה-Ex-Dividend Date (לתוך בוקר ה-Ex-Date)","רק אם פתחת את השורט לפני שנה","לעולם לא — החברה משלמת","רק אם סגרת את השורט ברווח"],"optsEn":["If you hold the short position overnight into the Ex-Dividend Date","Only if you shorted a year ago","Never — the company pays","Only if you close at a profit"],"ans":0,"expHe":"כל מי שמחזיק שורט פתוח בבוקר ה-Ex-Dividend Date מחויב לשלם למלווה Payment in Lieu בגובה הדיבידנד המלא."},{"qHe":"כיצד משפיע CTB גבוה לאורך זמן על מחיר האיזון (Breakeven) של השורטיסט?","qEn":"How does high CTB over time affect a short seller's breakeven price?","optsHe":["מעלה את מחיר האיזון","מנמיך את מחיר האיזון — המניה חייבת לרדת נמוך יותר רק כדי לכסות את העמלות שנצברו","לא משפיע על מחיר האיזון","מבטל את הצורך בבטוחות"],"optsEn":["Raises breakeven price","Lowers breakeven price — the stock must fall further just to cover accumulated fees","Does not affect breakeven","Eliminates margin requirements"],"ans":1,"expHe":"אם מכרת ב-$10 ושילמת $2.50 למניה בעמלות השאלה, אתה מפסיד כסף גם אם המניה ירדה ל-$8.00! נקודת האיזון שלך ירדה ל-$7.50."},{"qHe":"מדוע \"דיבידנד מיוחד\" (Special / Spin-off Dividend) מסוכן במיוחד לשורטיסטים?","qEn":"Why is a Special or Spin-off Dividend especially dangerous for short sellers?","optsHe":["כי הוא מקטין את מחיר המניה","כי הוא מאלץ שורטיסטים לשלם מזומן רב או לספק נייר ערך נדיר למלווה, מה שיוצר גל קניות כפוי לפני ה-Ex-Date","כי הוא מבטל את ה-Locate של מניות רגילות","הוא אינו משפיע על שורטיסטים"],"optsEn":["It lowers stock price","It forces shorts to pay huge cash or deliver scarce spin-off securities, triggering pre-Ex-Date covering","It cancels regular shares","It has no effect"],"ans":1,"expHe":"דיבידנד מיוחד גדול או דיבידנד של מניות חברת-בת/אופציות מחייב את השורטיסט להעביר למלווה את ההטבה או לסגור את השורט לפני ה-Ex-Date."}]},{"id":2,"num":"02","titleHe":"קו הכאב ו-Margin Call","titleEn":"The Pain Line & Margin Call","tagHe":"פרק 02 · פסיכולוגיה וחיסול כפוי","tagEn":"Chapter 02 · Liquidation Mechanics","descHe":"איך מזהים על הגרף את \"קו הכאב\" המצרפי של השורטיסטים, איך עובדת הקפצת House Margin של הברוקר, ומה ההבדל בין Margin Call לבין Share Recall ו-Forced Buy-In.","descEn":"How to spot the Short Pain Line on the chart, dynamic Broker House Margin hikes, and Share Recall vs Forced Buy-In.","learnHe":"\n      <div class=\"did-you-know\">🩸 <strong>מהו \"קו הכאב\" (The Pain Line)?</strong> זהו המחיר המדויק על הגרף שבו <strong>השורטיסט הממוצע עובר מרווח להפסד כבד</strong>, פקודות ה-Stop-Loss שלו מתרכזות, ומנוע הסיכונים של הברוקר מתחיל לשלוח התראות Margin Call!</div>\n      <div class=\"section-title\">📈 איך מוצאים את קו הכאב על הגרף? (3 שיטות מעשיות)</div>\n      <div class=\"grid-3\">\n        <div class=\"card\"><div class=\"card-icon\">🎯</div><div class=\"card-title\">1. Anchored VWAP מיום השיא</div><div class=\"card-body\">מתחו <code>Anchored VWAP</code> מהנר שבו היה מחזור המסחר (Volume) הגדול ביותר או מיום הדוח/החדשות שבו נפתחו רוב השורטים. כשמחיר המניה פורץ מעל ה-VWAP הזה — רוב השורטיסטים כלואים בהפסד!</div></div>\n        <div class=\"card\"><div class=\"card-icon\">🧱</div><div class=\"card-title\">2. תקרת התנגדות רב-יומית</div><div class=\"card-body\">שורטיסטים טכניים מציבים את ה-<code>Buy-Stop</code> שלהם סנטים ספורים מעל הגבוה של יום האתמול (HOD) או מעל התנגדות שבועית ברורה. פריצה שלה מפעילה אשד של פקודות קנייה אוטומטיות.</div></div>\n        <div class=\"card\"><div class=\"card-icon\">💣</div><div class=\"card-title\">3. מדרגות מחיר של הברוקרים ($5 / $10)</div><div class=\"card-body\">במניות מתחת ל-$5 דרישת הבטוחה היא לרוב מינימום <code>$2.50–$5.00 למניה</code> או 100%. כשהמניה חוצה מדרגות של 100% עלייה ממחיר ה-VWAP, מופעלים Margin Calls אוטומטיים.</div></div>\n      </div>\n      <div class=\"section-title\">⚖️ Initial Margin מול Maintenance Margin והקפצת House Margin</div>\n      <ul class=\"prose\">\n        <li><strong>Initial Margin (Reg T — 150%):</strong> כדי למכור בשורט מניות בשווי $10,000, עליך להחזיק את $10,000 תמורת השורט + <strong>50% הון עצמי נוסף ($5,000)</strong> = סה\"כ $15,000 בחשבון.</li>\n        <li><strong>Maintenance Margin (בטוחת תחזוקה):</strong> המינימום החוקי של FINRA הוא <code>30%</code> משווי השוק הנוכחי של הפוזיציה. אבל <strong>לכל ברוקר יש זכות חוזית להעלות את ה-House Margin מתי שירצה, ללא התראה מוקדמת!</strong></li>\n        <li><strong>מלכודת הקפצת ה-House Margin:</strong> מניה עולה מ-$10 ל-$18. חשבת שיש לך מספיק בטוחה לפי 30%. פתאום בצהריים הברוקר שולח הודעה: <em>\"עקב תנודתיות, דרישת הבטוחה הועלתה מ-30% ל-100% מיידית\"</em>. ברגע זה אתה ב-<strong>Margin Deficit מיידי</strong> והמערכת מחסלת לך את הפוזיציה בשיא!</li>\n      </ul>\n      <div class=\"section-title\">⚡ Margin Call מול Share Recall (Forced Buy-In)</div>\n      <div class=\"callout warn\">\n        <strong>הבדל קריטי שרוב הסוחרים לא מכירים:</strong><br>\n        • <strong>Margin Call Liquidation:</strong> קורה כי <em>נגמרו לך הבטוחות בחשבון</em>.<br>\n        • <strong>Share Recall & Forced Buy-In:</strong> קורה כי <em>המלווה המקורי מכר את המניה שלו או דרש אותה חזרה</em>, ולברוקר שלך אין מניות חלופיות להשאלה! במצב כזה, <strong>גם אם יש לך מיליון דולר מזומן פנוי בחשבון</strong>, הברוקר שולח פקודת קנייה כפויה (<code>Forced Buy-In</code>) בשוק וסוגר לך את השורט במחיר הכי גרוע שיש!\n      </div>\n\n      <div class=\"sim-box\">\n        <div class=\"sim-head\">\n          <div class=\"sim-title\">🩸 סימולטור #2: מחשבון קו הכאב, הקפצת House Margin וחיסול כפוי</div>\n          <span class=\"sim-badge\">Risk Engine Sim</span>\n        </div>\n        <div class=\"sim-body\">\n          <div class=\"sim-grid\">\n            <div class=\"sim-ctrl\"><div class=\"sim-ctrl-top\"><span>הון עצמי בתיק (Cash $)</span><span class=\"sim-ctrl-val\" id=\"val-pain-cash\">$15,000</span></div><input type=\"range\" id=\"sim-pain-cash\" min=\"5000\" max=\"50000\" step=\"1000\" value=\"15000\" oninput=\"updatePainSim()\"></div>\n            <div class=\"sim-ctrl\"><div class=\"sim-ctrl-top\"><span>מחיר כניסה לשורט (1,000 מניות)</span><span class=\"sim-ctrl-val\" id=\"val-pain-entry\">$10.00</span></div><input type=\"range\" id=\"sim-pain-entry\" min=\"5\" max=\"30\" step=\"0.5\" value=\"10\" oninput=\"updatePainSim()\"></div>\n            <div class=\"sim-ctrl\"><div class=\"sim-ctrl-top\"><span>מחיר מניה נוכחי בשוק</span><span class=\"sim-ctrl-val\" id=\"val-pain-curr\">$16.00</span></div><input type=\"range\" id=\"sim-pain-curr\" min=\"5\" max=\"40\" step=\"0.5\" value=\"16\" oninput=\"updatePainSim()\"></div>\n            <div class=\"sim-ctrl\"><div class=\"sim-ctrl-top\"><span>דרישת House Margin של הברוקר</span><span class=\"sim-ctrl-val\" id=\"val-pain-maint\">50%</span></div><input type=\"range\" id=\"sim-pain-maint\" min=\"30\" max=\"200\" step=\"10\" value=\"50\" oninput=\"updatePainSim()\"></div>\n          </div>\n          <div class=\"sim-kpi-grid\">\n            <div class=\"sim-kpi\"><div class=\"sim-kpi-val\" id=\"kpi-pain-pos\">$16,000</div><div class=\"sim-kpi-lbl\">שווי חוב המניות כרגע</div></div>\n            <div class=\"sim-kpi\"><div class=\"sim-kpi-val\" id=\"kpi-pain-eq\">$9,000</div><div class=\"sim-kpi-lbl\">הון עצמי נותר (Equity)</div></div>\n            <div class=\"sim-kpi\"><div class=\"sim-kpi-val\" id=\"kpi-pain-req\">$8,000</div><div class=\"sim-kpi-lbl\">בטוחה נדרשת ע\"י הברוקר</div></div>\n            <div class=\"sim-kpi\"><div class=\"sim-kpi-val\" id=\"kpi-pain-mcprice\">$16.67</div><div class=\"sim-kpi-lbl\">מחיר הפעלת Margin Call</div></div>\n          </div>\n          <div class=\"sim-alert\" id=\"sim-pain-alert\"></div>\n        </div>\n      </div>\n    ","learnEn":"\n      <div class=\"did-you-know\">🩸 <strong>What is \"The Pain Line\"?</strong> It is the exact chart level where the volume-weighted average short seller flips deeply underwater, stop-losses cluster, and broker risk engines trigger Margin Calls.</div>\n      <div class=\"section-title\">⚖️ Dynamic House Margin Hikes & Share Recalls</div>\n      <p class=\"prose\">Even if you meet FINRA's 30% minimum maintenance margin, brokers routinely hike <strong>House Margin</strong> to 100%–300% intraday during a squeeze. Furthermore, a <strong>Share Recall / Forced Buy-In</strong> can liquidate your short at market top even if you have plenty of cash, simply because the original lender recalled their shares!</p>\n    ","cheatHe":[{"l":"זיהוי קו הכאב (Pain Line)","t":"חפשו את ה-<strong>Anchored VWAP</strong> מנר המחזור הגבוה ביותר שבו נפתחו השורטים + רמות פריצה מעל High רב-יומי."},{"l":"הקפצת House Margin","t":"הברוקר רשאי להעלות את דרישת הבטוחה מ-30% ל-100%+ באמצע יום המסחר ולגרום להנזלה מיידית."},{"l":"Share Recall vs Margin Call","t":"ב-<strong>Share Recall</strong> הברוקר סוגר לך את השורט בכפייה כי המלווה משך את המניות — <strong>גם אם יש לך עודף מזומן בחשבון!</strong>"}],"cheatEn":[{"l":"Spotting the Pain Line","t":"Use <strong>Anchored VWAP</strong> from the highest volume shorting day + multi-day breakout levels."},{"l":"House Margin Hike","t":"Brokers can hike maintenance margin from 30% to 100%+ intraday without notice."},{"l":"Share Recall vs Margin Call","t":"A <strong>Share Recall</strong> forces a market buy-in even if you have excess cash in your account."}],"gameHe":[["קו הכאב (Pain Line)","המחיר שבו המסה הקריטית של השורטיסטים עוברת להפסד ולחץ סגירה"],["Anchored VWAP","מחיר ממוצע משוקלל נפח מנקודת ציון שבה נכנסו רוב השורטיסטים"],["House Margin Hike","העלאה פתאומית של דרישת הבטוחות על ידי הברוקר בזמן תנודתיות"],["Share Recall","דרישת המלווה לקבל חזרה את המניות המושאלות שלו"],["Forced Buy-In","קנייה כפויה במחירי שוק שמבצע הברוקר לסגירת שורט ללא אישור הסוחר"]],"gameEn":[["The Pain Line","Price level where the majority of shorts flip underwater and panic cover"],["Anchored VWAP","Volume-weighted average price anchored to major short-entry volume days"],["House Margin Hike","Sudden broker increase in required maintenance margin during volatility"],["Share Recall","When the institutional lender demands their loaned shares back"],["Forced Buy-In","Mandatory market buy order executed by the broker without trader consent"]],"quiz":[{"qHe":"מהו הכלי הטכני הטוב ביותר לאיתור מחיר הכניסה הממוצע (\"קו הכאב\") של שורטיסטים שנכנסו ביום חדשות סוער?","qEn":"What is the best technical tool to estimate the average entry price (\"Pain Line\") of shorts from a high-volume catalyst day?","optsHe":["RSI(14)","Anchored VWAP המעוגן ליום המחזור הגבוה שבו נפתחו השורטים","ממוצע נע 200 ימים","MACD"],"optsEn":["RSI(14)","Anchored VWAP from the high-volume catalyst day","200-day Moving Average","MACD"],"ans":1,"expHe":"Anchored VWAP משקלל את המחיר לפי נפח המסחר המדויק מאז תחילת האירוע, ולכן מייצג את מחיר הכניסה הממוצע האמיתי של השחקנים."},{"qHe":"האם ברוקר יכול לבצע לך Forced Buy-In (חיסול כפוי של השורט) גם אם יש לך עודף בטוחות ומזומן פנוי בחשבון?","qEn":"Can a broker execute a Forced Buy-In on your short position even if you have plenty of excess cash and margin?","optsHe":["לא, זה מנוגד לחוק","כן! אם המלווה ביצע Share Recall (ביקש את מניותיו חזרה) והברוקר לא מצא מניות חלופיות להשאלה","רק אם המניה ירדה ל-$0","רק בפקיעת אופציות שנתית"],"optsEn":["No, that is illegal","Yes! If the lender recalls their shares (Share Recall) and the broker cannot find replacement shares to borrow","Only if the stock hits $0","Only on options expiration"],"ans":1,"expHe":"Share Recall אינו תלוי במצב הבטוחות שלך. אם אין מניות להשאלה במאגר של הברוקר, הוא מחויב חוקית לקנות אותן בשוק כדי להחזירן למלווה."},{"qHe":"מה קורה כאשר ברוקר מקפיץ את דרישת ה-House Margin מ-30% ל-100% באמצע יום מסחר סוער?","qEn":"What happens when a broker hikes House Maintenance Margin from 30% to 100% intraday?","optsHe":["העמלה יורדת","סוחרים שהיו בטוחים עם 45% בטוחה נכנסים מיד ל-Margin Call ומונזלים במחירי שוק","המסחר במניה נעצר בבורסה","השורט הופך לפוזיציה פטורה ממס"],"optsEn":["Fees drop","Traders who were safe at 45% equity immediately fall into Margin Deficit and face forced liquidation","The exchange halts trading","The short becomes tax-free"],"ans":1,"expHe":"העלאת House Margin באמצע היום היא אחד הזרזים החזקים ביותר ל-Short Squeeze, כי היא מאלצת שורטיסטים לסגור פוזיציות בבת אחת."},{"qHe":"איזה סוג פקודה נוצר בשוק כאשר מופעל Stop-Loss או חיסול Margin Call על פוזיציית שורט?","qEn":"What type of order hits the market when a short seller's Stop-Loss or Margin Call liquidation triggers?","optsHe":["פקודת מכירה (Sell Order)","פקודת קנייה (Buy Order) שלוקחת נזילות מה-Ask ומקפיצה את המחיר עוד יותר למעלה","פקודת דיבידנד","פקודה מבוטלת"],"optsEn":["A Sell Order","A Buy Order that sweeps the Ask and pushes the price even higher","A Dividend Order","A Canceled Order"],"ans":1,"expHe":"סגירת שורט (Buy to Cover) היא קנייה לכל דבר! לכן כל שורטיסט שנשבר הופך בעל כורחו לקונה אגרסיבי שמזין את העלייה."},{"qHe":"לפי תקנת Reg T בארה\"ב, מהי דרישת ה-Initial Margin הסטנדרטית בפתיחת פוזיציית שורט?","qEn":"Under US Regulation T, what is the standard Initial Margin requirement when opening a short sale?","optsHe":["10% בלבד","150% (100% תמורת המכירה בשורט + 50% הון עצמי נוסף כבטוחה)","500%","0%"],"optsEn":["10% only","150% (100% short sale proceeds + 50% additional equity collateral)","500%","0%"],"ans":1,"expHe":"Reg T דורש 150% בעת פתיחת השורט: כל תמורת המכירה ננעלת בחשבון פלוס 50% נוספים מההון העצמי של הסוחר."}]}];

const CHAPTERS_3_5 = [{"id":3,"num":"03","titleHe":"המרות, אג\"ח להמרה ודילול","titleEn":"Convertibles, Warrants & Dilution","tagHe":"פרק 03 · הנדסה פיננסית ומלכודות","tagEn":"Chapter 03 · Financial Engineering","descHe":"ארביטראז' אג\"ח להמרה (Convertible Arbitrage), מימון רעיל (Death Spiral), ומדוע שורטיסטים שבונים על דילול מוורנטים נופלים למלכודת של Blockers ו-S-1 נעול!","descEn":"Convertible Arbitrage delta hedging, Death Spiral toxic financing, and why shorts betting on warrant dilution get trapped by 4.99% Blockers and locked S-1 filings.","learnHe":"\n      <div class=\"did-you-know\">🪤 <strong>הטעות שעולה לשורטיסטים ולונגיסטים מיליונים:</strong> לא כל מניה עם 30% שורט היא \"הימור שהחברה תקרוס\", ולא כל חברה עם 10 מיליון וורנטים בדוח יכולה לדלל את המניה היום! מי שלא מבין <strong>Convertibles, Blockers ו-S-1 Effect</strong> סוחר בעיניים עצומות.</div>\n      <div class=\"section-title\">🔄 1. ארביטראז' אג\"ח להמרה (Convertible Arbitrage — השורט הניטרלי)</div>\n      <p class=\"prose\">חברות ביומד, קריפטו וטכנולוגיה מנפיקות לעיתים קרובות <strong>אג\"ח להמרה (Convertible Senior Notes)</strong> לקרנות מוסדיות. הקרן שקנתה את האג\"ח מחזיקה למעשה באג\"ח + אופציית Call מובנית על המניה. כדי לנטרל את סיכון תנודת המניה ולהרוויח מהתנודתיות (Gamma) ומהקופון, הקרן מבצעת מיד <strong>שורט מגודר (Delta-Hedged Short)</strong> על מניית הבסיס!</p>\n      <div class=\"callout info\">\n        <strong>למה זה קריטי להבנה?</strong><br>\n        • <strong>מלכודת ללונגיסטים:</strong> סוחרים רואים <code>25% Short Interest</code> וחושבים \"הנה סקוויז קרוב!\". אבל אם 20% מתוכו שייך לקרנות Convertible Arbitrage — <strong>הן לעולם לא יקבלו Margin Call או Forced Buy-In</strong>, כי יש להן את האג\"ח להמרה ככיסוי מלא (Boxed / Covered Position)!<br>\n        • <strong>איך זה משפיע על המחיר?</strong> כשהמניה עולה, הדלתא של האג\"ח עולה והקרנות <em>מוכרות עוד בשורט</em> (מה שבולם עליות מתונות). כשהמניה יורדת, הדלתא יורדת והן <em>קונות חזרה שורט</em> (מה שתומך במחיר!).\n      </div>\n      <div class=\"section-title\">☠️ 2. Death Spiral Convertibles (מימון רעיל / ספירלת מוות)</div>\n      <p class=\"prose\">בחברות מיקרו-קאפ נואשות למזומן, קרנות \"מלווה של מוצא אחרון\" מעניקות הלוואות להמרה או מניות בכורה (Preferred Stock) עם <strong>מחיר המרה משתנה בדיסקאונט</strong> (למשל: <em>\"המרה לפי 80% ממחיר ה-VWAP הנמוך ביותר ב-10 הימים האחרונים\"</em>).</p>\n      <ul class=\"prose\">\n        <li><strong>מנגנון ההשמדה:</strong> ככל שמחיר המניה נמוך יותר — הקרן מקבלת <strong>יותר מניות</strong> תמורת אותו חוב! הקרן מוכרת בשורט אגרסיבי בשוק, מפילה את המחיר מ-$5 ל-$1, ממירה את החוב למיליוני מניות ב-$0.80 כדי לכסות את השורט שלה, ושוב מוכרת. זו עסקת החלומות של שורטיסטים שמצטרפים למגמת השחיקה.</li>\n      </ul>\n      <div class=\"section-title\">🪤 3. מלכודת ההמרה ההפוכה: כששורטיסט בונה על דילול ונתקע בסקוויז!</div>\n      <p class=\"prose\">שורטיסטים קוראים בדו\"ח הכספי (<code>10-Q / 424B5</code>) שלחברה יש 5 מיליון וורנטים (Warrants) במחיר מימוש $4.00. כשהמניה קופצת ל-$8.00, השורטיסט נכנס בכל הכוח בביטחון מוחלט: <em>\"מחזיקי הוורנטים ברווח 100%, הם ימירו עכשיו וירסקו את המניה!\"</em> — ואז המניה טסה ל-$25 והשורטיסט נמחק! <strong>למה הדילול לא הגיע?</strong></p>\n      <div class=\"grid-3\">\n        <div class=\"card\"><div class=\"card-icon\">🔒</div><div class=\"card-title\">מלכודת #1: S-1 אינו בתוקף</div><div class=\"card-body\">וורנטים שהונפקו ב-Private Placement (PIPE) מפיקים <strong>מניות חסומות (Restricted Shares)</strong>! עד שה-SEC לא מאשר את תשקיף ה-<code>S-1 / S-3 Resale</code> ומוציא הודעת <strong>Notice of Effectiveness (EFFECT)</strong> — אסור למחזיקים למכור בשוק!</div></div>\n        <div class=\"card\"><div class=\"card-icon\">🛑</div><div class=\"card-title\">מלכודת #2: Blocker של 4.99% / 9.99%</div><div class=\"card-body\">ברוב חוזי הוורנטים והאג\"ח יש סעיף <strong>Beneficial Ownership Blocker</strong> שאוסר על הקרן להחזיק מעל <code>4.99%</code> או <code>9.99%</code> מהחברה ברגע נתון. לכן היא לא יכולה להמיר הכל בבת אחת בפרה-מרקט.</div></div>\n        <div class=\"card\"><div class=\"card-icon\">🧮</div><div class=\"card-title\">מלכודת #3: Cashless Exercise</div><div class=\"card-body\">כשאין S-1 מאושר או כשמופעל סעיף <code>Cashless Exercise</code>, המחזיק מוותר על חלק מהמניות במקום לשלם מזומן לפי הנוסחה: <code>Shares × (Market - Strike) / Market</code>, מה שמקטין את כמות המניות שנכנסת לשוק.</div></div>\n      </div>\n\n      <div class=\"sim-box\">\n        <div class=\"sim-head\">\n          <div class=\"sim-title\">🔬 סימולטור #3: מנתח המרות, וורנטים, Blockers וסטטוס S-1</div>\n          <span class=\"sim-badge\">Dilution Trap Analyzer</span>\n        </div>\n        <div class=\"sim-body\">\n          <div class=\"sim-grid\">\n            <div class=\"sim-ctrl\"><div class=\"sim-ctrl-top\"><span>מחיר מניה בשוק ($)</span><span class=\"sim-ctrl-val\" id=\"val-conv-mkt\">$14.00</span></div><input type=\"range\" id=\"sim-conv-mkt\" min=\"2\" max=\"30\" step=\"0.5\" value=\"14\" oninput=\"updateConvSim()\"></div>\n            <div class=\"sim-ctrl\"><div class=\"sim-ctrl-top\"><span>מחיר המרה / מימוש וורנט ($)</span><span class=\"sim-ctrl-val\" id=\"val-conv-strike\">$8.00</span></div><input type=\"range\" id=\"sim-conv-strike\" min=\"2\" max=\"25\" step=\"0.5\" value=\"8\" oninput=\"updateConvSim()\"></div>\n            <div class=\"sim-ctrl\"><div class=\"sim-ctrl-top\"><span>מגבלת Beneficial Blocker</span><span class=\"sim-ctrl-val\" id=\"val-conv-blocker\">4.99%</span></div><input type=\"range\" id=\"sim-conv-blocker\" min=\"4.99\" max=\"9.99\" step=\"5\" value=\"4.99\" oninput=\"updateConvSim()\"></div>\n            <div class=\"sim-ctrl\"><div class=\"sim-ctrl-top\"><span>סטטוס רישום תשקיף SEC (S-1)</span></div>\n              <select id=\"sim-conv-s1\" onchange=\"updateConvSim()\">\n                <option value=\"locked\">🔒 PIPE נעול — טרם התקבל EFFECT ב-SEC</option>\n                <option value=\"effective\">✅ S-1 Effective — מניות רשומות למכירה</option>\n              </select>\n            </div>\n          </div>\n          <div class=\"sim-kpi-grid\">\n            <div class=\"sim-kpi\"><div class=\"sim-kpi-val\" id=\"kpi-conv-itm\">בכסף (ITM)</div><div class=\"sim-kpi-lbl\">מצב הוורנטים/אג\"ח</div></div>\n            <div class=\"sim-kpi\"><div class=\"sim-kpi-val\" id=\"kpi-conv-maxblk\">249,500</div><div class=\"sim-kpi-lbl\">מקסימום למנה (Blocker)</div></div>\n            <div class=\"sim-kpi\"><div class=\"sim-kpi-val\" id=\"kpi-conv-cashless\">1,285,714</div><div class=\"sim-kpi-lbl\">מניות ב-Cashless (מתוך 3M)</div></div>\n            <div class=\"sim-kpi\"><div class=\"sim-kpi-val\" id=\"kpi-conv-supply\">נעול — 0 היצע!</div><div class=\"sim-kpi-lbl\">היצע זמין כרגע לשוק</div></div>\n          </div>\n          <div class=\"sim-alert\" id=\"sim-conv-alert\"></div>\n        </div>\n      </div>\n    ","learnEn":"\n      <div class=\"did-you-know\">🪤 <strong>The Dilution Mirage:</strong> Just because a company has 5 million In-The-Money warrants on its balance sheet does NOT mean those shares can hit the market today! Unregistered PIPE shares without an SEC <code>EFFECT</code> filing are locked tight.</div>\n      <div class=\"section-title\">🔄 Convertible Arbitrage vs Toxic Death Spirals</div>\n      <p class=\"prose\">Institutional convertible bondholders short the stock to stay <strong>Delta-Neutral</strong> — their short positions are fully covered by their bonds and cannot be squeezed like naked retail shorts. Conversely, variable-rate <strong>Death Spiral Convertibles</strong> convert at a fixed discount to the lowest recent VWAP, incentivizing relentless shorting and dilution.</p>\n    ","cheatHe":[{"l":"Convertible Arbitrage","t":"שורט מגודר (Delta-Hedged) של מחזיקי אג\"ח להמרה — <strong>חסין מ-Margin Call</strong> ומנפח את נתון ה-Short Interest."},{"l":"מלכודת PIPE ו-S-1 נעול","t":"וורנטים מהנפקה פרטית אינם ניתנים למכירה בשוק החופשי עד שה-SEC מפרסם הודעת <strong>EFFECT</strong> על תשקיף הרישום!"},{"l":"4.99% / 9.99% Blocker","t":"מגביל את כמות המניות שקרן יכולה להחזיק ברגע נתון ומונע המרה של כל החוב בבת אחת."}],"cheatEn":[{"l":"Convertible Arbitrage","t":"Delta-hedged short held against convertible bonds — immune to forced squeeze buy-ins."},{"l":"Unregistered PIPE Trap","t":"Private placement warrants cannot be dumped until an S-1/S-3 receives an SEC <strong>EFFECT</strong> notice."},{"l":"4.99% / 9.99% Blocker","t":"Caps instantaneous beneficial ownership during warrant/note conversions."}],"gameHe":[["Convertible Arbitrage","קניית אג\"ח להמרה ומכירה בשורט של המניה לגידור דלתא"],["Death Spiral Convertible","חוב להמרה לפי אחוז הנחה ממחיר השוק הנוכחי היוצר ספירלת דילול"],["SEC EFFECT Filing","האישור הרשמי שמאפשר למניות מתשקיף S-1 להימכר בשוק החופשי"],["4.99% Ownership Blocker","סעיף חוזי המונע ממחזיק וורנטים להמיר מעבר ל-4.99% ממניות החברה ברגע נתון"],["Cashless Exercise","מימוש וורנטים ללא תשלום מזומן תמורת קבלת כמות מניות מופחתת"]],"gameEn":[["Convertible Arbitrage","Buying convertible bonds while shorting common stock to hedge delta"],["Death Spiral Convertible","Variable-priced debt converting at a discount to falling market prices"],["SEC EFFECT Filing","Official SEC notice declaring an S-1 resale registration statement effective"],["4.99% Ownership Blocker","Clause preventing a holder from owning more than 4.99% of shares at once"],["Cashless Exercise","Net-share warrant exercise without paying cash strike price"]],"quiz":[{"qHe":"מדוע פוזיציות שורט של קרנות Convertible Arbitrage אינן נחשבות \"דלק לסקוויז\" כמו שורט רגיל?","qEn":"Why are Convertible Arbitrage short positions not considered classic \"squeeze fuel\"?","optsHe":["כי הקרנות פטורות מחוקי הבורסה","כי השורט מגודר לחלוטין על ידי אג\"ח להמרה שהקרן מחזיקה (Covered/Boxed), ולכן היא אינה חשופה להפסד בלתי מוגבל או Forced Buy-In","כי אסור להן לסחור במניות טכנולוגיה","כי הן מחזיקות רק אופציות Put"],"optsEn":["They are exempt from exchange rules","Their short is hedged by convertible bonds they own, protecting them from unlimited loss or forced buy-ins","
