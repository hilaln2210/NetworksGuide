They cannot trade tech stocks","They only hold Puts"],"ans":1,"expHe":"מחזיק האג\"ח להמרה מוגן בעליות כי שווי האג\"ח שלו עולה במקביל להפסד בשורט, והוא יכול להמיר את האג\"ח למניות כדי לכסות את השורט."},{"qHe":"לחברה יש 4 מיליון וורנטים מ-PIPE פרטי במחיר מימוש $3.00, והמניה נסחרת כעת ב-$9.00. איזה מסמך ב-SEC קובע אם המחזיקים יכולים למכור את המניות בשוק עכשיו?","qEn":"A company has 4M private PIPE warrants at $3.00 strike and the stock is at $9.00. Which SEC filing determines if those shares can be sold on the open market right now?","optsHe":["טופס 10-K מלפני שנתיים","הודעת EFFECT המאשרת שתשקיף ה-S-1 / S-3 לרישום המניות נכנס לתוקף","הודעת 8-K על מינוי דירקטור","טופס Form 4"],"optsEn":["Form 10-K from two years ago","An SEC EFFECT notice declaring the S-1/S-3 resale registration effective","An 8-K director appointment","Form 4"],"ans":1,"expHe":"ללא הודעת EFFECT על תשקיף הרישום (או עמידה בתקופת החסימה של Rule 144), המניות מהנפקה פרטית חסומות למכירה בבורסה!"},{"qHe":"מה המשמעות של סעיף Beneficial Ownership Blocker של 4.99% בחוזה וורנטים?","qEn":"What does a 4.99% Beneficial Ownership Blocker in a warrant agreement do?","optsHe":["גובה מס של 4.99% על כל מכירה","אוסר על המחזיק להמיר וורנטים אם כתוצאה מכך יחזיק ביותר מ-4.99% ממניות החברה באותו רגע","מגביל את מחיר המניה לעלייה של 4.99% ביום","מחייב את החברה לחלק דיבידנד של 4.99%"],"optsEn":["Taxes sales at 4.99%","Prevents the holder from converting warrants if it would push their ownership above 4.99% at any given moment","Caps daily stock gains at 4.99%","Forces a 4.99% dividend"],"ans":1,"expHe":"ה-Blocker מונע מהקרן להפוך לבעל עניין (מעל 5% מחייב דיווח 13D/13G) ומאלץ אותה להמיר ולמכור במנות מדורגות."},{"qHe":"כיצד פועל מנגנון Death Spiral Convertible (מימון רעיל)?","qEn":"How does a Death Spiral Convertible work?","optsHe":["מחיר ההמרה קבוע וגבוה ב-200% ממחיר השוק","מחיר ההמרה מוצמד בהנחה קבועה (למשל 20% הנחה) למחיר השוק הנוכחי — ככל שהמניה יורדת, המלווה מקבל יותר מניות ומדלל את החברה למוות","החברה קונה חזרה מניות מהשוק","האג\"ח משלם ריבית רק אם המניה עולה"],"optsEn":["Fixed conversion price 200% above market","Conversion price resets at a discount to falling market prices — the lower the stock drops, the more shares the lender gets","The company buys back shares","Only pays interest if stock rises"],"ans":1,"expHe":"ככל שמחיר המניה יורד, אותו סכום חוב מומר לכמות אדירה יותר של מניות, מה שיוצר היצע אינסופי שמרסק את המניה."},{"qHe":"במימוש Cashless Exercise של 1,000,000 וורנטים עם מחיר מימוש $5 כאשר מחיר המניה בשוק הוא $10, כמה מניות יונפקו?","qEn":"In a standard Cashless Exercise of 1,000,000 warrants with a $5 strike when the stock price is $10, how many shares are issued?","optsHe":["1,000,000 מניות","500,000 מניות — לפי הנוסחה 1,000,000 × (10 - 5) / 10","2,000,000 מניות","0 מניות"],"optsEn":["1,000,000 shares","500,000 shares — per formula 1,000,000 × (10 - 5) / 10","2,000,000 shares","0 shares"],"ans":1,"expHe":"ב-Cashless Exercise המחזיק לא משלם את ה-$5 במזומן לחברה, אלא מוותר על מניות בשווי עלות המימוש ($5/$10 = חצי מהמניות) ומקבל 500,000 מניות נטו."}]},{"id":4,"num":"04","titleHe":"Float, SI% ו-Days to Cover","titleEn":"Float, SI% & Days to Cover","tagHe":"פרק 04 · המלכודות המספריות","tagEn":"Chapter 04 · Quantitative Traps","descHe":"ההבדל הקריטי בין Outstanding Shares ל-Effective Float, איחור הדיווח של FINRA, ומדוע Days to Cover חשוב פי 10 מאחוז השורט לבדו.","descEn":"The critical difference between Outstanding Shares and Effective Tradable Float, FINRA reporting lag, and why Days to Cover (DTC) rules supreme.","learnHe":"\n      <div class=\"did-you-know\">📊 <strong>אשליית ה-Float:</strong> באתרים חינמיים כתוב שה-Float של מניה הוא 15 מיליון מניות. אבל אם 12 מיליון מתוכן מוחזקות על ידי 3 קרנות הון-סיכון ובעלי עניין שלא מוכרים — <strong>ה-Effective Float האמיתי הוא 3 מיליון בלבד!</strong></div>\n      <div class=\"section-title\">🧅 3 שכבות המניות: Outstanding מול Float מול Effective Float</div>\n      <div class=\"table-wrap\"><table class=\"data-table\">\n        <thead><tr><th>מונח</th><th>מה הוא כולל?</th><th>הסכנה לשורטיסט</th></tr></thead>\n        <tbody>\n          <tr><td><strong>Total Shares Outstanding (TSO)</strong></td><td>כל המניות שהחברה הנפיקה (כולל מייסדים, מנכ\"ל וקרנות חסומות).</td><td>שימוש ב-TSO לחישוב אחוז שורט גורם לנתון להיראות קטן ומטעה.</td></tr>\n          <tr><td><strong>Public Float</strong></td><td>TSO פחות מניות חסומות רשמית של Insiders ובעלי שליטה מעל 10%.</td><td>עדיין כולל קרנות גידור/מוסדיים \"דביקים\" (13F/13G) שלא סוחרים יומית.</td></tr>\n          <tr><td><strong>Effective Tradable Float</strong></td><td>המניות שבאמת זזות בבורסה ביום-יום.</td><td>כשהשורט מגיע ל-50%+ מה-Effective Float — דלת היציאה צרה בצורה קיצונית!</td></tr>\n        </tbody>\n      </table></div>\n      <div class=\"section-title\">⏱️ Short Interest % מול Days to Cover (DTC)</div>\n      <p class=\"prose\">סוחרים מתחילים מסתכלים רק על <code>Short Interest % of Float (SI%)</code>. סוחרים מקצועיים מסתכלים על השילוב של <strong>SI% + Days to Cover (DTC)</strong>:</p>\n      <pre><code>Days to Cover (DTC) = Total Shorted Shares / Average Daily Trading Volume</code></pre>\n      <div class=\"callout danger\">\n        <strong>השוואה שמצילה תיקים:</strong><br>\n        • <strong>מניה א׳:</strong> שורט של <code>30%</code> מה-Float (3 מיליון מניות), אבל מחזור יומי ממוצע של <strong>30 מיליון מניות</strong> ← <code>DTC = 0.1 ימים</code>. השורטיסטים יכולים להתכסות תוך 35 דקות מסחר!<br>\n        • <strong>מניה ב׳:</strong> שורט של <code>18%</code> מה-Float (4 מיליון מניות), אבל מחזור יומי ממוצע של <strong>400 אלף מניות בלבד</strong> ← <code>DTC = 10 ימים!</code> אם תצא הודעה חיובית, לשורטיסטים ייקח <strong>שבועיים שלמים של 100% ממחזור המסחר</strong> רק כדי לקנות חזרה! זו חבית חומר נפץ.\n      </div>\n      <div class=\"section-title\">📡 פיגור הדיווח של FINRA מול נתוני זמן אמת (Utilization 100%)</div>\n      <ul class=\"prose\">\n        <li><strong>איחור FINRA:</strong> בורסות ארה\"ב ו-FINRA מפרסמות את נתון ה-Short Interest הרשמי רק <strong>פעמיים בחודש</strong>, ובאיחור של כ-8–10 ימים ממועד הסליקה! לסמוך על נתון FINRA במניה תנודתית זה כמו לנהוג ב-150 קמ\"ש תוך הסתכלות במראה האחורית בלבד.</li>\n        <li><strong>Utilization (ניצולת מאגר ההשאלה):</strong> אחוז המניות המושאלות מתוך סך המניות שהמוסדיים העמידו להשאלה. כש-<code>Utilization = 100%</code> — אין יותר מניות להשאלה אצל ה-Prime Brokers, וה-CTB מתחיל להמריא אקספוננציאלית.</li>\n      </ul>\n    ","learnEn":"\n      <div class=\"did-you-know\">📊 <strong>The Float Illusion:</strong> Free websites might show a 15M share float, but if 12M shares are locked in sticky 13G funds, the <strong>Effective Tradable Float is only 3M shares!</strong></div>\n      <div class=\"section-title\">⏱️ Why Days to Cover (DTC) Beats Raw Short Interest %</div>\n      <pre><code>Days to Cover (DTC) = Total Short Shares / Average Daily Volume</code></pre>\n      <p class=\"prose\">A stock with 18% SI and a <strong>10-day DTC</strong> is far more explosive than a stock with 30% SI that trades 10x its float every day (0.1 DTC). Also remember that official FINRA Short Interest is reported only twice a month with a ~10-day lag.</p>\n    ","cheatHe":[{"l":"Effective Float","t":"המניות החופשיות באמת בניכוי מוסדיים \"דביקים\" ובעלי עניין — לרוב קטן בהרבה מה-Float הרשמי."},{"l":"Days to Cover (DTC)","t":"<code>מניות בשורט / מחזור יומי ממוצע</code>. מעל 5–8 ימים = דלת יציאה צרה מאוד ומלכודת נזילות."},{"l":"100% Utilization","t":"100% ממאגר המניות להשאלה מנוצל — סימן מקדים לזינוק ב-CTB ול-Share Recalls."}],"cheatEn":[{"l":"Effective Float","t":"Truly liquid shares after removing sticky 13F/13G funds and insiders."},{"l":"Days to Cover (DTC)","t":"<code>Short Shares / Avg Daily Volume</code>. DTC > 5–8 days signals severe exit illiquidity."},{"l":"100% Utilization","t":"All lendable shares are borrowed — precursor to CTB spikes and recalls."}],"gameHe":[["Effective Float","כמות המניות הסחירות בפועל בניכוי אחזקות נעולות או דביקות"],["Days to Cover (DTC)","מספר ימי המסחר הממוצעים שיידרשו לכיסוי כל פוזיציות השורט"],["Utilization 100%","מצב שבו כל המניות הזמינות להשאלה אצל הברוקרים כבר נתפסו"],["FINRA Reporting Lag","עיכוב של כשבועיים בדיווח הרשמי של נתוני השורט בבורסה"],["Total Shares Outstanding","סך כל המניות שהחברה הנפיקה כולל מניות חסומות של מייסדים"]],"gameEn":[["Effective Float","Actual liquid shares trading daily excluding sticky institutional locks"],["Days to Cover (DTC)","Shorted shares divided by average daily trading volume"],["Utilization 100%","100% of available lendable supply is currently borrowed"],["FINRA Reporting Lag","Bi-weekly delay in official exchange short interest publication"],["Total Shares Outstanding","All issued shares including restricted insider holdings"]],"quiz":[{"qHe":"באיזו מהמניות הבאות לשורטיסטים יהיה קשה ומסוכן הרבה יותר לצאת מהפוזיציה במקרה של חדשות חיוביות?","qEn":"In which stock will short sellers face a much narrower and more dangerous exit door on positive news?","optsHe":["מניה עם 25% שורט ו-Days to Cover של 0.2 ימים","מניה עם 20% שורט ו-Days to Cover של 11 ימים","מניה עם 5% שורט ומחזור ענק","תעודת סל SPY"],"optsEn":["25% SI with 0.2 Days to Cover","20% SI with 11 Days to Cover","5% SI with huge volume","SPY ETF"],"ans":1,"expHe":"Days to Cover של 11 ימים אומר שכמות המניות בשורט גדולה פי 11 מהמחזור היומי הממוצע — אם כולם ינסו לקנות יחד, לא יהיו מוכרים בספר הפקודות!"},{"qHe":"באיזו תדירות מפרסמת FINRA את נתוני ה-Short Interest הרשמיים בארה\"ב?","qEn":"How often does FINRA publish official Short Interest data in the US?","optsHe":["כל דקה בזמן אמת","פעמיים בחודש בלבד (דו-שבועי) ובאיחור של כ-8 עד 10 ימים מתאריך הסליקה","פעם בשנה","בכל סוף יום מסחר ב-16:00"],"optsEn":["Every minute in real time","Only twice a month with an 8–10 day reporting lag","Once a year","Every day at 4:00 PM"],"ans":1,"expHe":"נתון ה-Short Interest הרשמי מפורסם רק פעמיים בחודש ובאיחור משמעותי, ולכן סוחרים נעזרים במערכות אומדן יומיות כגון Ortex ו-S3."},{"qHe":"מה המשמעות של Utilization = 100% במניה?","qEn":"What does 100% Utilization mean for a stock?","optsHe":["החברה מנצלת 100% מהמזומן שלה","100% מהמניות שגופים מוסדיים העמידו להשאלה כבר מושאלות כרגע — אין היצע פנוי להשאלה חדשה","100% מהסוחרים נמצאים ברווח","המניה עלתה ב-100%"],"optsEn":["Company used 100% of its cash","100% of lendable shares in prime broker pools are currently borrowed","100% of traders are profitable","Stock rose 100%"],"ans":1,"expHe":"כש-Utilization מגיע ל-100%, כל ביקוש נוסף לשורט מקפיץ את עמלת ה-CTB ומעלה דרמטית את הסיכון ל-Share Recalls."},{"qHe":"מהו ההבדל בין Public Float לבין Effective Tradable Float?","qEn":"What is the difference between Public Float and Effective Tradable Float?","optsHe":["אין הבדל","Effective Float מנכה גם אחזקות של קרנות ארוכות טווח/אסטרטגיות שאינן סוחרות ביומיום, ולכן מייצג את ההיצע האמיתי בספר הפקודות","Effective Float תמיד גדול פי 2 מ-Public Float","Public Float כולל רק אופציות"],"optsEn":["No difference","Effective Float subtracts sticky institutional/strategic holders who do not trade intraday, showing true order-book supply","Effective Float is 2x larger","Public Float only counts options"],"ans":1,"expHe":"כשרוב ה-Public Float מוחזק על ידי קרנות שלא מוכרות, כמות המניות שבאמת נסחרת בבורסה (Effective Float) זעירה ועלולה להוביל לסקוויז אלים."},{"qHe":"אם במניה יש 2,000,000 מניות בשורט והמחזור היומי הממוצע שלה הוא 250,000 מניות, מהו ה-Days to Cover שלה?","qEn":"If a stock has 2,000,000 shares shorted and an average daily volume of 250,000 shares, what is its Days to Cover?","optsHe":["0.125 ימים","8 ימים","2 ימים","25 ימים"],"optsEn":["0.125 days","8 days","2 days","25 days"],"ans":1,"expHe":"2,000,000 חלקי 250,000 = 8 ימי מסחר מלאים."}]},{"id":5,"num":"05","titleHe":"Short & Gamma Squeeze","titleEn":"Short & Gamma Squeeze","tagHe":"פרק 05 · אנטומיה של פיצוץ","tagEn":"Chapter 05 · Squeeze Cascade","descHe":"5 שלבי מפל ה-Short Squeeze, איך אופציות Call יוצרות Gamma Squeeze שמכריח עושי שוק לקנות מניות בכל מחיר, וניתוח מקרי האמת של פולקסווגן 2008 ו-GameStop 2021.","descEn":"The 5 stages of a Short Squeeze cascade, how OTM Call options trigger a Market Maker Gamma Squeeze loop, and the VW 2008 & GME 2021 case studies.","learnHe":"\n      <div class=\"did-you-know\">🚀 <strong>למה Short Squeeze נראה כמו טיל אנכי?</strong> כי בניגוד לעלייה רגילה שבה קונים מחפשים מניה זולה, ב-Squeeze הקונים הם <strong>קונים כפויים (Forced Buyers)</strong> — שורטיסטים בחיסול כפוי ועושי שוק באופציות שחייבים לקנות <em>בכל מחיר, בזה הרגע</em>!</div>\n      <div class=\"section-title\">⛓️ 5 השלבים של מפל ה-Short Squeeze (The Cascade)</div>\n      <ol class=\"prose\">\n        <li><strong>שלב 1 — הניצוץ (Catalyst & Float Lock):</strong> הודעה חיובית או זיהוי שמלאי המניות החופשיות (Effective Float) נעול ו-Utilization עומד על 100%.</li>\n        <li><strong>שלב 2 — חציית קו הכאב (Breaking the Pain Line):</strong> המניה פורצת את ה-Anchored VWAP ואת הגבוה הרב-יומי. 80%+ מהשורטיסטים עוברים להפסד.</li>\n        <li><strong>שלב 3 — אשד פקודות Stop-Loss (Buy-Stop Sweep):</strong> פקודות ההגנה של שורטיסטים מעל ההתנגדות מתבצעות כפקודות <code>Buy Market</code> שמנקות את צד ה-Ask בספר הפקודות.</li>\n        <li><strong>שלב 4 — הקפצת House Margin, Margin Calls ו-Forced Buy-Ins:</strong> הברוקרים מעלים דרישות בטוחה ל-100%–300% ושולחים פקודות קנייה אוטומטיות בשם הלקוחות.</li>\n        <li><strong>שלב 5 — ואקום נזילות (Order Book Vacuum):</strong> המוכרים הרגילים מושכים את פקודות המכירה שלהם כי הם רואים את המניה טסה, ונוצר \"כיס אוויר\" שבו המניה קופצת דולרים שלמים בין עסקה לעסקה!</li>\n      </ol>\n      <div class=\"section-title\">⚡ מנוע הטורבו: איך עובד Gamma Squeeze באופציות?</div>\n      <p class=\"prose\">כשסוחרים קונים בהמוניהם אופציות <strong>Call מחוץ לכסף (OTM Calls)</strong> לטווח קצר, הצד השני של העסקה הוא לרוב <strong>עושה שוק (Market Maker)</strong> שמכר להם את האופציה. עושה השוק אינו מהמר על כיוון — הוא חייב להישאר ניטרלי (<strong>Delta-Neutral</strong>)!</p>\n      <div class=\"callout danger\">\n        <strong>לולאת המשוב של הדלתא והגאמא (Delta-Gamma Feedback Loop):</strong><br>\n        1. סוחר קונה אופציית Call בסטרייק $20 כשהמניה ב-$12 (<code>Delta = 0.15</code>). עושה השוק קונה <strong>15 מניות</strong> על כל חוזה כדי לגדר את עצמו.<br>\n        2. המניה עולה ל-$18! בגלל ה-<strong>Gamma</strong> (קצב שינוי הדלתא), הדלתא של האופציה מזנקת מ-0.15 ל-<code>0.60</code>.<br>\n        3. עכשיו עושה השוק <strong>חייב לקנות מיד עוד 45 מניות</strong> בשוק על כל חוזה! הקנייה של עושה השוק דוחפת את המניה ל-$22, הדלתא עולה ל-<code>0.90</code>, והוא חייב לקנות עוד 30 מניות! שני מנועי קנייה כפויים (שורטיסטים + עושי שוק) מתנגשים בתוך Float נעול!\n      </div>\n      <div class=\"section-title\">🏛️ מקרי אמת היסטוריים: Volkswagen 2008 ו-GameStop 2021</div>\n      <div class=\"grid-2\">\n        <div class=\"card\"><div class=\"card-icon\">🚗</div><div class=\"card-title\">Volkswagen (אוקטובר 2008)</div><div class=\"card-body\">שורט שנראה סולידי: רק <code>12.8%</code> מסך המניות היו בשורט. אבל ממשלת סקסוניה החזיקה 20%, וברגע שפורשה חשפה ביום ראשון שהיא מחזיקה 42.6% במניות ועוד 31.5% באופציות — <strong>ה-Free Float האמיתי בשוק צנח ל-5.8% בלבד מול 12.8% שורט!</strong> פולקסווגן זינקה מ-€210 ל-€1,005 ביומיים והפכה לחברה היקרה בעולם!</div></div>\n        <div class=\"card\"><div class=\"card-icon\">🎮</div><div class=\"card-title\">GameStop — GME (ינואר 2021)</div><div class=\"card-body\">קרנות גידור (כמו Melvin Capital) מכרו בשורט מעל <code>140%</code> מה-Float הציבורי! שילוב של נעילת מניות קמעונאית עם קנייה מאסיבית של אופציות OTM Call יצר <strong>Short + Gamma Squeeze</strong> שהטיס את המניה מ-$4 ל-$483 ומחק מיליארדי דולרים לקרנות שורט.</div></div>\n      </div>\n\n      <div class=\"sim-box\">\n        <div class=\"sim-head\">\n          <div class=\"sim-title\">🚀 סימולטור #4: מחולל מפל Short + Gamma Squeeze</div>\n          <span class=\"sim-badge\">Cascade Simulator</span>\n        </div>\n        <div class=\"sim-body\">\n          <div class=\"sim-grid\">\n            <div class=\"sim-ctrl\"><div class=\"sim-ctrl-top\"><span>Effective Float סחיר (מיליונים)</span><span class=\"sim-ctrl-val\" id=\"val-sqz-float\">2.5M</span></div><input type=\"range\" id=\"sim-sqz-float\" min=\"0.5\" max=\"15\" step=\"0.5\" value=\"2.5\" oninput=\"updateSqzSim()\"></div>\n            <div class=\"sim-ctrl\"><div class=\"sim-ctrl-top\"><span>אחוז שורט מה-Float (SI%)</span><span class=\"sim-ctrl-val\" id=\"val-sqz-si\">38%</span></div><input type=\"range\" id=\"sim-sqz-si\" min=\"5\" max=\"120\" step=\"1\" value=\"38\" oninput=\"updateSqzSim()\"></div>\n            <div class=\"sim-ctrl\"><div class=\"sim-ctrl-top\"><span>חוזי Call שנרכשו (אלפים)</span><span class=\"sim-ctrl-val\" id=\"val-sqz-calls\">45K contracts</span></div><input type=\"range\" id=\"sim-sqz-calls\" min=\"0\" max=\"100\" step=\"5\" value=\"45\" oninput=\"updateSqzSim()\"></div>\n            <div class=\"sim-ctrl\"><div class=\"sim-ctrl-top\"><span>מחזור יומי ממוצע רגיל (מיליונים)</span><span class=\"sim-ctrl-val\" id=\"val-sqz-vol\">0.8M</span></div><input type=\"range\" id=\"sim-sqz-vol\" min=\"0.2\" max=\"10\" step=\"0.2\" value=\"0.8\" oninput=\"updateSqzSim()\"></div>\n          </div>\n          <div class=\"sim-kpi-grid\">\n            <div class=\"sim-kpi\"><div class=\"sim-kpi-val\" id=\"kpi-sqz-shorts\">0.95M</div><div class=\"sim-kpi-lbl\">מניות בשורט לכיסוי</div></div>\n            <div class=\"sim-kpi\"><div class=\"sim-kpi-val\" id=\"kpi-sqz-dtc\">1.2d</div><div class=\"sim-kpi-lbl\">Days to Cover (DTC)</div></div>\n            <div class=\"sim-kpi\"><div class=\"sim-kpi-val\" id=\"kpi-sqz-gamma\">2.48M</div><div class=\"sim-kpi-lbl\">קניית גידור דלתא (MM)</div></div>\n            <div class=\"sim-kpi\"><div class=\"sim-kpi-val\" id=\"kpi-sqz-ratio\">137%</div><div class=\"sim-kpi-lbl\">ביקוש כפוי מתוך ה-Float!</div></div>\n          </div>\n          <div class=\"sim-alert\" id=\"sim-sqz-alert\"></div>\n        </div>\n      </div>\n    ","learnEn":"\n      <div class=\"did-you-know\">🚀 <strong>Why Squeezes Go Vertical:</strong> In a squeeze, buyers are not value investors — they are <strong>price-insensitive forced buyers</strong> (liquidated shorts + delta-hedging options Market Makers)!</div>\n      <div class=\"section-title\">⚡ The Short + Gamma Squeeze Feedback Loop</div>\n      <p class=\"prose\">When traders buy OTM Call options, Market Makers who sold those calls must buy underlying shares to stay <strong>Delta-Neutral</strong>. As price rises, <strong>Gamma</strong> increases the option's Delta toward 1.00, forcing Market Makers to buy even more shares right as shorts are getting Margin Called (as seen in Volkswagen 2008 and GME 2021).</p>\n    ","cheatHe":[{"l":"Forced Buyers","t":"שורטיסטים ב-Margin Call ועושי שוק ב-Delta Hedging קונים <strong>ללא רגישות למחיר</strong> (Market Orders)."},{"l":"Gamma Squeeze","t":"עליית מחיר המניה מעלה את ה-Delta של אופציות Call ומכריחה את עושי השוק לקנות עוד מניות בסיס."},{"l":"לקח פולקסווגן 2008","t":"גם 12.8% שורט יכול להפוך לסקוויז היסטורי אם ה-<strong>Free Float האמיתי</strong> ננעל מתחת ל-6%!"}],"cheatEn":[{"l":"Forced Buyers","t":"Margin-called shorts and delta-hedging Market Makers buy via price-insensitive market orders."},{"l":"Gamma Squeeze","t":"Rising stock price increases Call option Delta, forcing MMs to buy more underlying stock."},{"l":"VW 2008 Lesson","t":"Even 12.8% SI caused a 400% squeeze because Porsche locked the effective free float below 6%."}],"gameHe":[["Gamma Squeeze","קנייה כפויה של מניות על ידי עושי שוק כדי לגדר אופציות Call שהדלתא שלהן עולה"],["Delta Hedging","קנייה או מכירה של נכס הבסיס על ידי עושה שוק כדי להישאר ניטרלי לכיוון המחיר"],["Order Book Vacuum","התרוקנות צד המוכרים (Ask) בספר הפקודות הגורמת לקפיצות מחיר חדות"],["Volkswagen Squeeze 2008","סקוויז היסטורי שנגרם כאשר פורשה נעלה בסתר מעל 94% מהמניות מול 12.8% שורט"],["Buy-Stop Cascade","הפעלת שרשרת של פקודות Stop-Loss של שורטיסטים מעל רמת התנגדות"]],"gameEn":[["Gamma Squeeze","Forced stock buying by Market Makers hedging rising Call option delta"],["Delta Hedging","Buying/selling underlying shares to keep an options book market-neutral"],["Order Book Vacuum","When sellers pull Ask orders, causing vertical air-pocket price jumps"],["Volkswagen Squeeze 2008","Historic squeeze where <6% free float remained against 12.8% short interest"],["Buy-Stop Cascade","Chain reaction of short stop-loss market buy orders above resistance"]],"quiz":[{"qHe":"מדוע עושי שוק (Market Makers) קונים מניות בזמן Gamma Squeeze?","qEn":"Why do options Market Makers buy shares during a Gamma Squeeze?","optsHe":["כי הם רוצים להמר שהמניה תעלה","כי הם מכרו אופציות Call לסוחרים, וכשהמניה עולה ה-Delta של האופציות גדלה והם חייבים לקנות מניות כדי להישאר Delta-Neutral","כי ה-SEC מחייב אותם לקנות","כדי לחלק דיבידנד"],"optsEn":["They want to gamble on upside","They sold Call options, and as stock price rises, option Delta increases so they must buy shares to stay Delta-Neutral","The SEC forces them","To collect dividends"],"ans":1,"expHe":"עושה שוק שמכר אופציית Call חשוף לעליית המניה. ככל שהמניה עולה והאופציה מתקרבת לכסף (בגלל ה-Gamma), ה-Delta עולה לכיוון 100 מניות לחוזה ועושה השוק חייב לקנות אותן בשוק."},{"qHe":"מה היה הגורם המרכזי ל-Short Squeeze האדיר במניית פולקסווגן (VW) בשנת 2008 למרות שאחוז השורט היה רק 12.8%?","qEn":"What caused the massive 2008 Volkswagen short squeeze despite Short Interest being only 12.8%?","optsHe":["החברה גילתה זהב","פורשה וממשלת סקסוניה נעלו יחד מעל 94% ממניות החברה, כך שנשארו פחות מ-6% מניות חופשיות בשוק מול 12.8% שורט","ה-CTB היה 0%","הבורסה נסגרה לחודש"],"optsEn":["They discovered gold","Porsche and Lower Saxony locked up >94% of shares, leaving <6% free float for 12.8% shorts to cover","CTB was 0%","Market closed for a month"],"ans":1,"expHe":"כשכמות המניות בשורט (12.8%) הייתה כפולה מכל המניות החופשיות שנותרו בשוק (<6%), מתמטית לא היו מספיק מניות כדי שכל השורטיסטים יסגרו!"},{"qHe":"מהו \"Order Book Vacuum\" (ואקום בספר הפקודות) בזמן Short Squeeze?","qEn":"What is an \"Order Book Vacuum\" during a Short Squeeze?","optsHe":["מצב שבו אין קונים במניה","מצב שבו מוכרים מושכים את פקודות ה-Limit Sell שלהם בזמן שפקודות Buy Market כפויות מנקות את ספר הפקודות ומקפיצות את המחיר אנכית","תקלה בשרתי הבורסה","איפוס עמלות הברוקר"],"optsEn":["No buyers in the stock","Sellers pull Limit Sell orders while forced Market Buy orders sweep thin Ask liquidity","Exchange server crash","Zero broker fees"],"ans":1,"expHe":"כשקונים כפויים חייבים לקנות בכל מחיר (Market Buy) ואין פקודות מכירה קרובות ב-Level 2, המחיר מדלג מדרגות שלמות בשניות."},{"qHe":"כמה מניות מייצג חוזה אופציית Call סטנדרטי אחד בארה\"ב כאשר הדלתא שלו מגיעה ל-1.00 (עמוק בכסף)?","qEn":"How many underlying shares does 1 standard US Call option contract represent when its Delta reaches 1.00?","optsHe":["10 מניות","100 מניות","1,000 מניות","מניה אחת"],"optsEn":["10 shares","100 shares","1,000 shares","1 share"],"ans":1,"expHe":"כל חוזה אופציה סטנדרטי מייצג 100 מניות. לכן 50,000 חוזי Call שנכנסים לכסף מחייבים גידור של עד 5,000,000 מניות!"},{"qHe":"מה קורה לדלתא (Delta) של אופציית Call מחוץ לכסף (OTM) כאשר מחיר המניה מזנק בחדות לכיוון מחיר המימוש?","qEn":"What happens to the Delta of an Out-of-the-Money (OTM) Call option when the stock price surges toward the strike price?","optsHe":["הדלתא יורדת ל-0","הדלתא עולה בחדות (בגלל ה-Gamma), מה שמחייב את עושה השוק לקנות עוד מניות בסיס","הדלתא הופכת לשלילית","הדלתא לא משתנה לעולם"],"optsEn":["Delta drops to 0","Delta rises sharply (due to Gamma), forcing the Market Maker to buy more shares","Delta turns negative","Delta never changes"],"ans":1,"expHe":"Gamma מודדת את קצב השינוי של ה-Delta. כשהמניה מתקרבת לסטרייק, הגאמא בשיאה והדלתא מזנקת, מה שמייצר קנייה כפויה מואצת."}]}];

const CHAPTERS_6_9 = [{"id":6,"num":"06","titleHe":"מלכודות שורט במיקרו-קאפ","titleEn":"Micro-Cap Short Traps","tagHe":"פרק 06 · המלכודות שמוחקות תיקים","tagEn":"Chapter 06 · Deadly Micro-Cap Traps","descHe":"מלכודת ה-Baby Shelf (מגבלת גיוס 1/3), מלכודת ה-Reverse Split (איחוד הון שנועל Float זעיר), הפסקות מסחר (LULD Halts), וגאפים בפרה-מרקט ללא הגנה.","descEn":"The Baby Shelf S-3 trap, Post-Reverse Split float lock traps, LULD Volatility Halts, and Pre-Market / After-Hours illiquidity.","learnHe":"\n      <div class=\"did-you-know\">💣 <strong>למה 90% ממחיקות התיקים של שורטיסטים קורות במניות Micro-Cap (שווי שוק מתחת ל-$50M)?</strong> כי שורטיסטים מניחים ש\"כל חברה קטנה תנפיק מניות עוד מעט וותרסק\" — בלי להכיר את <strong>4 המלכודות הרגולטוריות והמבניות</strong> שמונעות מהחברה להנפיק!</div>\n      <div class=\"section-title\">🪤 מלכודת #1: חוק ה-Baby Shelf (Form S-3 Instruction I.B.6)</div>\n      <p class=\"prose\">שורטיסט רואה שלחברה יש תשקיף מדף פעיל (<strong>Shelf Registration S-3</strong>) על סך $100 מיליון, ובטוח שהחברה תמכור מניות ב-ATM (At-The-Market) ותפיל את המחיר. <strong>אבל הוא שכח לבדוק את כלל ה-Baby Shelf של ה-SEC!</strong></p>\n      <div class=\"callout danger\">\n        <strong>מה אומר חוק ה-Baby Shelf?</strong><br>\n        אם שווי המניות הציבוריות של החברה (Public Float Market Cap) נמוך מ-<strong>$75 מיליון</strong>, החברה רשאית לגייס לכל היותר <strong>שליש (1/3) משווי ה-Float שלה ב-12 חודשים!</strong><br>\n        אם החברה כבר ניצלה את תקרת ה-1/3 שלה בחודש שעבר — <strong>ה-ATM וה-S-3 שלה משותקים לחלוטין!</strong> אסור לה חוקית למכור אפילו מניה אחת עד שה-Float שלה יעלה מעל $75M. השורטיסט שמחכה להנפקה נלכד בסקוויז אלים ללא שום מוכר מהחברה!\n      </div>\n      <div class=\"section-title\">🪤 מלכודת #2: מלכודת איחוד ההון (Post-Reverse Split Float Lock)</div>\n      <p class=\"prose\">חברה שנמצאת מתחת ל-$1.00 מבצעת <strong>Reverse Split (איחוד הון)</strong> ביחס של <code>1-ל-25</code> כדי לעמוד בתנאי הסף של נאסד\"ק. שורטיסטים מתים על שורט אחרי איחוד הון — אבל בימים הראשונים אחרי ה-Reverse Split מתרחשים 3 דברים קטלניים:</p>\n      <ul class=\"prose\">\n        <li><strong>צניחת ה-Float למימדים מיקרוסקופיים:</strong> Float של 10 מיליון מניות הופך פתאום ל-<strong>400,000 מניות בלבד!</strong> קרן אחת או קבוצת סוחרים קונה 200 אלף מניות ונועלת את כל סחורת השוק.</li>\n        <li><strong>החלפת מספר CUSIP ועיכוב במערכות הברוקרים:</strong> בזמן החלפת ה-CUSIP, מניות רבות של מחזיקים קיימים מוקפאות זמנית בארגון מחדש (Reorg), ולכן אין מוכרים ואין השאלות!</li>\n        <li><strong>עיגול שברי מניות כלפי מעלה (Round-Up Arbitrage):</strong> חברות שמעגלות שברי מניות כלפי מעלה יוצרות ביקוש טכני ומנעול היצע ביום האקס של האיחוד.</li>\n      </ul>\n      <div class=\"section-title\">🪤 מלכודת #3: הפסקות מסחר לתנודתיות (LULD Halts) ו-Pre-Market</div>\n      <div class=\"grid-2\">\n        <div class=\"card\"><div class=\"card-icon\">⏸️</div><div class=\"card-title\">מלכודת ה-LULD Halt</div><div class=\"card-body\">כאשר מניה מזנקת מהר מדי (למשל 10%–20% ב-5 דקות), הבורסה עוצרת את המסחר ל-5 דקות (<code>Code M / LULD Pause</code>). שורטיסט שנכנס שניה לפני ה-Halt ב-$6.00 עם פקודת Stop-Market ב-$6.50 מגלה שהמניה נפתחת מה-Halt ב-<strong>Gap ישיר ל-$11.50</strong> — הפקודה שלו מתבצעת ב-$11.50 עם <strong>Slippage קטלני של 90%</strong>!</div></div>\n        <div class=\"card\"><div class=\"card-icon\">🌙</div><div class=\"card-title\">מלכודת ה-Pre-Market / After-Hours</div><div class=\"card-body\">בשעות שלפני פתיחת המסחר (04:00–09:30) ואחרי הסגירה (16:00–20:00) <strong>אין הפסקות מסחר LULD!</strong> ספר הפקודות דליל פי 20, והמניה יכולה לקפוץ מ-$3 ל-$28 בדקות ספורות על ידי אלגוריתמים שמזהים שורטיסטים לכודים.</div></div>\n      </div>\n    ","learnEn":"\n      <div class=\"did-you-know\">💣 <strong>Why Micro-Caps Wipe Out Short Sellers:</strong> Shorts assume every small-cap bounce will instantly be diluted by an offering — ignoring regulatory caps like the <strong>SEC Baby Shelf Rule</strong>!</div>\n      <div class=\"section-title\">🪤 The Baby Shelf Trap, Reverse Splits & LULD Halts</div>\n      <ul class=\"prose\">\n        <li><strong>Baby Shelf Rule (S-3 Instruction I.B.6):</strong> Companies with public float under $75M can only raise <strong>1/3 of their float</strong> over 12 months via S-3/ATM. Once maxed out, they cannot dilute!</li>\n        <li><strong>Reverse Split Trap:</strong> A 1-for-25 reverse split shrinks a 10M float to just 400,000 shares while changing the CUSIP and freezing broker shares in reorganization.</li>\n        <li><strong>LULD Halts & Extended Hours:</strong> During a Limit-Up Limit-Down halt, a $6 stock can reopen at $11.50, filling Stop-Market orders at catastrophic slippage. In Pre-Market/After-Hours, there are <strong>no LULD halts at all</strong>!</li>\n      </ul>\n    ","cheatHe":[{"l":"חוק ה-Baby Shelf","t":"חברה עם Float מתחת ל-<strong>$75M</strong> מוגבלת לגיוס של עד <strong>1/3 משווי ה-Float</strong> ב-12 חודשים ב-S-3/ATM."},{"l":"מלכודת Reverse Split","t":"איחוד הון מקווץ את ה-Float למאות אלפי מניות בודדות ומקפיא סחורה ב-CUSIP Reorg."},{"l":"LULD Halts & Pre-Market","t":"ב-Halt המניה יכולה להיפתח ב-Gap ענק מעל ה-Stop שלך; בפרה-מרקט אין הגנת LULD בכלל!"}],"cheatEn":[{"l":"Baby Shelf Rule","t":"Under $75M public float, S-3/ATM dilution is capped at <strong>1/3 of float value</strong> per 12 months."},{"l":"Reverse Split Trap","t":"Shrinks float to tiny levels and temporarily locks shares during CUSIP reorganization."},{"l":"LULD Halts & Extended Hours","t":"Halt resumptions gap past stops; Pre-Market has zero LULD halt protection."}],"gameHe":[["Baby Shelf Rule","מגבלת SEC המתירה לחברות עם Float מתחת ל-75M$ לגייס עד שליש בלבד ב-S-3"],["Reverse Split Trap","כיווץ ה-Float למספר מניות זעיר מיד לאחר איחוד הון המוביל לסקוויז"],["LULD Halt","הפסקת מסחר אוטומטית של 5 דקות עקב תנודת מחיר קיצונית"],["CUSIP Change","החלפת מספר הזיהוי של המניה באיחוד הון הגורמת לעיכובי סליקה והשאלה"],["Pre-Market Squeeze","זינוק בשעות הטרום-מסחר שבהן אין הפסקות LULD והנזילות דלילה"]],"gameEn":[["Baby Shelf Rule","SEC rule capping S-3 raises at 1/3 of public float when float is under $75M"],["Reverse Split Trap","Ultra-low float lock immediately following a reverse stock split"],["LULD Halt","5-minute exchange volatility pause (Limit Up-Limit Down)"],["CUSIP Change","Security ID change during corporate actions that freezes share availability"],["Pre-Market Squeeze","Extended-hours spike where LULD halts do not exist and liquidity is thin"]],"quiz":[{"qHe":"מה קובע חוק ה-Baby Shelf (General Instruction I.B.6) לגבי חברה ששווי ה-Public Float שלה הוא $30 מיליון?","qEn":"What does the SEC Baby Shelf Rule state for a company with a $30M public float?","optsHe":["אסור לה להיסחר בנאסד\"ק","היא רשאית לגייס באמצעות תשקיף מדף (S-3 / ATM) לכל היותר שליש ($10 מיליון) משווי ה-Float שלה בתקופה של 12 חודשים","מותר לה לגייס מיליארד דולר","אסור לעשות עליה שורט"],"optsEn":["It cannot trade on Nasdaq","It can raise at most 1/3 ($10M) of its public float over 12 months via S-3/ATM","It can raise $1B","It cannot be shorted"],"ans":1,"expHe":"כל עוד ה-Float מתחת ל-$75M, החברה מוגבלת ל-1/3. אם כבר ניצלה את המכסה, היא לא יכולה להנפיק מניות נוספות ב-ATM והשורטיסטים נלכדים!"},{"qHe":"מדוע ביצוע שורט ביום הראשון שלאחר איחוד הון (Reverse Split) של 1-ל-30 הוא מסוכן ביותר?","qEn":"Why is shorting on Day 1 immediately after a 1-for-30 Reverse Split extremely dangerous?","optsHe":["כי החברה הופכת לרווחית מיד","כי ה-Float מתכווץ פי 30 לכמות מניות זעירה, החלפת ה-CUSIP מעכבת נזילות אצל ברוקרים, וקל מאוד לנעול את כל ההיצע","כי עמלת הברוקר יורדת ל-0","כי אסור לקנות מניות אחרי איחוד הון"],"optsEn":["The company becomes profitable","The float shrinks 30x to a tiny share count while CUSIP changes delay broker inventory","Broker fees drop to 0","Buying is banned"],"ans":1,"expHe":"איחוד הון חותך את כמות המניות הסחירות למינימום, ובזמן שמערכות הסליקה מעדכנות את ה-CUSIP החדש נוצר מחסור חמור במניות שמוביל לסקוויזים של מאות אחוזים."},{"qHe":"מה הסכנה בפקודת Buy Stop-Market להגנה על שורט כאשר המניה נכנסת להפסקת מסחר בעלייה (LULD Halt)?","qEn":"What is the danger of a Buy Stop-Market order protecting a short when the stock enters an upward LULD Halt?","optsHe":["הפקודה תמיד מבוטלת אוטומטית","כשהמסחר מתחדש ב-Gap גבוה מעל מחיר ה-Stop (למשל פתיחה ב-$12 במקום $7), הפקודה מתבצעת במחיר הפתיחה הגבוה וגורמת להפסד כפול מהמתוכנן","הפקודה מתבצעת תמיד במחיר ה-Stop המדויק","הברוקר סופג את ההפרש"],"optsEn":["The order is auto-canceled","When trading resumes with an upward Gap (e.g. $12 instead of $7), the Market order fills at $12 with massive slippage","It guarantees your exact stop price","The broker pays the difference"],"ans":1,"expHe":"פקודת Stop-Market הופכת לפקודת Market ברגע שהמחיר נוגע בטריגר או נפתח מעליו, ולכן בגאפ פתיחה מ-Halt היא תתבצע במחיר השיא של הפתיחה."},{"qHe":"האם קיימות הפסקות מסחר לתנודתיות (LULD Halts) בשעות ה-Pre-Market (04:00–09:30) וה-After-Hours (16:00–20:00)?","qEn":"Do LULD volatility halts operate during Pre-Market (4:00–9:30 AM) and After-Hours (4:00–8:00 PM)?","optsHe":["כן, בדיוק כמו במסחר הרציף","לא! מנגנון ה-LULD פועל רק בשעות המסחר הרגילות (09:30–16:00), ולכן בפרה-מרקט מניה יכולה לזנק 300% בדקות ללא שום עצירה","רק בימי שני","רק במניות S&P 500"],"optsEn":["Yes, same as regular hours","No! LULD halts only operate during regular trading hours (9:30 AM–4:00 PM ET)","Only on Mondays","Only for S&P 500 stocks"],"ans":1,"expHe":"מחוץ לשעות המסחר הרגילות אין מנגנון LULD, ולכן תנועות המחיר בשעות אלו חדות ואלימות במיוחד על נזילות דלילה."},{"qHe":"איזו הפתעה עלולה לתפוס שורטיסט שמצפה להנפקה מדללת במניית ביומד שמזנקת לאחר תוצאות ניסוי?","qEn":"What surprise can trap a short seller expecting a dilutive offering on a biotech stock surging after trial results?","optsHe":["גיוס Priced Above-the-Market או השקעה אסטרטגית מפרמיה של חברת פארמה גדולה שמטיסה את המניה עוד יותר","ירידת ריבית הפד","שינוי לוגו החברה","חלוקת דוחות בדואר"],"optsEn":["An Above-the-Market offering or strategic pharma partnership at a premium","Fed rate cut","Logo change","Mail reports"],"ans":0,"expHe":"כשלחברה יש חדשות פונדמנטליות אמיתיות או שותף אסטרטגי, הגיוס יכול להתבצע בפרמיה או להיתפס כחיובי מאוד (ניקוי סכנת המזומן), מה שמרסק את השורטיסטים."}]},{"id":7,"num":"07","titleHe":"מתי ואיך שורטיסטים מרוויחים","titleEn":"How Pro Shorts Win Big","tagHe":"פרק 07 · הצד המנצח של השורט","tagEn":"Chapter 07 · Winning Short Playbook","descHe":"הסודות של השורטיסטים המרוויחים בעולם: שורט פונדמנטלי וחשיפת הונאות, חוק הזהב של Frontside מול Backside בגרף, וניצול אירועי פתיחת היצע (Lock-up & S-1 Effect).","descEn":"How professional short sellers profit consistently: Fundamental fraud hunting, the Golden Rule of Frontside vs Backside, and Supply Unlock catalysts.","learnHe":"\n      <div class=\"did-you-know\">🏆 <strong>הסוד של שורטיסטים מקצועיים:</strong> שורטיסט חובב מנסה לנחש איפה השיא בזמן שהמניה טסה למעלה (<strong>Frontside</strong>). שורטיסט מקצועי נותן לסקוויז להסתיים, מחכה לשבירת מבנה וללונגיסטים לכודים, ונכנס רק בצד היורד (<strong>Backside</strong>)!</div>\n      <div class=\"section-title\">📐 חוק הזהב הטכני: Frontside מול Backside</div>\n      <div class=\"grid-2\">\n        <div class=\"card\"><div class=\"card-icon\">🔥</div><div class=\"card-title\">Frontside (הצד העולה — אסור לגעת!)</div><div class=\"card-body\">המניה מעל ה-<code>VWAP</code>, מייצרת שיאים ושפלים עולים (Higher Highs & Higher Lows), והמחזור מתרחב בכל פריצה. <strong>מי שעושה שורט ב-Frontside הוא הדלק שמזין את העלייה!</strong></div></div>\n        <div class=\"card\"><div class=\"card-icon\">📉</div><div class=\"card-title\">Backside (הצד היורד — אזור הציד!)</div><div class=\"card-body\">אחרי נר פאניקה קיצוני (<strong>Blow-off Top / Exhaustion Volume</strong>), המניה שוברת את ה-<code>VWAP</code> למטה, מנסה לעלות שוב ונכשלת בשיא נמוך יותר (<strong>Lower High</strong>). כעת כל מי שקנה בשיא לכוד בהפסד (Overhead Supply) ומוכר בכל תיקון למעלה!</div></div>\n      </div>\n      <div class=\"section-title\">🕵️‍♂️ שורט פונדמנטלי ואקטיביסטי (Hindenburg / Chanos Playbook)</div>\n      <p class=\"prose\">קרנות שורט מחקריות מחפשות חברות שבהן הפער בין הסיפור למציאות החשבונאית בלתי ניתן לגישור:</p>\n      <ul class=\"prose\">\n        <li><strong>פער בין רווח חשבונאי לתזרים מזומנים (Operating Cash Flow Divergence):</strong> חברה שמדווחת על צמיחה ברווחים, אבל סעיף הלקוחות/חייבים (<code>Accounts Receivable / DSO</code>) מתנפח והתזרים מפעילות שוטפת שלילי (חשד לרישום הכנסות פיקטיביות / Channel Stuffing).</li>\n        <li><strong>Cash Burn & Debt Wall (קיר חוב ושריפת מזומנים):</strong> חברה ששורפת $15M ברבעון, נשאר לה $20M בקופה, ויש לה חוב אג\"ח לפירעון קרוב ללא יכולת למחזר — היא <strong>חייבת לדלל מניות</strong> כדי לשרוד.</li>\n        <li><strong>דגלים אדומים בממשל תאגידי:</strong> התפטרות סמנכ\"ל כספים (CFO) או רואה חשבון מבקר, עסקאות בעלי עניין מפוקפקות, ומכירות מסיביות של פנים (Insider Selling ב-Form 4).</li>\n      </ul>\n      <div class=\"section-title\">🔓 תזמון קטליזטורים של שחרור היצע (Supply Unlock Events)</div>\n      <div class=\"table-wrap\"><table class=\"data-table\">\n        <thead><tr><th>אירוע שחרור היצע</th><th>מה קורה בשוק?</th><th>למה השורטיסט מרוויח?</th></tr></thead>\n        <tbody>\n          <tr><td><strong>פקיעת חסימה (IPO / SPAC Lock-Up Expiration)</strong></td><td>אחרי 90–180 יום מההנפקה, מייסדים וקרנות הון-סיכון שמחזיקים מניות בעלות סנטים ספורים רשאים למכור לראשונה.</td><td>ה-Float הסחיר גדל פי 3–5 ביום אחד ויוצר לחץ מכירות מוסדי כבד.</td></tr>\n          <tr><td><strong>אישור S-1 Effectiveness של PIPE / וורנטים</strong></td><td>ה-SEC מפרסם הודעת <code>EFFECT</code> ופותח מיליוני מניות וורנטים שנמצאים עמוק בכסף למכירה חופשית.</td><td>מחזיקי ה-PIPE ממהרים לממש רווחים ולמכור בשוק.</td></tr>\n          <tr><td><strong>Overnight Discounted Offering (424B5)</strong></td><td>החברה מודיעה אחרי הסגירה או בבוקר על הנפקת מניות בדיסקאונט של 20%–30% ממחיר הסגירה.</td><td>מחיר השוק צונח מיד לכיוון מחיר ההנפקה החדש.</td></tr>\n        </tbody>\n      </table></div>\n    ","learnEn":"\n      <div class=\"did-you-know\">🏆 <strong>The Pro Short Seller's Golden Rule:</strong> Amateur shorts try to guess the top on the <strong>Frontside</strong> while price is making higher highs above VWAP. Pro shorts wait for the <strong>Backside</strong> — after a blow-off top, VWAP breakdown, and a confirmed Lower High!</div>\n      <div class=\"section-title\">🕵️‍♂️ Fundamental Red Flags & Supply Unlock Catalysts</div>\n      <p class=\"prose\">Profitable shorts target structural weaknesses: Cash Burn with less than 2 quarters of runway, Accounts Receivable growing faster than revenue (Channel Stuffing), IPO/SPAC <strong>Lock-Up Expirations</strong>, and SEC <strong>EFFECT</strong> notices unlocking deep-ITM PIPE shares.</p>\n    ","cheatHe":[{"l":"Frontside vs Backside","t":"לעולם אל תעשה שורט ב-<strong>Frontside</strong> (מעל VWAP עם שיאים עולים). חכה ל-<strong>Backside</strong> (שבירת VWAP + Lower High)."},{"l":"Overhead Supply","t":"קונים שנלכדו בשיא הופכים למוכרים בכל תיקון כלפי מעלה ומשמשים כ\"תקרת בטון\" שעוזרת לשורטיסט."},{"l":"Supply Unlock Catalysts","t":"פקיעת Lock-Up, הודעת SEC EFFECT על S-1, והנפקות בדיסקאונט הם אירועי ההיצע הרווחיים ביותר לשורט."}],"cheatEn":[{"l":"Frontside vs Backside","t":"Never short the <strong>Frontside</strong>. Wait for the <strong>Backside</strong> (VWAP break + Lower High confirmation)."},{"l":"Overhead Supply","t":"Trapped top-buyers create heavy selling resistance on every bounce."},{"l":"Supply Unlock Catalysts","t":"IPO Lock-up expirations, SEC EFFECT notices, and discounted offerings unlock real supply."}],"gameHe":[["Frontside","הצד העולה של המהלך שבו המניה מעל VWAP ומייצרת שיאים עולים — אזור סכנה לשורט"],["Backside","הצד היורד לאחר שיא פאניקה, שבירת VWAP ויצירת שיא נמוך יותר (Lower High)"],["Overhead Supply","סוחרי לונג שנלכדו בהפסד במחירים גבוהים ומוכרים בכל עלייה קלה"],["Lock-Up Expiration","מועד פקיעת החסימה של בעלי עניין וקרנות לאחר הנפקה המשחרר היצע מניות עצום"],["Channel Stuffing","דחיסת סחורה ללקוחות לניפוח הכנסות חשבונאיות ללא תזרים מזומנים אמיתי"]],"gameEn":[["Frontside","Rising phase above VWAP with higher highs — lethal zone for premature shorts"],["Backside","Post-climax phase after VWAP breakdown and Lower High confirmation"],["Overhead Supply","Trapped long bagholders at higher prices who sell into every bounce"],["Lock-Up Expiration","Date when insiders and early VCs can first sell shares post-IPO"],["Channel Stuffing","Inflating reported revenue by booking uncollected receivables"]],"quiz":[{"qHe":"מהו הסימן המובהק לכך שמניה עברה מ-Frontside ל-Backside וניתן לחפש בה כניסה לשורט טכני?","qEn":"What is the clearest sign that a parabolic stock has transitioned from Frontside to Backside?","optsHe":["המניה עלתה ב-5% נוספים","לאחר נר שיא במחזור חריג (Blow-off), המניה שוברת את ה-VWAP כלפי מטה ונכשלת בניסיון העלייה הבא ביצירת שיא נמוך יותר (Lower High)","המניה פורצת לגבוה יומי חדש","ה-RSI מגיע ל-70"],"optsEn":["The stock rose another 5%","After a blow-off climax, price breaks below VWAP and fails on the bounce, forming a Lower High","Price breaks to a new High of Day","RSI hits 70"],"ans":1,"expHe":"שבירת ה-VWAP ולאחריה כישלון פריצה (Lower High) מאשרים שהקונים הכפויים סיימו לקנות ושהמוכרים (Overhead Supply) שלטים במחיר."},{"qHe":"כיצד \"Overhead Supply\" (לונגיסטים לכודים בשיא) עוזר לשורטיסט שנכנס ב-Backside?","qEn":"How does \"Overhead Supply\" (trapped long buyers at the top) help a Backside short seller?","optsHe":["הוא מגדיל את הדיבידנד","כל ניסיון תיקון של המניה למעלה נתקל בגל מכירות של קונים לחוצים שרק רוצים \"לצאת סביב הקרן\", מה שבולם את העלייה ומייצר רמת Stop ברורה","הוא מבטל את ה-CTB","הוא גורם ל-Gamma Squeeze"],"optsEn":["It increases dividends","Every bounce meets selling pressure from trapped buyers trying to exit near breakeven, capping upside","It cancels CTB","It causes a Gamma Squeeze"],"ans":1,"expHe":"ככל שיותר סוחרים קנו בשיא המחזור ונלכדו בהפסד, כך נוצרת \"תקרת זכוכית\" חזקה יותר של מוכרים שמגנה על השורטיסט שנכנס מתחתיה."},{"qHe":"איזה פער בדוחות הכספיים מהווה דגל אדום קלאסי לשורטיסטים פונדמנטליים (כמו בחשיפות הונאה)?","qEn":"Which financial statement divergence is a classic red flag for fundamental short sellers?","optsHe":["עלייה במזומן בקופה","צמיחה חדה בהכנסות המדווחות ובסעיף הלקוחות (Accounts Receivable) בזמן שתזרים המזומנים מפעילות שוטפת (Operating Cash Flow) צונח או שלילי","ירידה בחוב החברה","חלוקת דיבידנד קבועה"],"optsEn":["Rising cash balance","Surging reported revenue and Accounts Receivable while Operating Cash Flow is negative or plunging","Declining debt","Steady dividend payouts"],"ans":1,"expHe":"כשחברה מדווחת על מכירות שיא אך לא גובה עליהן מזומן (סעיף הלקוחות מתנפח), זהו סימן קלאסי להכנסות מנופחות או פיקטיביות."},{"qHe":"מה קורה ביום פקיעת ה-Lock-Up (לרוב 180 יום אחרי IPO)?","qEn":"What typically happens on an IPO Lock-Up Expiration date?","optsHe":["אסור למכור מניות במשך שנה נוספת","בעלי עניין, מייסדים וקרנות הון-סיכון מורשים למכור את מניותיהם בשוק החופשי לראשונה, מה שמגדיל דרמטית את ההיצע","המניה עוברת איחוד הון אוטומטי","החברה מחלקת מניות הטבה"],"optsEn":["Selling is banned for another year","Insiders and early VCs are permitted to sell their restricted shares on the open market, flooding supply","Automatic reverse split","Bonus share distribution"],"ans":1,"expHe":"פקיעת Lock-Up משחררת לשוק מיליוני מניות שנקנו במחירים אפסיים על ידי משקיעים מוקדמים שמעוניינים לממש רווחים."},{"qHe":"מדוע חיפוש שורט על בסיס \"המניה עלתה יותר מדי וה-RSI שלה 85\" בזמן שהיא ב-Frontside הוא טעות נפוצה?","qEn":"Why is shorting a stock simply because \"it is up too much and RSI is 85\" on the Frontside a fatal mistake?","optsHe":["כי RSI פועל רק במט\"ח","כי בזמן Short/Gamma Squeeze הקונים הם כפויים ולא רגישים למחיר — מניה ב-RSI 85 יכולה לעלות עוד 300% לפני שתעצור","כי הברוקר אוסר להסתכל על RSI","כי RSI מודד רק דיבידנדים"],"optsEn":["RSI only works in Forex","During a squeeze, buyers are forced and price-insensitive — an \"overbought\" stock can easily surge another 300%","Brokers ban RSI","RSI only measures dividends"],"ans":1,"expHe":"מדדי מתנד כמו RSI ננעלים באזור קניית-יתר לאורך כל מהלך הסקוויז. כניסה לפני שבירת מבנה (Backside) היא הגורם מספר 1 למחיקת שורטיסטים."}]},{"id":8,"num":"08","titleHe":"SSR, אופציות וניהול סיכונים","titleEn":"SSR, Options Hedging & Risk","tagHe":"פרק 08 · מיקרו-מכניקה וכללי הישרדות","tagEn":"Chapter 08 · Micro-Mechanics & Survival","descHe":"חוק ה-SSR (Rule 201 בירידה של 10%-), סכנת פקודות Stop-Market מול Stop-Limit בשורט, גידור שורט באמצעות אופציות Call/Put לסיכון מוגדר, וחוק ה-1%–2% לגודל פוזיציה.","descEn":"SEC Rule 201 SSR (-10% uptick rule), Stop-Market vs Stop-Limit dangers, capping tail risk with Call/Put options, and position sizing rules.","learnHe":"\n      <div class=\"did-you-know\">🛡️ <strong>איך שורטיסטים מוסדיים מונעים כל סיכוי למחיקת תיק?</strong> הם לעולם לא משאירים חשיפת שורט \"חשופה\" לקצה העליון — או שהם מגדרים אותה עם אופציית <strong>Call</strong> שקובעת הפסד מקסימלי ידוע מראש, או שהם מבצעים את השורט דרך אופציות <strong>Put</strong> ללא CTB וללא Margin Call!</div>\n      <div class=\"section-title\">🚦 1. חוק ה-SSR (Short Sale Restriction — SEC Rule 201)</div>\n      <p class=\"prose\">כאשר מניה יורדת ב-<strong>10% או יותר</strong> ממחיר הסגירה של יום המסחר הקודם בכל רגע במהלך היום, מופעל עליה אוטומטית חוק <strong>SSR (Alternative Uptick Rule)</strong>:</p>\n      <ul class=\"prose\">\n        <li><strong>לכמה זמן?</strong> מרגע הנגיעה ב-<code>-10%</code> לשארית אותו יום מסחר <strong>ועד סוף יום המסחר הבא!</strong></li>\n        <li><strong>מה החוק עושה?</strong> אסור לבצע פקודת שורט במחיר ה-<strong>National Best Bid (NBB)</strong> או מתחתיו! פקודת שורט יכולה להתבצע <strong>רק במחיר גבוה בסנט אחד לפחות מה-Bid הנוכחי</strong> (כלומר בהמתנה פסיבית על ה-Ask או כשקונה אגרסיבי קונה ממך ב-Ask).</li>\n        <li><strong>המלכודת הטקטית של SSR:</strong> כש-SSR פעיל, שורטיסטים לא יכולים \"להכות על ה-Bid\" כדי לרסק תמיכה (אלא רק מוכרי לונג אמיתיים יכולים למכור על ה-Bid). מצד שני, שורטיסט שמנסה להיכנס בפקודת Market בזמן SSR עלול לקבל ביצוע גרוע או דחייה אם הוא לא משתמש בפקודת Limit מעל ה-Bid!</li>\n      </ul>\n      <div class=\"section-title\">⚙️ 2. פקודות הגנה בשורט: Stop-Market מול Stop-Limit</div>\n      <div class=\"table-wrap\"><table class=\"data-table\">\n        <thead><tr><th>סוג פקודה</th><th>איך היא עובדת בשורט?</th><th>יתרון</th><th>סכנה קריטית</th></tr></thead>\n        <tbody>\n          <tr><td><strong>Buy Stop-Market</strong></td><td>ברגע שהמחיר נוגע בטריגר, נשלחת פקודת קנייה ב-Market בכל מחיר.</td><td><strong>מבטיחה יציאה</strong> מהפוזיציה בכל מצב.</td><td>ב-Gap או ב-Halt תשלם <strong>Slippage עצום</strong> (למשל ביצוע ב-$14 כשהסטופ היה ב-$8).</td></tr>\n          <tr><td><strong>Buy Stop-Limit</strong></td><td>ברגע שהמחיר נוגע בטריגר, נשלחת פקודת Limit עם מחיר גג.</td><td>מונעת ביצוע במחיר מופקע.</td><td>אם המניה קופצת מהר מעל ה-Limit שלך, <strong>הפקודה לא מתבצעת כלל</strong> ואתה נשאר תקוע בשורט שמזנק ל-$30!</td></tr>\n          <tr><td><strong>הפתרון המקצועי: Stop-Limit עם מרווח רחב (Wide Offset)</strong></td><td>טריגר ב-$8.00 עם Limit ב-$8.60 + התראה מיידית.</td><td>שילוב של ביצוע מהיר בעלייה רגילה עם הגנה חלקית מספייק רגעי.</td><td>בשעות Pre/After-Hours פקודות Stop רגילות אינן פעילות כלל — חובה להשתמש ב-<code>Limit + Extended Hours (EXT)</code>!</td></tr>\n        </tbody>\n      </table></div>\n      <div class=\"section-title\">🛡️ 3. גידור שורט באמצעות אופציות: לחתוך את \"הזנב האינסופי\"</div>\n      <div class=\"grid-3\">\n        <div class=\"card\"><div class=\"card-icon\">☂️</div><div class=\"card-title\">שורט מניה + קניית Call (Married Call)</div><div class=\"card-body\">מכרת בשורט 1,000 מניות ב-$15? קנה 10 חוזי Call בסטרייק $20 בפרמיה קטנה. גם אם המניה תטוס ל-$200 בלילה — <strong>ההפסד המקסימלי שלך נעול ב-$20 למניה</strong> בזכות אופציית ה-Call!</div></div>\n        <div class=\"card\"><div class=\"card-icon\">🎫</div><div class=\"card-title\">קניית Put במקום שורט ישיר</div><div class=\"card-body\">במניות עם CTB של 150% וסיכון סקוויז גבוה, קניית אופציית Put (או <code>Bear Put Spread</code>) מעניקה רווח מהירידה עם <strong>0% עמלת השאלה, 0 סיכון ל-Share Recall, והפסד מוגבל לפרמיה בלבד!</strong></div></div>\n        <div class=\"card\"><div class=\"card-icon\">⚖️</div><div class=\"card-title\">חוק גודל הפוזיציה (1%–2% Rule)</div><div class=\"card-body\">במניית מיקרו-קאפ תנודתית, גודל פוזיציית השורט ההתחלתית לעולם לא יעלה על <strong>1%–2% משווי התיק</strong>, ולעולם לא ממצעים שורט מפסיד שעולה ב-Frontside!</div></div>\n      </div>\n    ","learnEn":"\n      <div class=\"did-you-know\">🛡️ <strong>How Institutional Shorts Eliminate Tail Risk:</strong> They cap unlimited upside loss by pairing shorts with protective OTM <strong>Call options</strong>, or express the bearish trade via <strong>Put Spreads</strong> (zero CTB, zero Margin Call, strictly defined risk)!</div>\n      <div class=\"section-title\">🚦 SEC Rule 201 (SSR) & Stop-Order Mechanics</div>\n      <p class=\"prose\">When a stock drops <strong>-10%</strong> from yesterday's close, <strong>SSR (Short Sale Restriction)</strong> activates for the rest of the day and all of the next trading day — short sales can only execute above the National Best Bid (NBB). Also remember: standard Stop orders do NOT work in Pre-Market or After-Hours!</p>\n    ","cheatHe":[{"l":"חוק SSR (Rule 201)","t":"מופעל בירידה של <strong>10%-</strong> ממחיר הסגירה של אתמול (להיום ולמחר) — אוסר מכירה בשורט על ה-Bid."},{"l":"מלכודת שעות מסחר מורחבות","t":"פקודות Stop-Loss רגילות <strong>אינן עובדות ב-Pre-Market וב-After-Hours</strong>! נדרשת פקודת Limit עם סימון EXT."},{"l":"גידור באופציות","t":"קניית <strong>OTM Call</strong> נועלת הפסד מקסימלי בשורט; קניית <strong>Put Spread</strong> חוסכת עמלת CTB ומונעת Forced Buy-In."}],"cheatEn":[{"l":"SEC Rule 201 (SSR)","t":"Triggered at <strong>-10%</strong> from prior close (active today + tomorrow) — blocks shorting on the Bid."},{"l":"Extended Hours Stop Trap","t":"Standard Stop orders <strong>do NOT trigger in Pre-Market or After-Hours</strong>!"},{"l":"Options Tail Hedge","t":"Buying OTM Calls caps maximum short loss; Put Spreads avoid CTB and recall risk."}],"gameHe":[["SSR (Rule 201)","מגבלה המופעלת בירידה של 10% ואוסרת על שורטיסטים למכור ישירות על ה-Bid"],["Married Call Hedge","קניית אופציית Call מעל מחיר השורט כדי לנעול תקרת הפסד מקסימלית ידועה מראש"],["Bear Put Spread","אסטרטגיית אופציות להרוויח מירידת מניה בסיכון מוגדר וללא תשלום עמלת השאלה CTB"],["Stop-Limit Trap","סכנה שבה המניה מדלגת מעל מחיר ה-Limit והשורטיסט נשאר ללא ביצוע בזמן סקוויז"],["Extended Hours (EXT)","פקודת Limit מיוחדת הנדרשת לסגירת שורט בפרה-מרקט שבו פקודות Stop רגילות אינן פועלות"]],"gameEn":[["SSR (Rule 201)","Triggered at -10% drop; restricts short sales from executing at or below the Best Bid"],["Married Call Hedge","Buying an OTM Call against a short stock position to cap maximum upside loss"],["Bear Put Spread","Defined-risk bearish options trade with zero CTB and zero recall risk"],["Stop-Limit Trap","Risk that a fast spike skips past your limit price, leaving your short unclosed"],["Extended Hours (EXT)","Limit order flag required in Pre-Market where standard Stop orders never trigger"]],"quiz":[{"qHe":"מתי מופעל חוק ה-SSR (Short Sale Restriction — Rule 201) ולכמה זמן הוא נשאר בתוקף?","qEn":"When is SEC Rule 201 (SSR) triggered and how long does it remain in effect?","optsHe":["בעלייה של 10%, לשעה אחת","בירידה של 10% או יותר ממחיר הסגירה של אתמול, והוא נשאר בתוקף לשארית היום ולכל יום המסחר הבא","בירידה של 50%, לשבועיים","רק ביום שישי"],"optsEn":["On a +10% rise, for 1 hour","On a -10% drop from prior close, remaining active for the rest of the day and all of the next trading day","On a -50% drop, for 2 weeks","Only on Fridays"],"ans":1,"expHe":"חוק 201 של ה-SEC מופעל ברגע שהמניה יורדת 10%- ממחיר הסגירה של אתמול ונמשך עד סוף יום המסחר העוקב."},{"qHe":"מה מותר ומה אסור לשורטיסט לעשות כאשר SSR פעיל על המניה?","qEn":"What can and cannot a short seller do while SSR is active on a stock?","optsHe":["אסור לעשות שורט בכלל","מותר לפתוח שורט רק במחיר הגבוה מה-National Best Bid הנוכחי (למשל על ה-Ask), ואסור למכור בשורט ישירות על ה-Bid","אסור לסגור שורט קיים","העמלות מבוטלות"],"optsEn":["Shorting is completely banned","Short sales can only execute above the National Best Bid (NBB), not by hitting the Bid directly","Closing a short is banned","Fees are waived"],"ans":1,"expHe":"SSR אינו אוסר על שורט, אלא מונע משורטיסטים \"להכות על ה-Bid\" כדי לדחוף את המחיר מטה; עליהם להמתין שקונה יקנה מהם מעל ה-Bid."},{"qHe":"שורטיסט הציב פקודת Stop-Market רגילה ב-$12.00. בשעה 07:30 בבוקר (Pre-Market) המניה מזנקת מ-$10 ל-$22. מה יקרה לפקודת ה-Stop שלו ב-07:30?","qEn":"A short seller placed a standard Stop-Market order at $12.00. At 7:30 AM (Pre-Market), the stock surges from $10 to $22. What happens to the Stop order at 7:30 AM?","optsHe":["היא תתבצע מיד ב-$12.00","כלום! פקודות Stop רגילות אינן פעילות בשעות ה-Pre-Market, והשורטיסט יישאר חשוף לזינוק עד פתיחת המסחר ב-09:30 (או עד שישלח פקודת Limit EXT ידנית)","הברוקר יסגור אותה ב-$10.00","המניה תיעצר ב-LULD Halt ב-07:30"],"optsEn":["It fills immediately at $12.00","Nothing! Standard Stop orders do not trigger in Pre-Market, leaving the short exposed until 9:30 AM open","Broker closes it at $10.00","LULD halt stops it at 7:30 AM"],"ans":1,"expHe":"בשעות הטרום-מסחר ואפטר-מרקט פקודות Stop אינן מופעלות בבורסה — זו אחת המלכודות הקטלניות ביותר למי שמחזיק שורט ללילה (Overnight)."},{"qHe":"כיצד קניית אופציית Call מחוץ לכסף (Married Call) מגנה על פוזיציית שורט במניה?","qEn":"How does buying an Out-of-the-Money Call option (Married Call) protect a short stock position?","optsHe":["היא מכפילה את הדיבידנד","היא קובעת תקרת הפסד מקסימלית ומוחלטת (במחיר ה-Strike של ה-Call), כך שגם אם המניה תעלה ב-1,000% ההפסד בשורט נעול","היא מבטלת את מס רווחי ההון","היא מונעת מהמניה לעלות"],"optsEn":["Doubles the dividend","Locks in a hard maximum loss ceiling at the Call strike price, eliminating unlimited upside tail risk","Eliminates taxes","Prevents the stock from rising"],"ans":1,"expHe":"כל דולר שהמניה עולה מעבר למחיר ה-Strike של אופציית ה-Call מתקזז דולר-מול-דולר על ידי ה       const endNav = '<div class="ch-end-nav">' +
        nextBtn +
        '<button class="ch-end-btn" onclick="showTab(' + idx + ',\'quiz\')"><span class="ch-end-btn-icon">🧪</span><span class="ch-end-btn-label">' + (isEn ? 'Chapter Quiz' : 'בחן את עצמך') + '</span></button>' +
        '<button class="ch-end-btn" onclick="showTab(' + idx + ',\'game\')"><span class="ch-end-btn-icon">🔗</span><span class="ch-end-btn-label">' + (isEn ? 'Matching Game' : 'משחק התאמה') + '</span></button>' +
        '<button class="ch-end-btn" onclick="showTab(' + idx + ',\'cheat\')"><span class="ch-end-btn-icon">📋</span><span class="ch-end-btn-label">' + (isEn ? 'Summary Cards' : 'כרטיסי סיכום') + '</span></button>' +
      '</div>';
      learnEl.innerHTML = (isEn ? ch.learnEn : ch.learnHe) + endNav;
    }

    // Cheat / Summary
    const cheatEl = document.getElementById('cheat-' + idx);
    if (cheatEl) {
      const cards = isEn ? ch.cheatEn : ch.cheatHe;
      cheatEl.innerHTML = '<div class="sc"><div class="sc-head">' + (isEn ? '📋 Key Takeaways — ' + ch.titleEn : '📋 נקודות חובה לזכור — ' + ch.titleHe) + '</div>' +
        cards.map(c => '<div class="sc-card"><div class="sc-label">' + c.l + '</div><div class="sc-text">' + c.t + '</div></div>').join('') +
        '</div>';
    }

    renderQuiz(idx);
    initGame(idx);
  });

  // Initialize interactive calculators
  if (document.getElementById('sim-ctb-entry')) updateCtbSim();
  if (document.getElementById('sim-pain-cash')) updatePainSim();
  if (document.getElementById('sim-conv-mkt')) updateConvSim();
  if (document.getElementById('sim-sqz-float')) updateSqzSim();
  updateCourseProgress();
}

function showChapter(idx) {
  currentCh = idx;
  document.querySelectorAll('.chapter').forEach(el => el.classList.remove('active'));
  const target = document.getElementById('ch-' + idx);
  if (target) target.classList.add('active');
  document.querySelectorAll('.ch-btn').forEach(b => b.classList.remove('active'));
  const navBtn = document.getElementById('nav-' + idx);
  if (navBtn) navBtn.classList.add('active');
  const escHdr = document.getElementById('headerEscapeBtn');
  if (escHdr) escHdr.classList.remove('active');
  const ch = CHAPTERS[idx];
  const hdrName = document.getElementById('headerChName');
  if (hdrName && ch) hdrName.textContent = currentLang === 'en' ? (ch.num + ' · ' + ch.titleEn) : (ch.num + ' · ' + ch.titleHe);
  showTab(idx, 'learn');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showTab(chIdx, tabKey) {
  ['learn', 'quiz', 'game', 'cheat'].forEach(k => {
    const panel = document.getElementById(chIdx + '-' + k);
    const btn = document.getElementById('tabbtn-' + chIdx + '-' + k);
    if (panel) panel.classList.toggle('active', k === tabKey);
    if (btn) btn.classList.toggle('active', k === tabKey);
  });
}

function renderQuiz(chIdx) {
  const ch = CHAPTERS[chIdx];
  const wrap = document.getElementById('quiz-' + chIdx);
  if (!ch || !wrap) return;
  const isEn = currentLang === 'en';
  if (!quizState[chIdx]) quizState[chIdx] = { cur: 0, answers: {}, score: 0, done: false };
  const st = quizState[chIdx];
  const qs = ch.quiz;

  if (st.done) {
    const pct = Math.round((st.score / qs.length) * 100);
    wrap.innerHTML = '<div class="quiz-result">' +
      '<div class="qr-score">' + st.score + '/' + qs.length + ' (' + pct + '%)</div>' +
      '<div class="qr-label">' + (isEn ? '🎉 Chapter Quiz Completed!' : '🎉 השלמת את חידון הפרק!') + '</div>' +
      '<button class="btn btn-primary" onclick="resetChapterQuiz(' + chIdx + ')">' + (isEn ? '↺ Try Again' : '↺ נסה שוב') + '</button>' +
    '</div>';
    return;
  }

  const qObj = qs[st.cur];
  const picked = st.answers[st.cur];
  const letters = isEn ? ['A', 'B', 'C', 'D'] : ['א', 'ב', 'ג', 'ד'];
  const opts = isEn ? qObj.optsEn : qObj.optsHe;

  const pips = qs.map((_, i) => {
    let cls = 'quiz-pip';
    if (st.answers[i] !== undefined) cls += ' done';
    else if (i === st.cur) cls += ' cur';
    return '<div class="' + cls + '"></div>';
  }).join('');

  const optsHtml = opts.map((optText, oi) => {
    let cls = 'quiz-opt';
    if (picked !== undefined) {
      if (oi === qObj.ans) cls += ' correct';
      else if (oi === picked) cls += ' wrong';
    }
    return '<button class="' + cls + '" ' + (picked !== undefined ? 'disabled' : '') + ' onclick="pickQuizOpt(' + chIdx + ',' + oi + ')">' +
      '<span class="opt-letter">' + letters[oi] + '</span>' +
      '<span>' + optText + '</span>' +
    '</button>';
  }).join('');

  const expHtml = picked !== undefined
    ? '<div class="quiz-exp"><strong>' + (picked === qObj.ans ? (isEn ? '✅ Correct!' : '✅ תשובה נכונה!') : (isEn ? '❌ Not quite:' : '❌ הסבר:')) + '</strong> ' + qObj.expHe + '</div>'
    : '';

  const nextBtn = picked !== undefined
    ? '<button class="btn btn-primary" onclick="nextQuizQ(' + chIdx + ')">' + (st.cur + 1 < qs.length ? (isEn ? 'Next Question →' : '← השאלה הבאה') : (isEn ? 'Finish Quiz 🏆' : 'סיום חידון 🏆')) + '</button>'
    : '';

  wrap.innerHTML = '<div class="quiz-prog">' + pips + '</div>' +
    '<div class="quiz-q-card active">' +
      '<div class="quiz-meta">' + (isEn ? ('Question ' + (st.cur + 1) + ' of ' + qs.length) : ('שאלה ' + (st.cur + 1) + ' מתוך ' + qs.length)) + '</div>' +
      '<div class="quiz-q">' + (isEn ? qObj.qEn : qObj.qHe) + '</div>' +
      '<div class="quiz-opts">' + optsHtml + '</div>' +
      expHtml +
      '<div class="quiz-nav">' + nextBtn + '</div>' +
    '</div>';
}

function pickQuizOpt(chIdx, optIdx) {
  const st = quizState[chIdx];
  if (!st || st.answers[st.cur] !== undefined) return;
  st.answers[st.cur] = optIdx;
  if (optIdx === CHAPTERS[chIdx].quiz[st.cur].ans) {
    st.score++;
    awardXP(10);
  }
  renderQuiz(chIdx);
}

function nextQuizQ(chIdx) {
  const st = quizState[chIdx];
  const qs = CHAPTERS[chIdx].quiz;
  if (st.cur + 1 < qs.length) {
    st.cur++;
  } else {
    st.done = true;
    saveDone(chIdx);
    awardXP(25);
  }
  renderQuiz(chIdx);
}

function resetChapterQuiz(chIdx) {
  quizState[chIdx] = { cur: 0, answers: {}, score: 0, done: false };
  renderQuiz(chIdx);
}

/* ── MATCHING GAME ── */
function initGame(chIdx) {
  const ch = CHAPTERS[chIdx];
  const wrap = document.getElementById('game-' + chIdx);
  if (!ch || !wrap) return;
  const pairs = currentLang === 'en' ? ch.gameEn : ch.gameHe;
  const rightOrder = pairs.map((_, i) => i).sort(() => Math.random() - 0.5);
  matchState[chIdx] = { pairs, rightOrder, selLeft: null, selRight: null, matched: new Set(), wrongPair: null };
  renderGame(chIdx);
}

function renderGame(chIdx) {
  const st = matchState[chIdx];
  const wrap = document.getElementById('game-' + chIdx);
  if (!st || !wrap) return;
  const isEn = currentLang === 'en';
  const allDone = st.matched.size === st.pairs.length;

  let html = '<div class="match-board">';
  if (allDone) {
    html += '<div class="match-success">' + (isEn ? '🎉 All pairs matched! +20 XP' : '🎉 כל הזוגות הותאמו בהצלחה! +20 XP') +
      '<div style="margin-top:10px"><button class="match-restart-btn" onclick="initGame(' + chIdx + ')">' + (isEn ? '↺ Play Again' : '↺ שחק שוב') + '</button></div></div>';
  }
  html += '<div class="match-cols"><div class="match-col">';
  st.pairs.forEach((p, li) => {
    let cls = 'match-card';
    if (st.matched.has(li)) cls += ' match-done';
    else if (st.wrongPair && st.wrongPair[0] === li) cls += ' match-wrong';
    else if (st.selLeft === li) cls += ' match-sel';
    html += '<div class="' + cls + '" onclick="pickMatchLeft(' + chIdx + ',' + li + ')"><strong>' + p[0] + '</strong></div>';
  });
  html += '</div><div class="match-col">';
  st.rightOrder.forEach((pairIdx) => {
    let cls = 'match-card';
    if (st.matched.has(pairIdx)) cls += ' match-done';
    else if (st.wrongPair && st.wrongPair[1] === pairIdx) cls += ' match-wrong';
    else if (st.selRight === pairIdx) cls += ' match-sel';
    html += '<div class="' + cls + '" onclick="pickMatchRight(' + chIdx + ',' + pairIdx + ')">' + st.pairs[pairIdx][1] + '</div>';
  });
  html += '</div></div></div>';
  wrap.innerHTML = html;
}

function pickMatchLeft(chIdx, li) {
  const st = matchState[chIdx];
  if (!st || st.matched.has(li)) return;
  st.selLeft = li;
  checkMatchPair(chIdx);
}

function pickMatchRight(chIdx, ri) {
  const st = matchState[chIdx];
  if (!st || st.matched.has(ri)) return;
  st.selRight = ri;
  checkMatchPair(chIdx);
}

function checkMatchPair(chIdx) {
  const st = matchState[chIdx];
  if (st.selLeft === null || st.selRight === null) {
    renderGame(chIdx);
    return;
  }
  if (st.selLeft === st.selRight) {
    st.matched.add(st.selLeft);
    st.selLeft = null;
    st.selRight = null;
    if (st.matched.size === st.pairs.length) {
      saveDone(chIdx);
      awardXP(20);
    }
    renderGame(chIdx);
  } else {
    st.wrongPair = [st.selLeft, st.selRight];
    renderGame(chIdx);
    setTimeout(() => {
      st.wrongPair = null;
      st.selLeft = null;
      st.selRight = null;
      renderGame(chIdx);
    }, 550);
  }
}

/* ── FULL REVIEW DRAWER ── */
function openReview() {
  const isEn = currentLang === 'en';
  const body = document.getElementById('reviewBody');
  const title = document.getElementById('reviewTitle');
  const sub = document.getElementById('reviewSub');
  if (title) title.textContent = isEn ? '📚 Full Course Cheat Sheet — Short Sellers & Traps' : '📚 סיכום מלא — שורטיסטים ומלכודות שורט';
  if (sub) sub.textContent = isEn ? 'All 10 chapters at a glance' : 'כל 10 הפרקים במבט אחד';
  if (body) {
    body.innerHTML = CHAPTERS.map(ch => {
      const cards = isEn ? ch.cheatEn : ch.cheatHe;
      return '<div class="review-chapter"><div class="review-ch-title">' + ch.num + ' · ' + (isEn ? ch.titleEn : ch.titleHe) + '</div>' +
        '<div style="padding:12px;display:flex;flex-direction:column;gap:8px">' +
        cards.map(c => '<div class="sc-card"><div class="sc-label">' + c.l + '</div><div class="sc-text">' + c.t + '</div></div>').join('') +
        '</div></div>';
    }).join('');
  }
  document.getElementById('reviewOverlay').classList.add('open');
  document.getElementById('reviewDrawer').classList.add('open');
}

function closeReview() {
  document.getElementById('reviewOverlay').classList.remove('open');
  document.getElementById('reviewDrawer').classList.remove('open');
}

/* ── GRAND FINALE: SHORT DESK ARENA (ESCAPE ROOM) ── */
function openEscapeRoom() {
  currentCh = 'escape';
  document.querySelectorAll('.chapter').forEach(el => el.classList.remove('active'));
  document.getElementById('ch-escape').classList.add('active');
  document.querySelectorAll('.ch-btn').forEach(b => b.classList.remove('active'));
  const navEsc = document.getElementById('nav-escape');
  if (navEsc) navEsc.classList.add('active');
  const hdrEsc = document.getElementById('headerEscapeBtn');
  if (hdrEsc) hdrEsc.classList.add('active');
  const hdrName = document.getElementById('headerChName');
  if (hdrName) hdrName.textContent = currentLang === 'en' ? '🎯 The Short Desk Arena' : '🎯 זירת השורט והמלכודות';
  renderEscapeRoom();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderEscapeRoom() {
  const mount = document.getElementById('escape-room-mount');
  if (!mount) return;
  const isEn = currentLang === 'en';
  const total = ARENA_STATIONS.length;
  const solvedCount = Object.keys(arenaState.solved).length;

  if (solvedCount === total) {
    if (!localStorage.getItem('ng_shorts_arena_xp')) {
      localStorage.setItem('ng_shorts_arena_xp', '1');
      awardXP(150);
    }
    const starsEl = document.getElementById('chstars-escape');
    if (starsEl) starsEl.textContent = '🏆';
    mount.innerHTML = '<div class="er-victory">' +
      '<div style="font-size:58px;margin-bottom:10px">🏆🩳💎</div>' +
      '<h2 style="font-size:26px;font-weight:900;margin-bottom:8px">' + (isEn ? 'Master of the Short Desk!' : 'אדריכל/ית דסק השורט וציד המלכודות!') + '</h2>' +
      '<p style="color:var(--text2);font-size:15px;max-width:600px;margin:0 auto 20px">' +
        (isEn
          ? 'You navigated all 6 treacherous market setups — spotting Baby Shelf locks, S-1 EFFECT catalysts, CTB/Dividend traps, Convertible Arbitrage, Gamma Squeezes, and Backside SSR execution!'
          : 'ניווטת בהצלחה את כל 6 תרחישי השוק — זיהית נעילות Baby Shelf, הודעות EFFECT ב-S-1, מלכודות CTB ודיבידנד מיוחד, ארביטראז\' אג"ח להמרה, מפלי Gamma Squeeze וכניסת Backside תחת SSR!') +
      '</p>' +
      '<div class="sim-kpi-grid" style="max-width:560px;margin:0 auto 24px">' +
        '<div class="sim-kpi"><div class="sim-kpi-val" style="color:var(--green)">$' + arenaState.equity.toLocaleString() + '</div><div class="sim-kpi-lbl">' + (isEn ? 'Final Desk Equity' : 'שווי תיק דסק סופי') + '</div></div>' +
        '<div class="sim-kpi"><div class="sim-kpi-val">+150 XP</div><div class="sim-kpi-lbl">' + (isEn ? 'Bonus Awarded' : 'בונוס סיום קורס') + '</div></div>' +
        '<div class="sim-kpi"><div class="sim-kpi-val">6/6</div><div class="sim-kpi-lbl">' + (isEn ? 'Scenarios Mastered' : 'תרחישים שנפתרו') + '</div></div>' +
      '</div>' +
      '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">' +
        '<button class="btn btn-primary" onclick="resetEscapeRoom()">' + (isEn ? '↺ Play Arena Again' : '↺ שחק שוב בזירה') + '</button>' +
        '<button class="btn btn-ghost" onclick="showChapter(0)">' + (isEn ? '📖 Back to Chapters' : '📖 חזרה לפרקי הקורס') + '</button>' +
      '</div>' +
    '</div>';
    return;
  }

  const st = ARENA_STATIONS[arenaState.step];
  const isSolved = !!arenaState.solved[arenaState.step];
  const opts = isEn ? st.optsEn : st.optsHe;
  const letters = isEn ? ['A', 'B', 'C', 'D'] : ['א', 'ב', 'ג', 'ד'];

  const stepperHtml = ARENA_STATIONS.map((s, idx) => {
    let cls = 'er-step';
    if (arenaState.solved[idx]) cls += ' done';
    if (idx === arenaState.step) cls += ' active';
    return '<div class="' + cls + '" onclick="jumpArenaStep(' + idx + ')"><span>#' + (idx + 1) + '</span><span>' + (arenaState.solved[idx] ? '✓' : '•') + '</span></div>';
  }).join('');

  const optsHtml = opts.map((txt, oi) => {
    let cls = 'er-opt-btn';
    if (isSolved && oi === st.ans) cls += ' correct';
    else if (arenaState.lastWrong === oi) cls += ' wrong';
    return '<button class="' + cls + '" ' + (isSolved ? 'disabled' : '') + ' onclick="pickArenaOpt(' + oi + ')">' +
      '<span class="er-opt-key">' + letters[oi] + '</span>' +
      '<span>' + txt + '</span>' +
    '</button>';
  }).join('');

  const fbHtml = isSolved
    ? '<div class="er-feedback show ok">' + (isEn ? st.expEn : st.expHe) + '</div>'
    : (arenaState.lastWrong !== undefined && arenaState.lastWrong !== null
        ? '<div class="er-feedback show err">' + (isEn ? '❌ Costly desk mistake (-$4,000 Drawdown)! Check the hint or filings and try again.' : '❌ טעות שעלתה לדסק ביוקר (-$4,000 Drawdown)! בדוק את הרמז ונתוני התשקיף ונסה שוב.') + '</div>'
        : '');

  const nextActionBtn = isSolved
    ? '<button class="btn btn-primary" onclick="nextArenaStep()">' + (arenaState.step + 1 < total ? (isEn ? 'Next Scenario →' : '← לתרחיש הבא') : (isEn ? 'Claim Victory 🏆' : 'למסך הניצחון 🏆')) + '</button>'
    : '';

  mount.innerHTML = '<div class="er-wrap">' +
    '<div class="er-hud">' +
      '<div class="er-hud-top">' +
        '<div class="er-mission-tag">' + (isEn ? '🎯 SHORT DESK ARENA · 6 REAL-WORLD SCENARIOS' : '🎯 זירת השורט והמלכודות · 6 תרחישי אמת בדסק המסחר') + '</div>' +
        '<div class="er-latency-pill">💰 Desk Equity: $' + arenaState.equity.toLocaleString() + '</div>' +
      '</div>' +
      '<div class="er-stepper">' + stepperHtml + '</div>' +
    '</div>' +
    '<div class="er-station-card">' +
      '<div class="er-st-badge">' + (isEn ? st.badgeEn : st.badgeHe) + '</div>' +
      '<div class="er-st-title">' + (isEn ? st.titleEn : st.titleHe) + '</div>' +
      '<div class="er-st-story">' + (isEn ? st.storyEn : st.storyHe) + '</div>' +
      '<div class="er-options">' + optsHtml + '</div>' +
      fbHtml +
      '<div class="er-hint-box' + (arenaState.hintOpen ? ' show' : '') + '">' + (isEn ? st.hintEn : st.hintHe) + '</div>' +
      '<div class="er-actions-bar">' +
        '<button class="btn btn-ghost" onclick="toggleArenaHint()">💡 ' + (isEn ? 'Desk Analyst Hint' : 'רמז אנליסט הדסק') + '</button>' +
        nextActionBtn +
      '</div>' +
    '</div>' +
  '</div>';
}

function pickArenaOpt(oi) {
  const st = ARENA_STATIONS[arenaState.step];
  if (arenaState.solved[arenaState.step]) return;
  if (oi === st.ans) {
    arenaState.solved[arenaState.step] = true;
    arenaState.lastWrong = null;
    arenaState.equity += 18000;
    awardXP(25);
  } else {
    arenaState.lastWrong = oi;
    arenaState.penalties++;
    arenaState.equity = Math.max(10000, arenaState.equity - 4000);
  }
  renderEscapeRoom();
}

function nextArenaStep() {
  const nextUnsolved = ARENA_STATIONS.findIndex((_, i) => !arenaState.solved[i]);
  if (nextUnsolved !== -1) {
    arenaState.step = nextUnsolved;
    arenaState.lastWrong = null;
    arenaState.hintOpen = false;
  }
  renderEscapeRoom();
}

function jumpArenaStep(idx) {
  arenaState.step = idx;
  arenaState.lastWrong = null;
  arenaState.hintOpen = false;
  renderEscapeRoom();
}

function toggleArenaHint() {
  arenaState.hintOpen = !arenaState.hintOpen;
  renderEscapeRoom();
}

function resetEscapeRoom() {
  arenaState = { step: 0, equity: 100000, penalties: 0, solved: {}, hintOpen: false, lastWrong: null };
  renderEscapeRoom();
}

/* ── LANGUAGE & THEME SYNC ── */
function setLanguage(lang) {
  currentLang = lang === 'en' ? 'en' : 'he';
  try { localStorage.setItem('ng_lang', currentLang); } catch (e) {}
  const activeWasEscape = (currentCh === 'escape');
  const savedCh = typeof currentCh === 'number' ? currentCh : 0;
  renderAllChapters();
  if (activeWasEscape) openEscapeRoom();
  else showChapter(savedCh);
}

function toggleLang() {
  setLanguage(currentLang === 'en' ? 'he' : 'en');
}

window.addEventListener('message', (e) => {
  if (!e.data) return;
  if (e.data.ng === 'lang' && e.data.lang) setLanguage(e.data.lang);
  if (e.data.ng === 'theme') {
    document.documentElement.setAttribute('data-theme', e.data.dark ? 'dark' : 'light');
  }
});

document.addEventListener('DOMContentLoaded', () => {
  try {
    if (localStorage.getItem('ng_dark_mode') === '1') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  } catch (e) {}
  renderAllChapters();
  showChapter(0);
});
</script>
