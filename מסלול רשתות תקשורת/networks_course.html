<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<script src="/_bridge.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>רשתות תקשורת — Networks</title>
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #f7f7f2;
  --bg2:      #ffffff;
  --bg3:      #f0f0ea;
  --surface:  #ffffff;
  --border:   #e5e5e0;
  --border2:  #d1d1ca;
  --accent:   #0e7490;
  --accent2:  #0a5c72;
  --accentfg: #ffffff;
  --green:    #58cc02;
  --green2:   #46a302;
  --greenfg:  #ffffff;
  --yellow:   #ffd900;
  --yellowfg: #785a00;
  --red:      #ff4b4b;
  --redfg:    #ffffff;
  --blue:     #1cb0f6;
  --bluefg:   #ffffff;
  --text:     #3c3c3c;
  --text2:    #6b6b6b;
  --text3:    #afafaf;
  --mono:     'Courier New', 'Consolas', monospace;
  --sans:     -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --r:        12px;
  --r2:       20px;
  --r3:       24px;
}

html, body {
  height: 100%;
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
.header {
  position: fixed; top: 0; left: 0; right: 0; height: 60px; z-index: 200;
  background: var(--bg2); border-bottom: 2px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; gap: 16px;
}
.header-logo {
  font-weight: 800; font-size: 16px; color: var(--accent);
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
  letter-spacing: -0.3px;
}
.header-logo-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--green); box-shadow: 0 2px 0 var(--green2);
}
.header-chname {
  font-size: 13px; font-weight: 600; color: var(--text2);
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.lang-btn {
  font-size: 12px; font-weight: 800; padding: 6px 14px; border-radius: var(--r);
  border: 2px solid var(--border2); border-bottom: 4px solid var(--border2);
  background: var(--bg2); color: var(--text2);
  cursor: pointer; flex-shrink: 0; transition: all .1s;
  text-transform: uppercase; letter-spacing: .04em;
}
.lang-btn:hover { background: var(--accent); color: var(--accentfg); border-color: var(--accent2); border-bottom-color: var(--accent2); }
.lang-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

/* ── CHAPTER NAV BAR ── */
.ch-nav {
  position: fixed; top: 60px; left: 0; right: 0; z-index: 150;
  background: var(--bg2); border-bottom: 2px solid var(--border);
  overflow-x: auto; display: flex; padding: 8px 16px; gap: 6px;
  scrollbar-width: none; -ms-overflow-style: none;
}
.ch-nav::-webkit-scrollbar { display: none; }
.sb-label { display: none; }
.ch-btn {
  display: flex; flex-direction: column; align-items: center;
  padding: 8px 14px; gap: 3px; border: 2px solid transparent;
  background: var(--bg3); border-radius: var(--r2);
  cursor: pointer; transition: all .15s; flex-shrink: 0;
  color: var(--text2); min-width: 52px;
  border-bottom: 4px solid var(--border);
}
.ch-btn:hover { background: var(--bg2); border-color: var(--border2); color: var(--text); }
.ch-btn.active {
  background: var(--accent); color: #fff;
  border-color: var(--accent2); border-bottom-color: var(--accent2);
}
.ch-num { font-size: 11px; font-weight: 800; font-family: var(--mono); }
.ch-title-text { font-size: 9px; font-weight: 600; max-width: 68px; text-align: center; line-height: 1.2; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.ch-stars { font-size: 10px; min-height: 12px; }

/* ── LAYOUT ── */
.main {
  padding-top: 112px; min-height: 100vh;
  max-width: 780px; margin: 0 auto;
  padding-left: 20px; padding-right: 20px; padding-bottom: 60px;
}

/* ── CHAPTER ── */
.chapter { display: none; }
.chapter.active { display: block; }

/* ── CHAPTER HERO ── */
.ch-hero {
  padding: 28px 0 24px; border-bottom: 2px solid var(--border); margin-bottom: 28px;
}
.ch-tag {
  display: inline-block; font-size: 11px; font-weight: 800;
  color: var(--accent); background: var(--bg3);
  padding: 3px 10px; border-radius: 20px; margin-bottom: 10px;
  letter-spacing: .06em; text-transform: uppercase; font-family: var(--mono);
}
.ch-title { font-size: 26px; font-weight: 900; color: var(--text); margin-bottom: 8px; letter-spacing: -.5px; line-height: 1.2; }
.ch-desc { font-size: 14px; color: var(--text2); margin-bottom: 20px; max-width: 560px; }
.tabs-bar { display: flex; gap: 6px; flex-wrap: wrap; }
.tab-btn {
  padding: 8px 18px; font-size: 13px; font-weight: 800; border-radius: var(--r2);
  border: 2px solid var(--border); border-bottom: 4px solid var(--border2);
  background: var(--bg2); color: var(--text3);
  cursor: pointer; transition: all .1s; text-transform: uppercase; letter-spacing: .04em;
}
.tab-btn:hover { color: var(--text2); border-color: var(--border2); }
.tab-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
.tab-btn.active {
  background: var(--accent); color: #fff;
  border-color: var(--accent2); border-bottom-color: var(--accent2);
}

/* ── TAB PANELS ── */
.tab-panels { }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── LEARN CONTENT ── */
.did-you-know {
  background: linear-gradient(135deg, #fffdf0, #fff9e0);
  border: 2px solid var(--yellow); border-radius: var(--r2);
  padding: 16px 18px; font-size: 13.5px; color: #5a4a00;
  margin-bottom: 28px; line-height: 1.6;
  box-shadow: 0 3px 0 #e6c700;
}
.section-title {
  font-size: 17px; font-weight: 900; color: var(--text);
  margin: 32px 0 12px; letter-spacing: -.2px;
  display: flex; align-items: center; gap: 8px;
}
.prose {
  font-size: 15px; color: var(--text2); line-height: 1.78; margin-bottom: 16px;
}
.prose code, code {
  font-family: var(--mono); font-size: 12.5px;
  background: var(--bg3); padding: 2px 6px;
  border-radius: 6px; color: var(--accent2); font-weight: 600;
}

/* ── CODE BLOCKS ── */
.code-block {
  background: #1a1a2e; border-radius: var(--r2); padding: 18px 20px;
  margin: 16px 0; overflow-x: auto;
  border: 2px solid #2a2a4e; box-shadow: 0 4px 0 #0f0f20;
}
.code-block code {
  font-family: var(--mono); font-size: 12.5px; line-height: 1.75;
  background: none; padding: 0; color: #e2e8f0; display: block;
  font-weight: normal;
}
.comment { color: #6272a4; }

/* ── CARDS ── */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 16px 0 24px; }
.grid-3 { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin: 16px 0 24px; }
.card {
  background: var(--bg2); border: 2px solid var(--border);
  border-bottom: 4px solid var(--border2); border-radius: var(--r2);
  padding: 18px; display: flex; flex-direction: column; gap: 8px;
  transition: transform .1s;
}
.card:hover { transform: translateY(-2px); }
.card-icon { font-size: 26px; }
.card-title { font-size: 13px; font-weight: 800; color: var(--text); }
.card-body { font-size: 13px; color: var(--text2); line-height: 1.55; }

/* ── TABLE ── */
.table-wrap {
  overflow-x: auto; margin: 16px 0 24px;
  border-radius: var(--r2); border: 2px solid var(--border);
  box-shadow: 0 4px 0 var(--border);
}
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table thead { background: var(--bg3); }
.data-table th {
  padding: 11px 14px; text-align: left; font-weight: 800;
  color: var(--text2); font-size: 11px; text-transform: uppercase;
  letter-spacing: .06em; border-bottom: 2px solid var(--border);
}
.data-table td { padding: 11px 14px; color: var(--text2); border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.5; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--bg3); }

/* ── FLOW ROW ── */
.flow-row {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  margin: 16px 0 24px; padding: 20px; background: var(--bg2);
  border-radius: var(--r2); border: 2px solid var(--border);
  box-shadow: 0 4px 0 var(--border);
}
.flow-step { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.flow-step-icon { font-size: 24px; }
.flow-step-label { font-size: 10px; font-weight: 700; color: var(--text3); line-height: 1.3; max-width: 64px; text-align: center; }
.flow-arrow { color: var(--accent); font-size: 18px; font-weight: 900; }

/* ── CALLOUTS ── */
.callout { padding: 14px 18px; border-radius: var(--r2); font-size: 13.5px; line-height: 1.6; margin: 16px 0; border: 2px solid; }
.callout-info  { background: #e8f4ff; border-color: #b3d9ff; color: #1a5a8a; box-shadow: 0 3px 0 #b3d9ff; }
.callout-warn  { background: #fff8e0; border-color: var(--yellow); color: #785a00; box-shadow: 0 3px 0 #e6c700; }
.callout-tip   { background: #e8fae8; border-color: #a8e6a8; color: #1a5a1a; box-shadow: 0 3px 0 #a8e6a8; }
.callout-success { background: var(--bg3); border-color: var(--border); color: var(--text2); padding: 10px 14px; }

/* ── REAL WORLD BOX ── */
.real-world-box {
  background: var(--bg2); border: 2px solid var(--border);
  border-bottom: 4px solid var(--border2); border-radius: var(--r2);
  padding: 20px; margin: 24px 0;
}
.real-world-title { font-size: 13px; font-weight: 800; color: var(--accent); margin-bottom: 10px; }
.real-world-body { font-size: 13.5px; color: var(--text2); line-height: 1.7; }

/* ── END OF CHAPTER NAV ── */
.ch-end-nav {
  display: flex; gap: 12px; margin-top: 36px; padding-top: 24px;
  border-top: 2px solid var(--border); justify-content: center; flex-wrap: wrap;
}
.ch-end-btn {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 16px 24px; border-radius: var(--r2); cursor: pointer;
  border: 2px solid var(--border); border-bottom: 4px solid var(--border2);
  background: var(--bg2); color: var(--text2); font-weight: 800;
  font-size: 13px; transition: all .1s; min-width: 130px;
  text-transform: uppercase; letter-spacing: .04em;
}
.ch-end-btn:hover { transform: translateY(-2px); border-color: var(--accent); color: var(--accent); }
.ch-end-btn:active { transform: translateY(2px); border-bottom-width: 2px; }
.ch-end-btn.primary {
  background: var(--green); color: var(--greenfg);
  border-color: var(--green2); border-bottom-color: var(--green2);
}
.ch-end-btn.primary:hover { background: var(--green2); }
.ch-end-btn-icon { font-size: 22px; }
.ch-end-btn-label { font-size: 11px; }

/* ── BUTTONS ── */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 10px 22px; border-radius: var(--r2); font-size: 14px;
  font-weight: 800; border: 2px solid; cursor: pointer; transition: all .1s;
  text-transform: uppercase; letter-spacing: .04em;
}
.btn:active { transform: translateY(2px); border-bottom-width: 2px !important; }
.btn-primary {
  background: var(--green); color: var(--greenfg);
  border-color: var(--green2); border-bottom: 4px solid var(--green2);
}
.btn-primary:hover { background: var(--green2); }
.btn-ghost {
  background: var(--bg2); color: var(--text2);
  border-color: var(--border2); border-bottom: 4px solid var(--border2);
}
.btn-ghost:hover { background: var(--bg3); color: var(--text); }

/* ── GAME ── */
.game-wrap { max-width: 680px; }
.game-start-card { max-width: 420px; margin: 0 auto; text-align: center; padding: 40px 24px; }
.game-icon { font-size: 56px; margin-bottom: 16px; filter: drop-shadow(0 4px 0 rgba(0,0,0,.1)); }
.game-start-title { font-size: 24px; font-weight: 900; color: var(--text); margin-bottom: 8px; letter-spacing: -.5px; }
.game-start-desc { font-size: 14px; color: var(--text2); margin-bottom: 24px; }
.game-rules { display: flex; justify-content: center; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
.game-rule {
  font-size: 13px; font-weight: 700; color: var(--text2);
  background: var(--bg3); padding: 8px 14px; border-radius: var(--r);
  border: 2px solid var(--border);
}
.game-hud {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 20px; padding: 12px 18px;
  background: var(--bg2); border-radius: var(--r2);
  border: 2px solid var(--border); border-bottom: 4px solid var(--border2);
}
.hud-score { font-size: 22px; font-weight: 900; color: var(--green); font-family: var(--mono); }
.hud-timer { font-size: 15px; font-weight: 800; color: var(--text2); font-family: var(--mono); }
.game-q-text { font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 20px; line-height: 1.4; }
.game-opts { display: flex; flex-direction: column; gap: 10px; }
.game-opt {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px; border-radius: var(--r2);
  border: 2px solid var(--border); border-bottom: 4px solid var(--border2);
  background: var(--bg2); cursor: pointer; transition: all .1s;
  font-size: 14px; font-weight: 600; color: var(--text);
}
.game-opt:hover { border-color: var(--accent); border-bottom-color: var(--accent2); transform: translateY(-1px); }
.game-opt:active { transform: translateY(2px); border-bottom-width: 2px; }
.game-opt.correct { border-color: var(--green); border-bottom-color: var(--green2); background: #e8fae8; color: #1a5a1a; }
.game-opt.wrong   { border-color: var(--red); background: #fff0f0; color: #8a1a1a; }
.opt-letter {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--bg3); border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 900; flex-shrink: 0; color: var(--text2);
  font-family: var(--mono);
}
.game-result-card { max-width: 420px; margin: 32px auto 0; text-align: center; }
.result-score { font-size: 60px; font-weight: 900; color: var(--green); font-family: var(--mono); line-height: 1; margin-bottom: 4px; }
.result-label { font-size: 20px; font-weight: 900; color: var(--text); margin-bottom: 24px; }
.result-emoji { font-size: 52px; margin-bottom: 8px; }
.result-btns { display: flex; gap: 12px; justify-content: center; }
.result-stars { font-size: 28px; margin-bottom: 8px; }

/* ── QUIZ ── */
.quiz-wrap { max-width: 680px; }
.quiz-prog { display: flex; gap: 4px; margin-bottom: 24px; }
.quiz-pip { flex: 1; height: 8px; border-radius: 4px; background: var(--border2); transition: background .2s; }
.quiz-pip.done { background: var(--green); }
.quiz-pip.cur  { background: var(--accent); }
.quiz-q-card { display: none; }
.quiz-q-card.active { display: block; }
.quiz-meta { font-size: 11px; font-weight: 800; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
.quiz-q { font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 20px; line-height: 1.4; }
.quiz-opts { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.quiz-opt {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 18px; border-radius: var(--r2);
  border: 2px solid var(--border); border-bottom: 4px solid var(--border2);
  background: var(--bg2); cursor: pointer; transition: all .1s;
  font-size: 14px; font-weight: 600; color: var(--text);
}
.quiz-opt:hover { border-color: var(--accent); border-bottom-color: var(--accent2); transform: translateY(-1px); }
.quiz-opt:active { transform: translateY(2px); border-bottom-width: 2px; }
.quiz-opt.selected { border-color: var(--accent); background: #f0f4ff; }
.quiz-opt.correct   { border-color: var(--green); border-bottom-color: var(--green2); background: #e8fae8; }
.quiz-opt.wrong     { border-color: var(--red); border-bottom-color: #cc0000; background: #fff0f0; }
.quiz-exp {
  padding: 14px 18px; background: #e8fae8; border-radius: var(--r2);
  border: 2px solid var(--green); border-bottom: 4px solid var(--green2);
  font-size: 13.5px; color: #1a5a1a; margin: 12px 0; line-height: 1.6;
}
.quiz-actions { display: flex; gap: 10px; margin-top: 8px; }
.quiz-result { display: none; text-align: center; padding: 32px 0; }
.qr-score { font-size: 56px; font-weight: 900; font-family: var(--mono); color: var(--green); margin-bottom: 4px; }
.qr-label { font-size: 20px; font-weight: 900; color: var(--text); margin-bottom: 24px; }
.quiz-nav { display: flex; justify-content: space-between; margin-top: 12px; }

/* ── CHEAT / SUMMARY ── */
.cheat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 14px; margin-top: 8px; }
.cheat-card {
  background: var(--bg2); border: 2px solid var(--border);
  border-bottom: 4px solid var(--border2); border-radius: var(--r2); padding: 16px;
}
.cheat-card-title { font-size: 11px; font-weight: 900; color: var(--accent); margin-bottom: 12px; text-transform: uppercase; letter-spacing: .08em; }
.cheat-item { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 12.5px; }
.cheat-item:last-child { border-bottom: none; }
.cheat-key { font-family: var(--mono); color: var(--accent); font-weight: 700; font-size: 11.5px; flex-shrink: 0; }
.cheat-val { color: var(--text2); text-align: right; font-size: 11.5px; }

/* ── CREDITS ── */
.credits-bar { border-top: 2px solid var(--border); padding: 32px 0; margin-top: 48px; }
.credits-title { font-size: 10px; font-weight: 900; color: var(--accent); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 16px; font-family: var(--mono); }
.credits-grid { display: flex; flex-wrap: wrap; gap: 24px; }
.credit-group { flex: 1; min-width: 140px; }
.credit-group-title { font-size: 11px; font-weight: 800; color: var(--text2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .05em; }
.credit-item { font-size: 12px; color: var(--text3); line-height: 1.9; }
.credit-item a { color: var(--accent); text-decoration: none; font-weight: 700; }
.credit-item a:hover { text-decoration: underline; }

/* ── MOBILE ── */
@media (max-width: 700px) {
  .main { padding-top: 108px; padding-left: 16px; padding-right: 16px; }
  .ch-title { font-size: 20px; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .flow-row { padding: 14px; gap: 4px; }
  .flow-step-label { font-size: 9px; max-width: 52px; }
  .game-rules { gap: 10px; }
  .quiz-actions { flex-wrap: wrap; }
  .result-btns { flex-wrap: wrap; }
  .ch-end-nav { gap: 8px; }
  .ch-end-btn { min-width: 100px; padding: 14px 16px; }
}
@media (max-width: 480px) {
  .ch-nav { padding: 6px 10px; }
  .ch-btn { padding: 7px 10px; min-width: 44px; }
}


/* ── RICH SUMMARY CARDS ── */
.sum-block { margin-bottom: 28px; }
.sum-block-title {
  font-size: 13px; font-weight: 800; color: var(--accent);
  text-transform: uppercase; letter-spacing: .08em;
  margin-bottom: 10px; font-family: var(--mono);
  display: flex; align-items: center; gap: 8px;
}
.sum-block-title::after { content:''; flex:1; height:1px; background:var(--border); }
.sum-row {
  display: grid; grid-template-columns: 200px 1fr;
  gap: 10px 16px; padding: 9px 0;
  border-bottom: 1px solid var(--border); align-items: start;
}
.sum-row:last-child { border-bottom: none; }
.sum-k { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--accent); line-height: 1.4; }
.sum-v { font-size: 13px; color: var(--text2); line-height: 1.6; }
.sum-v strong { color: var(--text); font-weight: 700; }
.sum-v code { font-size: 11.5px; background: var(--bg3); padding: 1px 5px; border-radius: 3px; color: var(--accent2,var(--accent)); font-family: var(--mono); }
.sum-tip { margin-top: 10px; padding: 10px 14px; background: var(--yellowbg,#fffbeb); border-radius: var(--r,8px); border: 1px solid #fde68a; font-size: 13px; color: #713f12; line-height: 1.6; }
.sum-danger { margin-top: 10px; padding: 10px 14px; background: #fff1f2; border-radius: var(--r,8px); border: 1px solid #fecaca; font-size: 13px; color: #991b1b; line-height: 1.6; }
@media (max-width: 560px) { .sum-row { grid-template-columns: 1fr; gap: 2px; } }
/* ── FULL REVIEW DRAWER ── */
.review-btn { flex-shrink:0; padding:5px 12px; background:var(--accent); color:#fff; border:none; border-radius:var(--r,8px); font-size:12px; font-weight:700; cursor:pointer; transition:all .15s; letter-spacing:.02em; margin-left:6px; }
[dir="rtl"] .review-btn { margin-left:0; margin-right:6px; }
.review-btn:hover { opacity:.85; }
.review-overlay { display:none; position:fixed; inset:0; z-index:900; background:rgba(0,0,0,.45); backdrop-filter:blur(2px); }
.review-overlay.open { display:block; }
.review-drawer { position:fixed; top:0; left:0; right:0; z-index:910; background:var(--bg,#fff); border-bottom:2px solid var(--accent); box-shadow:0 4px 16px rgba(0,0,0,.15); transform:translateY(-100%); transition:transform .3s cubic-bezier(.4,0,.2,1); max-height:90vh; display:flex; flex-direction:column; }
.review-drawer.open { transform:translateY(0); }
.review-header { display:flex; align-items:center; justify-content:space-between; padding:14px 20px; border-bottom:1px solid var(--border); flex-shrink:0; gap:12px; background:var(--bg,#fff); }
.review-header-title { font-size:15px; font-weight:800; color:var(--text,#111); }
.review-header-sub { font-size:12px; color:var(--text3,#888); font-weight:500; }
.review-close { width:32px; height:32px; border-radius:50%; background:var(--bg2,#f8f9fa); border:1px solid var(--border); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--text2,#666); line-height:1; transition:all .15s; }
.review-close:hover { background:#fff1f2; border-color:#dc2626; color:#dc2626; }
.review-body { overflow-y:auto; padding:24px 20px 40px; flex:1; }
.review-body::-webkit-scrollbar { width:6px; }
.review-body::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
.review-chapter-block { margin-bottom:36px; border:1px solid var(--border); border-radius:12px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08); }
.review-chapter-title { background:var(--accentbg,rgba(14,116,144,.06)); border-bottom:1px solid var(--border); padding:12px 18px; display:flex; align-items:center; gap:10px; }
.review-chapter-num { font-family:var(--mono); font-size:11px; font-weight:800; color:var(--accent); background:var(--bg,#fff); border:1px solid var(--accent); border-radius:6px; padding:2px 8px; flex-shrink:0; }
.review-chapter-name { font-size:14px; font-weight:800; color:var(--text,#111); }
.review-chapter-body { padding:18px; background:var(--bg,#fff); }
.review-chapter-body .sum-block { margin-bottom:20px; }
.review-chapter-body .sum-block:last-child { margin-bottom:0; }
.review-chapter-body .sum-row { grid-template-columns:170px 1fr; padding:7px 0; }
.review-chapter-body .sum-v { font-size:12.5px; }
.review-chapter-body .sum-k { font-size:11.5px; }
@media (max-width:680px) { .review-drawer{max-height:95vh} .review-body{padding:16px 14px 32px} .review-chapter-body .sum-row{grid-template-columns:1fr} }

/* ── TOOL DEMOS ── */
.td{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin:18px 0;box-shadow:0 1px 8px rgba(0,0,0,.07)}
.td-dark{background:#16181d}
.td-bar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:#f0f0ea;border-bottom:1px solid #e5e5e0}
.td-dark .td-bar{background:#1e2025;border-color:#2d3038}
.td-dots{display:flex;gap:5px;flex-shrink:0}
.td-dot{width:11px;height:11px;border-radius:50%}
.td-r{background:#ff5f57}.td-y{background:#febc2e}.td-g{background:#28c840}
.td-url{flex:1;min-width:0;background:var(--bg2);border:1px solid #ddd;border-radius:6px;padding:3px 10px;font-size:11.5px;color:var(--text2);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td-dark-url{background:#111318;border-color:#2d3038;color:#9ca3af}
.td-title{padding:8px 16px;font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;font-family:var(--sans);background:var(--bg2);border-bottom:1px solid var(--bg3)}
.td-body{background:var(--bg2);padding:14px 18px;font-family:var(--mono);font-size:12.5px;line-height:1.8;direction:ltr;text-align:left;overflow-x:auto}
.td-body-dark{background:#16181d;color:#e2e8f0}
.td-row{display:grid;grid-template-columns:180px 1fr;gap:2px 10px;padding:3px 0;border-bottom:1px solid #f5f5f0}
.td-row:last-child{border-bottom:none}
.td-k{color:var(--accent);font-weight:600}.td-v{color:var(--text)}
.tc-prompt{color:#4ade80}.tc-cmd{color:#93c5fd}.tc-key{color:#6ee7b7}.tc-val{color:#e2e8f0}
/* ── MATCH GAME ── */
.match-board{padding:16px}
.match-success{text-align:center;font-size:18px;font-weight:800;color:var(--green2);padding:16px;background:#f0fdf4;border-radius:12px;margin-bottom:16px;border:2px solid var(--green)}
.match-restart-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:14px;font-weight:700;cursor:pointer}
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match-col{display:flex;flex-direction:column;gap:8px}
.match-card{padding:10px 14px;border:2px solid var(--border);border-radius:10px;background:var(--bg2);font-size:13px;line-height:1.4;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
[dir="rtl"] .match-card{direction:rtl;text-align:right}
[dir="ltr"] .match-card{direction:ltr;text-align:left}
.match-card:hover:not(.match-done){border-color:var(--accent);background:#f0f9ff;transform:translateY(-1px)}
.match-sel{border-color:var(--accent)!important;background:#e0f2fe!important;box-shadow:0 0 0 3px rgba(14,116,144,.15)}
.match-done{border-color:var(--green)!important;background:#f0fdf4!important;color:var(--green2);cursor:default;opacity:.8}
.match-wrong{border-color:var(--red)!important;background:#fff1f2!important;animation:matchShake .4s ease}
@keyframes matchShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media(max-width:560px){.match-cols{grid-template-columns:1fr}.td-body{font-size:11px;padding:10px 12px}.td-row{grid-template-columns:100px 1fr}}


/* ── BIDI ISOLATION — Hebrew/English mix fix ── */
p.prose, .section-title, .callout, .callout.idea, .callout.warn,
td, th, li, .sc-text, .sc-label, .td-k, .td-v,
.ch-title, .ch-desc, .tab-btn, .ch-end-btn-label,
.match-card, .review-chapter {
  unicode-bidi: isolate;
}
/* Code/pre always LTR regardless of document dir */
code, pre, .td-body, .td-body-dark, .td-url, .td-dark-url {
  unicode-bidi: isolate;
  direction: ltr;
  text-align: left;
}
/* Inline code inside RTL text */
p.prose code, td code, li code {
  unicode-bidi: isolate;
  direction: ltr;
  display: inline-block;
}


/* ── LIST BIDI FIX ── */
[dir="rtl"] ol.prose, [dir="rtl"] ul.prose { direction: rtl; text-align: right; }
[dir="rtl"] ol.prose li, [dir="rtl"] ul.prose li {
  direction: rtl;
  text-align: right;
  unicode-bidi: isolate;
}
[dir="ltr"] ol.prose, [dir="ltr"] ul.prose { direction: ltr; text-align: left; }
[dir="ltr"] ol.prose li, [dir="ltr"] ul.prose li {
  direction: ltr;
  text-align: left;
  unicode-bidi: isolate;
}
ol.prose li strong:first-child,
ul.prose li strong:first-child {
  unicode-bidi: isolate;
  direction: ltr;
  display: inline-block;
}


/* ── CHEAT CARDS ── */

.escape-promo-banner {

.escape-promo-info { flex: 1; min-width: 240px; }
.escape-promo-badge {
  display: inline-block;
  background: var(--accent);

  font-size: 11px;
  font-weight: 900;
  padding: 3px 10px;
  border-radius: 99px;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: .05em;
}
.escape-promo-title {
  font-size: 20px;
  font-weight: 900;
  color: var(--text);
  margin-bottom: 6px;
}
.escape-promo-desc {
  font-size: 13.5px;

}
.escape-launch-btn {

}
.escape-launch-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
.escape-launch-btn:active { transform: translateY(2px); border-bottom-width: 2px; }

/* Escape Room Container */
.er-wrap {
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.er-hud {
  background: var(--bg2);
  border: 2px solid var(--border);
  border-bottom: 4px solid var(--border2);
  border-radius: var(--r2);
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.er-hud-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.er-mission-tag {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 900;
  font-size: 14px;
  color: var(--accent);
}
.er-timers {
  display: flex;
  align-items: center;
  gap: 12px;
}
.er-latency-pill {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 900;
  padding: 6px 14px;
  border-radius: 99px;
  background: #0f172a;
  color: #38bdf8;
  border: 2px solid #0284c7;
  display: flex;
  align-items: center;
  gap: 6px;
}
.er-latency-pill .pulse-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #4ade80;
  box-shadow: 0 0 8px #4ade80;
  animation: erPulse 1.2s infinite;
}
@keyframes erPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.8); }
}

/* 6-Station Stepper */
.er-stepper {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
}
.er-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 4px;
  border-radius: var(--r);
  background: var(--bg3);
  border: 2px solid var(--border);
  font-size: 11px;
  font-weight: 700;
  color: var(--text3);
  text-align: center;
  transition: all .2s;
  cursor: pointer;
}
.er-step.done {
  background: rgba(88, 204, 2, 0.12);
  border-color: var(--green);
  color: var(--green2);
  cursor: pointer;
}
.er-step.active {
  background: var(--accent);
  border-color: var(--accent2);
  color: #fff;
  transform: translateY(-2px);
  box-shadow: 0 4px 10px rgba(14, 116, 144, 0.25);
}
.er-step-num {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 900;
  opacity: 0.85;
}
.er-step-name {
  font-size: 10px;
  line-height: 1.15;
}

/* Live packet journey map */
.er-journey {
  background: linear-gradient(180deg, #f4fbfc 0%, #eef6f8 100%);
  border: 2px solid #c5e4ea;
  border-radius: var(--r);
  padding: 12px 14px 10px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.er-journey-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  font-size: 11px;
  font-weight: 800;
  color: var(--accent2);
}
.er-journey-ips {
  direction: ltr;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 800;
  color: var(--accent);
  background: #fff;
  border: 1px solid #c5e4ea;
  border-radius: 99px;
  padding: 3px 10px;
}
.er-path {
  direction: ltr;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0;
  overflow-x: auto;
  padding: 4px 2px 2px;
  scrollbar-width: none;
}
.er-path::-webkit-scrollbar { display: none; }
.er-hop {
  flex: 0 0 auto;
  width: 68px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: none;
  border: none;
  padding: 0;
  cursor: pointer;
  color: inherit;
  font: inherit;
}
.er-hop[disabled] { cursor: default; }
.er-hop-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  background: #fff;
  border: 2px solid var(--border2);
  box-shadow: 0 2px 0 var(--border);
  transition: all .2s;
}
.er-hop.done .er-hop-icon {
  background: #dcfce7;
  border-color: var(--green);
  box-shadow: 0 2px 0 var(--green2);
}
.er-hop.active .er-hop-icon {
  background: #cffafe;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(14, 116, 144, 0.16);
  animation: hopPulse 1.5s ease-in-out infinite;
}
@keyframes hopPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}
.er-hop-name {
  font-size: 10px;
  font-weight: 800;
  color: var(--text2);
  line-height: 1.15;
  text-align: center;
}
.er-hop.done .er-hop-name,
.er-hop.active .er-hop-name { color: var(--text); }
.er-hop-meta {
  font-size: 9px;
  font-weight: 700;
  color: var(--text3);
  font-family: var(--mono);
  text-align: center;
  line-height: 1.2;
}
.er-hop.done .er-hop-meta { color: var(--green2); }
.er-hop.active .er-hop-meta { color: var(--accent); }
.er-wire {
  flex: 1 1 14px;
  min-width: 12px;
  height: 4px;
  margin-top: 18px;
  border-radius: 99px;
  background: #d7e3e6;
  position: relative;
  overflow: visible;
}
.er-wire.lit {
  background: linear-gradient(90deg, #58cc02, #0e7490);
}
.er-wire.now {
  background: linear-gradient(90deg, #0e7490, #22d3ee);
}
.er-packet {
  position: absolute;
  top: -13px;
  inset-inline-start: 0;
  font-size: 16px;
  line-height: 1;
  animation: packetRun 1.5s ease-in-out infinite;
  filter: drop-shadow(0 2px 2px rgba(15, 23, 42, 0.2));
}
@keyframes packetRun {
  0% { inset-inline-start: 0; transform: translateY(0); }
  50% { inset-inline-start: calc(100% - 16px); transform: translateY(-3px); }
  100% { inset-inline-start: 0; transform: translateY(0); }
}
.er-journey-status {
  font-size: 12px;
  font-weight: 700;
  color: var(--text);
  background: #fff;
  border: 1px dashed #b7d4da;
  border-radius: 10px;
  padding: 7px 10px;
  text-align: center;
}

/* Station Card */
.er-station-card {
  background: var(--bg2);
  border: 2px solid var(--border);
  border-bottom: 5px solid var(--border2);
  border-radius: var(--r2);
  padding: 24px;
}
.er-st-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.er-st-badge {
  display: inline-block;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 900;
  padding: 4px 10px;
  border-radius: 8px;
  background: var(--bg3);
  color: var(--accent);
  border: 1px solid var(--border2);
  margin-bottom: 6px;
}
.er-st-title {
  font-size: 21px;
  font-weight: 900;
  color: var(--text);
  line-height: 1.25;
}
.er-st-story {
  font-size: 14.5px;
  color: var(--text2);
  line-height: 1.7;
  margin-bottom: 18px;
  padding: 14px 16px;
  background: var(--bg3);
  border-radius: var(--r);
  border-right: 4px solid var(--accent);
}
[dir="ltr"] .er-st-story {
  border-right: none;
  border-left: 4px solid var(--accent);
}

/* Interactive Puzzle Elements */
.er-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 16px 0;
}
.er-opt-btn {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: inherit;
  padding: 14px 16px;
  border-radius: var(--r);
  border: 2px solid var(--border);
  border-bottom: 4px solid var(--border2);
  background: var(--bg2);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all .12s;
}
.er-opt-btn:hover:not(:disabled) {
  border-color: var(--accent);
  border-bottom-color: var(--accent2);
  transform: translateY(-1px);
}
.er-opt-btn.correct {
  background: rgba(88, 204, 2, 0.14) !important;
  border-color: var(--green) !important;
  border-bottom-color: var(--green2) !important;
  color: var(--text) !important;
}
.er-opt-btn.wrong {
  background: rgba(255, 75, 75, 0.12) !important;
  border-color: var(--red) !important;
  animation: matchShake .4s ease;
}
.er-opt-key {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--bg3);
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 900;
  color: var(--accent);
  flex-shrink: 0;
}

/* DNS Chain Builder */
.er-dns-slots {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin: 14px 0;
}
.er-dns-slot {
  padding: 10px 8px;
  border-radius: var(--r);
  border: 2px dashed var(--border2);
  background: var(--bg3);
  text-align: center;
  min-height: 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 700;
  color: var(--text2);
}
.er-dns-slot.filled {
  border-style: solid;
  border-color: var(--accent);
  background: var(--bg2);
  color: var(--text);
}
.er-dns-pool {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}
.er-chip-btn {
  padding: 10px 14px;
  border-radius: var(--r);
  border: 2px solid var(--border);
  border-bottom: 4px solid var(--border2);
  background: var(--bg2);
  color: var(--text);
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: all .12s;
}
.er-chip-btn:hover:not(:disabled) {
  border-color: var(--accent);
  transform: translateY(-1px);
}
.er-chip-btn:disabled {
  opacity: 0.4;
  cursor: default;
}

/* Feedback & Hints */
.er-feedback {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: var(--r);
  font-size: 14px;
  line-height: 1.6;
  font-weight: 600;
  display: none;
}
.er-feedback.show { display: block; }
.er-feedback.ok {
  background: rgba(88, 204, 2, 0.14);
  border: 2px solid var(--green);
  color: var(--text);
}
.er-feedback.err {
  background: rgba(255, 75, 75, 0.12);
  border: 2px solid var(--red);
  color: var(--text);
}
.er-actions-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.er-hint-box {
  margin-top: 12px;
  padding: 12px 16px;
  border-radius: var(--r);
  background: rgba(255, 217, 0, 0.14);
  border: 2px solid var(--yellow);
  font-size: 13px;
  color: var(--text);
  display: none;
}
.er-hint-box.show { display: block; }

/* Victory Screen */
.er-victory {
  background: var(--bg2);
  border: 3px solid var(--green);
  border-bottom: 6px solid var(--green2);
  border-radius: var(--r3);
  padding: 32px 24px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.er-victory-badge {
  font-size: 64px;
  margin-bottom: 10px;
  display: inline-block;
  animation: erBounce 1.4s ease infinite;
}
@keyframes erBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}
.er-victory-title {
  font-size: 28px;
  font-weight: 900;
  color: var(--text);
  margin-bottom: 6px;
}
.er-victory-rank {
  display: inline-block;
  background: linear-gradient(135deg, #0e7490, #0284c7);
  color: #fff;
  font-weight: 900;
  font-size: 14px;
  padding: 6px 18px;
  border-radius: 99px;
  margin-bottom: 20px;
}
.er-stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  max-width: 540px;
  margin: 0 auto 24px;
}
.er-stat-box {
  background: var(--bg3);
  border: 2px solid var(--border);
  border-radius: var(--r);
  padding: 12px;
}
.er-stat-val {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 900;
  color: var(--accent);
}
.er-stat-lbl {
  font-size: 11.5px;
  color: var(--text2);
  font-weight: 700;
}
.er-summary-list {
  text-align: inherit;
  max-width: 600px;
  margin: 0 auto 24px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.er-sum-item {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 10px 12px;
  font-size: 12.5px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  color: var(--text);
}

@media (max-width: 640px) {
  .er-stepper { grid-template-columns: repeat(3, 1fr); }
  .er-dns-slots { grid-template-columns: 1fr 1fr; }
  .er-stats-grid { grid-template-columns: 1fr; }
  .er-summary-list { grid-template-columns: 1fr; }
  .er-hop { width: 56px; }
  .er-hop-icon { width: 36px; height: 36px; font-size: 16px; }
  .er-hop-meta { display: none; }
}

</style>
</head>

<div class="did-you-know">🌊 <strong>הידעתם?</strong> מעל 99% מתעבורת האינטרנט הבין-יבשתית (כולל הודעות WhatsApp, סרטוני YouTube ושיחות Zoom) אינה עוברת בלוויינים בחלל — אלא דרך כ-550 כבלי סיבים אופטיים תת-ימיים המונחים על קרקעית האוקיינוסים באורך מצטבר של מעל 1.4 מיליון קילומטרים!</div>

<div class="section-title">האינטרנט — לא ענן, לא אלחוטי. כבלים פיזיים.</div>

<div class="callout idea">💡 <strong>האינטרנט (Internet) מול הרשת הכלל-עולמית (WWW):</strong><br>
<strong>האינטרנט</strong> הוא תשתית הכבישים והמחלפים (כבלים, נתבים, פרוטוקולי IP/TCP). <strong>ה-Web (WWW)</strong> הוא רק שירות אחד שנוסע על הכבישים האלה (דפי HTML בפורט 443). דואר אלקטרוני (SMTP), שיחות וידאו (WebRTC/UDP), משחקי רשת, וחיבורי SSH הם כלי רכב אחרים שנוסעים בדיוק על אותה תשתית אינטרנט!</div>

<div class="section-title">Packet Switching — ההמצאה שהכל מתבסס עליה</div>
<p class="prose">לפני שנות ה-60, רשתות טלפוניה עבדו בשיטת <strong>Circuit Switching (מיתוג מעגלים)</strong>: כל שיחה שמרה קו פיזי ייעודי ובלעדי בין שני הצדדים לאורך כל השיחה — גם כששני הצדדים שתקו. ב-1969, במסגרת פרויקט <strong>ARPANET</strong> (בהובלת פול בארן ודונלד דייוויס), נולדה מהפכת <strong>Packet Switching (מיתוג מנות)</strong>.</p>
<p class="prose">במקום לתפוס כבל שלם, כל קובץ, תמונה או הודעה מפורקים ליחידות קטנות שנקראות <strong>Packets (חבילות מידע)</strong> — לרוב בגודל של עד <code>1,500 Bytes</code> (גודל ה-<strong>MTU</strong> — Maximum Transmission Unit). כל חבילה מקבלת כותרת (Header) עם כתובת מקור, כתובת יעד ומספר סידורי, ויוצאת לדרך עצמאית:</p>

<div class="section-title">מודל 5 השכבות של TCP/IP וכימוס (Encapsulation)</div>
<p class="prose">כדי שמערכות הפעלה, כרטיסי רשת ואפליקציות של יצרנים שונים יוכלו לדבר זה עם זה, תקשורת מחשבים בנויה ב<strong>שכבות (Layers)</strong>. כל שכבה פותרת בעיה הנדסית אחת בדיוק, ומספקת שירות לשכבה שמעליה. במודל התיאורטי <strong>OSI</strong> יש 7 שכבות, ובמודל הפרקטי של האינטרנט (<strong>TCP/IP</strong>) אנו עובדים עם 5 שכבות מרכזיות.</p>

<div class="section-title">ISP Tiers ו-IXP — ההיררכיה שמחברת את כדור הארץ</div>
<p class="prose">אף חברה אחת לא מחזיקה את "כל האינטרנט". הרשת העולמית היא פדרציה של עשרות אלפי רשתות עצמאיות (Autonomous Systems) המחוברות בשלוש רמות:</p>

<div class="section-title">Subnet ו-CIDR — איך מחלקים רשת עם מחשבון אינטראקטיבי</div>
<p class="prose">כתובת IPv4 מורכבת מ-32 סיביות (Bits), המחולקות ל-4 מספרים בין 0 ל-255 (למשל <code>192.168.1.5</code>). חלק מהסיביות מייצגות את <strong>מזהה הרשת (Network Prefix)</strong> וחלק את <strong>מזהה המכשיר (Host ID)</strong>. הסימון <strong>CIDR</strong> (למשל <code>/24</code>) מציין כמה סיביות משמאל נעולות עבור הרשת. מתוך כלל הכתובות בתת-הרשת, שתי כתובות תמיד שמורות: הראשונה היא <strong>כתובת הרשת (Network Address)</strong> והאחרונה היא <strong>כתובת השידור לכולם (Broadcast Address)</strong>.</p>

      • כתובת רשת: <code>192.168.1.0</code> | כתובת Broadcast: <code>192.168.1.255</code> · <strong>שימוש:</strong> רשת ביתית או משרדית קלאסית.
    </div>
  </div>
</div>

<div class="did-you-know">📍 <strong>הידעתם?</strong> ב-IPv4 יש בדיוק 2<sup>32</sup> = <code>4,294,967,296</code> כתובות. בפברואר 2011 ארגון IANA חילק את הבלוק האחרון של כתובות IPv4 בעולם! לעומת זאת, ב-IPv6 (128 סיביות) יש <code>3.4 × 10<sup>38</sup></code> כתובות — מספיק כדי לתת מיליארדי כתובות IP לכל גרגר חול על פני כדור הארץ.</div>

<div class="section-title">IP Address — כתובת הלוגית של כל מכשיר ברשת</div>
<p class="prose">כל מכשיר שמחובר לאינטרנט חייב <strong>כתובת IP (Internet Protocol)</strong> בשכבה 3 כדי לשלוח ולקבל חבילות מידע. חשוב להבחין בין כתובות <strong>פרטיות (Private IPs — RFC 1918)</strong> שעובדות רק בתוך הרשת הפנימית (בית/משרד) ואינן מנותבות באינטרנט הציבורי, לבין כתובות <strong>ציבוריות (Public IPs)</strong> ייחודיות בעולם:</p>

<table class="data-table">
<tr><th>סוג כתובת</th><th>טווח / דוגמה</th><th>היכן תקפה?</th><th>מי מקצה?</th></tr>
<tr><td><strong>IPv4 פרטי (Class C/B/A)</strong></td><td><code>192.168.0.0/16</code>, <code>10.0.0.0/8</code>, <code>172.16.0.0/12</code></td><td>בתוך הרשת המקומית (LAN) בלבד</td><td>הנתב המקומי (DHCP)</td></tr>
<tr><td><strong>IPv4 ציבורי (Public)</strong></td><td><code>142.250.185.46</code>, <code>85.250.12.44</code></td><td>בכל האינטרנט העולמי (WAN)</td><td>ספק האינטרנט (ISP / IANA)</td></tr>
<tr><td><strong>IPv6 (דור 6 — 128-bit)</strong></td><td><code>2001:0db8:85a3::8a2e:0370:7334</code></td><td>גלובלית (אין צורך ב-NAT!)</td><td>ISP / SLAAC / DHCPv6</td></tr>
<tr><td><strong>Loopback (עצמי)</strong></td><td><code>127.0.0.1</code> (IPv4) / <code>::1</code> (IPv6)</td><td>בתוך המחשב עצמו בלבד (<code>localhost</code>)</td><td>מובנה במערכת ההפעלה</td></tr>
</table>

<div class="section-title">NAT ו-PAT — איך נתב אחד מסתיר עשרות מכשירים</div>
<p class="prose">כיצד 30 מכשירים בבית (טלפונים, מחשבים, טלוויזיות) גולשים יחד כשבזק/הוט נותנים לבית רק <strong>כתובת IP ציבורית אחת</strong>? הפתרון הוא <strong>NAT (Network Address Translation)</strong>, ובתצורתו הנפוצה <strong>PAT (Port Address Translation)</strong>.</p>
<p class="prose">כשהמחשב שלכם (<code>192.168.1.5</code>) פונה לגוגל מפורט מקור אקראי (Ephemeral Port) כמו <code>54321</code>, הנתב הביתי מחליף את כתובת המקור בכתובת הציבורית שלו (למשל <code>85.250.12.44</code>) ורושם בטבלת ה-NAT שלו למי שייך הפורט:</p>

<table class="data-table">
<tr><th>מכשיר ברשת הביתית</th><th>כתובת מקור פנימית (LAN)</th><th>כתובת מקור יוצאת (WAN אחרי NAT)</th><th>יעד (Destination)</th></tr>
<tr><td>💻 לפטופ של דוד</td><td><code>192.168.1.5:54321</code></td><td><code>85.250.12.44:40001</code></td><td><code>142.250.185.46:443</code></td></tr>
<tr><td>📱 אייפון של רוני</td><td><code>192.168.1.9:61200</code></td><td><code>85.250.12.44:40002</code></td><td><code>142.250.185.46:443</code></td></tr>
</table>
<div class="callout warn">⚠️ <strong>מגבלת NAT ו-Port Forwarding:</strong> מכיוון שמבחוץ רואים רק את הנתב (<code>85.250.12.44</code>), שרת חיצוני לא יכול ליזום חיבור ישיר למחשב פנימי. אם תרצו להריץ שרת משחק או אתר מהבית, תצטרכו להגדיר בנתב <strong>Port Forwarding</strong> (למשל: "כל חבילה נכנסת לפורט 8080 תועבר ל-<code>192.168.1.5:8080</code>").</div>

<div class="section-title">DNS — ספר הטלפונים ההיררכי של האינטרנט וסוגי רשומות</div>
<p class="prose">בני אדם זוכרים שמות כמו <code>google.com</code>, אך נתבים מבינים רק כתובות IP. מערכת ה-<strong>DNS (Domain Name System — פורט 53)</strong> מתרגמת שמות לכתובות תוך מילישניות בודדות דרך היררכיה עולמית:</p>
<ol class="prose">
<li><strong>Browser &amp; OS Cache + קובץ <code>hosts</code></strong> — המחשב בודק בזיכרון המקומי אם השם פוענח לאחרונה (לפי זמן ה-<strong>TTL</strong>). אם כן — התשובה מיידית (0ms).</li>
<li><strong>Recursive Resolver (שרת ה-DNS של ה-ISP או <code>8.8.8.8</code> / <code>1.1.1.1</code>)</strong> — השרת שעושה את החיפוש עבורכם. אם התשובה אצלו ב-Cache, הוא עונה מיד (~5ms).</li>
<li><strong>Root Name Servers (<code>.</code>)</strong> — 13 אשכולות שרתי שורש בעולם (<code>a.root-servers.net</code> עד <code>m</code>) שמפנים לשרת הסיומת המתאים.</li>
<li><strong>TLD Name Server (Top-Level Domain)</strong> — אחראי על הסיומת (<code>.com</code>, <code>.org</code>, <code>.co.il</code>) ומפנה לשרת המוסמך של הדומיין.</li>
<li><strong>Authoritative Name Server</strong> — השרת הרשמי של הדומיין (למשל <code>ns1.google.com</code>) שמחזיר את התשובה הסופית!</li>
</ol>

<table class="data-table">
<tr><th>סוג רשומה (Record)</th><th>תפקיד ב-DNS</th><th>דוגמה לתשובה</th></tr>
<tr><td><code>A</code></td><td>מיפוי שם דומיין לכתובת <strong>IPv4</strong> (32-bit)</td><td><code>google.com ➔ 142.250.185.46</code></td></tr>
<tr><td><code>AAAA</code></td><td>מיפוי שם דומיין לכתובת <strong>IPv6</strong> (128-bit)</td><td><code>google.com ➔ 2a00:1450:4001::200e</code></td></tr>
<tr><td><code>CNAME</code></td><td>כינוי (Alias) — הפניית דומיין אחד לשם דומיין אחר</td><td><code>www.example.com ➔ example.com</code></td></tr>
<tr><td><code>MX</code></td><td><strong>Mail Exchange</strong> — לאיזה שרת לשלוח אימיילים עבור הדומיין</td><td><code>10 smtp.google.com</code></td></tr>
<tr><td><code>TXT</code></td><td>טקסט חופשי — משמש לאימות בעלות ואבטחת מייל (<code>SPF</code>, <code>DKIM</code>, <code>DMARC</code>)</td><td><code>"v=spf1 include:_spf.google.com ~all"</code></td></tr>
<tr><td><code>NS</code></td><td><strong>Name Server</strong> — מציין מי השרת המוסמך שמנהל את הדומיין</td><td><code>ns1.cloudflare.com</code></td></tr>
</table>

<div class="section-title">Routing, TTL ו-BGP — איך חבילות מנווטות בעולם</div>
<p class="prose">כשחבילה יוצאת לאינטרנט, היא עוברת מנתב לנתב (<strong>Hop-by-Hop</strong>). בכל חבילת IP יש שדה שנקרא <strong>TTL (Time To Live)</strong> — מונה שמתחיל לרוב ב-64 או 128, וכל נתב בדרך מקטין אותו ב-1. אם ה-TTL מגיע ל-<code>0</code> (למשל בגלל לולאת ניתוב), הנתב זורק את החבילה ומחזיר לשולח הודעת שגיאה <code>ICMP Time Exceeded</code>. הפקודה <code>traceroute</code> מנצלת את המנגנון הזה בדיוק: היא שולחת חבילות עם <code>TTL=1</code>, ואז <code>TTL=2</code>, וכך מגלה את כל הנתבים בדרך!</p>
<p class="prose">בין ספקי האינטרנט הגדולים בעולם (שנקראים <strong>AS — Autonomous Systems</strong>, לכל אחד מספר מזהה כמו <code>AS15169</code> של גוגל או <code>AS8551</code> של בזק בינלאומי), פועל פרוטוקול <strong>BGP (Border Gateway Protocol)</strong>. BGP הוא ה-GPS של האינטרנט: כל AS מפרסם אילו טווחי IP נמצאים אצלו, ו-BGP מחשב את מסלול ה-AS הקצר והמועדף ביותר.</p>

<div class="did-you-know">⚡ <strong>הידעתם?</strong> פרוטוקול IP בשכבה 3 הוא "חסר מצפון" (Best-Effort): הוא משגר חבילות בלי לבדוק אם היעד קיים, אם החבילות הלכו לאיבוד בדרך או אם הן הגיעו בסדר הפוך. <strong>TCP</strong> בשכבה 4 הוא המוח שמוסיף אמינות מוחלטת מעל תשתית לא אמינה!</div>

<div class="section-title">הבעיה — למה אי אפשר לסמוך על IP לבדו?</div>
<p class="prose">כששולחים קובץ או דף אינטרנט על גבי IP, שלוש תקלות קורות כל הזמן: <strong>(1) Packet Loss</strong> — נתב עמוס זורק חבילה כי התור (Buffer) שלו התמלא; <strong>(2) Out-of-Order Delivery</strong> — חבילה מס' 2 נסעה בנתיב מהיר יותר מחבילה מס' 1 והגיעה לפניה; <strong>(3) Duplication / Corruption</strong> — סיביות השתבשו בדרך. עבור דף HTML, קובץ ZIP או העברה בנקאית, בית אחד חסר הורס הכל. כאן נכנס <strong>TCP (Transmission Control Protocol)</strong>.</p>

<div class="section-title">TCP 3-Way Handshake — הקמת חיבור ומספרי SEQ / ACK</div>
<p class="prose">לפני שבית מידע אחד של האפליקציה נשלח, TCP מקים חיבור דו-כיווני ומסנכרן את מספרי המעקב (Sequence Numbers) ב<strong>לחיצת יד משולשת (3-Way Handshake)</strong>:</p>

<div class="section-title">חמשת מנגנוני הברזל של TCP לאמינות ובקרת עומס</div>
<table class="data-table">
<tr><th>מנגנון</th><th>כיצד הוא עובד בפועל?</th></tr>
<tr><td><strong>Sequence Numbers (מספור בתים)</strong></td><td>כל Byte של מידע מקבל מספר סידורי. אם שלחנו חבילה עם <code>SEQ=1001</code> באורך <code>500 Bytes</code>, החבילה הבאה תתחיל ב-<code>SEQ=1501</code>. כך המקבל מרכיב הכל בסדר המדויק.</td></tr>
<tr><td><strong>Cumulative ACK (אישור מצטבר)</strong></td><td>המקבל שולח <code>ACK=1501</code> שמשמעותו: "קיבלתי הכל בשלום עד בית 1500, שלח לי את בית 1501".</td></tr>
<tr><td><strong>Retransmission (שידור חוזר)</strong></td><td>לא התקבל ACK תוך זמן ה-Timeout (RTO), או שהתקבלו 3 אישורים כפולים (<strong>3 Duplicate ACKs — Fast Retransmit</strong>)? השולח משדר שוב את החבילה החסרה מיד!</td></tr>
<tr><td><strong>Flow Control (בקרת זרימה — Sliding Window)</strong></td><td>המקבל מפרסם בכל כותרת TCP את גודל ה-<code>Receive Window (rwnd)</code> שלו — כמה מקום פנוי נשאר לו בזיכרון, כדי שהשולח המהיר לא יציף אותו.</td></tr>
<tr><td><strong>Congestion Control (בקרת גודש ברשת)</strong></td><td>TCP מתחיל בזהירות (<strong>Slow Start</strong> — מכפיל קצב בכל RTT), עובר לצמיחה לינארית (Congestion Avoidance), ואם מזהה אובדן חבילות ברשת — חותך מיד את קצב השליחה (אלגוריתמי CUBIC / BBR).</td></tr>
</table>

<div class="section-title">TCP מול UDP — מתי אמינות ומתי מהירות טהורה?</div>
<p class="prose">בעוד ש-TCP הוא פרוטוקול מבוסס חיבור (Connection-Oriented) עם כותרת של <code>20–60 Bytes</code> ומעקב הדוק, אחיו הקטן <strong>UDP (User Datagram Protocol)</strong> הוא פרוטוקול "שלח ושכח" (Connectionless) עם כותרת זעירה של <code>8 Bytes בלבד</code> (פורט מקור, פורט יעד, אורך ו-Checksum):</p>
<table class="data-table">
<tr><th>קריטריון / שימוש</th><th>TCP (אמין ומסודר)</th><th>UDP (מהיר וחסר השהיה)</th></tr>
<tr><td><strong>הקמת חיבור (Handshake)</strong></td><td>חובה (3-Way Handshake — לוקח 1 RTT)</td><td>אין! שולחים מידע מיד בחבילה הראשונה (0-RTT)</td></tr>
<tr><td><strong>אובדן חבילה (Packet Loss)</strong></td><td>עוצר ומבצע Retransmission (עלול ליצור Head-of-Line Blocking)</td><td>מתעלם וממשיך הלאה לפריים הבא</td></tr>
<tr><td><strong>שימושים קלאסיים</strong></td><td>גלישה (HTTP/1.1, HTTP/2), הורדת קבצים, SSH (22), אימייל (SMTP/IMAP), מסדי נתונים</td><td>שיחות וידאו/קול (Zoom, VoIP), גיימינג בזמן אמת, שאילתות DNS (53), DHCP, ו-<strong>QUIC (HTTP/3)</strong></td></tr>
</table>

<div class="section-title">Ports &amp; Sockets — מספרי הדלתות בתוך המחשב</div>
<p class="prose">כתובת IP מביאה את החבילה למחשב הנכון; <strong>מספר הפורט (Port — 16 סיביות, 0 עד 65,535)</strong> אומר למערכת ההפעלה לאיזו תוכנה (Process) למסור אותה. חיבור רשת פעיל מוגדר תמיד על ידי רביעייה ייחודית (<strong>4-Tuple Socket</strong>): <code>(Source IP, Source Port, Destination IP, Destination Port)</code>.</p>
<table class="data-table">
<tr><th>פורט (Port)</th><th>פרוטוקול ושירות</th><th>תפקיד מרכזי</th></tr>
<tr><td><code>20 / 21</code>, <code>22</code></td><td>FTP (קבצים) / <strong>SSH (22)</strong></td><td>גישה מרוחקת מוצפנת לשרתי לינוקס וניהול מערכות</td></tr>
<tr><td><code>25</code> / <code>465, 587</code></td><td>SMTP / SMTPS</td><td>העברת דואר אלקטרוני בין שרתי מייל</td></tr>
<tr><td><code>53</code></td><td>DNS (UDP &amp; TCP)</td><td>תרגום שמות דומיין לכתובות IP (UDP לשאילתות רגילות, TCP לתשובות גדולות/Zone Transfer)</td></tr>
<tr><td><code>67 / 68</code></td><td>DHCP (UDP)</td><td>חלוקת כתובות IP אוטומטית ברשת מקומית</td></tr>
<tr><td><code>80</code> / <code>443</code></td><td><strong>HTTP (80) / HTTPS (443)</strong></td><td>גלישה באינטרנט ו-REST APIs (לא מוצפן מול מוצפן ב-TLS)</td></tr>
<tr><td><code>3306</code> / <code>5432</code> / <code>3389</code></td><td>MySQL / PostgreSQL / RDP</td><td>מסדי נתונים ושולחן עבודה מרוחק (Windows RDP)</td></tr>
</table>

<div class="section-title">HTTP — האנטומיה של שפת ה-Web (Request &amp; Response)</div>
<p class="prose"><strong>HTTP (HyperText Transfer Protocol)</strong> הוא פרוטוקול בשכבה 7 (Application) המבוסס על מודל של <strong>בקשה ותגובה (Request-Response)</strong>. הדפדפן (Client) יוזם בקשה המורכבת מ-3 חלקים: <strong>(1) Request Line</strong> (שיטה, נתיב וגרסה, למשל <code>GET /api/users HTTP/2</code>), <strong>(2) Headers</strong> (כותרות מטא-דאטה כמו <code>Host</code>, <code>User-Agent</code>, <code>Accept</code>, <code>Authorization</code>), ו-<strong>(3) Body</strong> (גוף המידע, למשל JSON בבקשת <code>POST</code>).</p>

<table class="data-table">
<tr><th>Method (שיטה)</th><th>תפקיד ב-HTTP / REST API</th><th>האם מכיל Body?</th><th>Idempotent? (ביצוע חוזר בטוח)</th></tr>
<tr><td><code>GET</code></td><td>שליפת מידע מהשרת (דף HTML, תמונה, JSON) ללא שינוי מצב בשרת</td><td>לא</td><td>כן (תמיד מחזיר משאב מבלי לשנותו)</td></tr>
<tr><td><code>POST</code></td><td>יצירת משאב חדש או שליחת טופס (למשל התחברות, תשלום, פוסט חדש)</td><td>כן</td><td>לא (שליחה כפולה תיצור שתי רשומות!)</td></tr>
<tr><td><code>PUT</code></td><td>החלפה מלאה של משאב קיים בשרת בגרסה חדשה</td><td>כן</td><td>כן (החלפה חוזרת תשאיר אותה תוצאה)</td></tr>
<tr><td><code>PATCH</code></td><td>עדכון חלקי של שדות ספציפיים במשאב קיים</td><td>כן</td><td>תלוי מימוש</td></tr>
<tr><td><code>DELETE</code></td><td>מחיקת משאב ספציפי מהשרת</td><td>לרוב לא</td><td>כן (מחיקת משאב שכבר נמחק משאירה אותו מחוק)</td></tr>
<tr><td><code>HEAD</code> / <code>OPTIONS</code></td><td><code>HEAD</code> מחזיר רק כותרות ללא Body; <code>OPTIONS</code> בודק הרשאות CORS</td><td>לא</td><td>כן</td></tr>
</table>

<div class="section-title">Statelessness, Cookies ו-JWT — איך אתר זוכר שהתחברתם?</div>
<p class="prose">HTTP הוא פרוטוקול <strong>Stateless (חסר מצב/זיכרון)</strong>: ברגע שהשרת החזיר תגובה, הוא "שוכח" מי אתם. כדי שלא תצטרכו להקליד סיסמה בכל מעבר דף, משתמשים בשני מנגנונים עיקריים:</p>
<ol class="prose">
<li><strong>Session Cookies:</strong> אחרי התחברות מוצלחת (<code>POST /login</code>), השרת שומר מזהה בזיכרון ומחזיר כותרת: <code>Set-Cookie: session_id=xyz987; HttpOnly; Secure; SameSite=Strict</code>. הדגל <code>HttpOnly</code> מונע מסקריפטים זדוניים (מתקפת XSS) לגנוב את העוגייה דרך <code>document.cookie</code>, והדגל <code>Secure</code> מבטיח שהיא תישלח רק מעל HTTPS מוצפן!</li>
<li><strong>JWT (JSON Web Token):</strong> נפוץ ב-REST APIs מודרניים. השרת מנפיק אסימון חתום קריפטוגרפית (<code>Header.Payload.Signature</code>) והלקוח מצרף אותו בכל בקשה בכותרת: <code>Authorization: Bearer &lt;token&gt;</code> — ללא צורך בשמירת Session בזיכרון השרת!</li>
</ol>

<div class="section-title">HTTPS, TLS 1.3 ושרשרת אמון (CA Certificate Chain)</div>
<p class="prose">ב-HTTP רגיל (פורט 80), כל מילה וסיסמה עוברות כטקסט גלוי (Plaintext) שכל תוקף באותו WiFi או נתב בדרך יכול לקרוא. <strong>HTTPS (פורט 443)</strong> עוטף את HTTP בשכבת הצפנה <strong>TLS 1.3 (Transport Layer Security)</strong> שנותנת 3 ערבויות קריפטוגרפיות: <strong>הצפנה (Confidentiality)</strong>, <strong>שלמות מידע (Integrity — שלא שינו את התוכן בדרך)</strong>, ו<strong>אימות זהות (Authentication — שאתם באמת מדברים עם הבנק ולא עם מתחזה)</strong>.</p>

<ol class="prose">
<li><strong>Client Hello:</strong> הדפדפן שולח את גרסת TLS (1.3), רשימת אלגוריתמי הצפנה (Cipher Suites, כגון <code>TLS_AES_256_GCM_SHA384</code>), וחלק מפתח ציבורי לחילופי מפתחות (<code>ECDHE Key Share</code>).</li>
<li><strong>Server Hello + Certificate:</strong> השרת בוחר אלגוריתם, שולח את חלק המפתח שלו, ומציג את <strong>התעודה הדיגיטלית (SSL/TLS Certificate)</strong> שלו — החתומה דיגיטלית על ידי רשות אישורים מוכרת (<strong>CA — Certificate Authority</strong> כמו DigiCert או Let's Encrypt).</li>
<li><strong>אימות וחישוב מפתח משותף (1-RTT):</strong> הדפדפן מוודא שהחתימה של ה-CA תקפה (מול רשימת ה-Root CAs המובנית במערכת ההפעלה). שני הצדדים מחשבים מתמטית (בעזרת <strong>Ephemeral Diffie-Hellman</strong>) מפתח סימטרי זהה — מבלי שהמפתח עצמו עבר אי פעם ברשת!</li>
<li><strong>Perfect Forward Secrecy (PFS):</strong> מכיוון שבכל חיבור מוגרלים מפתחות זמניים חדשים שנמחקים בסיום השיחה, גם אם האקר יקליט את כל התעבורה המוצפנת היום ויגנוב את המפתח הפרטי של השרת בעוד שנה — הוא לעולם לא יוכל לפענח שיחות מוקלטות מהעבר!</li>
</ol>

<div class="section-title">האבולוציה: HTTP/1.1 ➔ HTTP/2 ➔ HTTP/3 (QUIC)</div>
<table class="data-table">
<tr><th>גרסה</th><th>שכבת תעבורה</th><th>איך עובדת ומה פתרה?</th></tr>
<tr><td><strong>HTTP/1.1</strong> (1997)</td><td>TCP</td><td>טקסטואלי. הציג <code>Keep-Alive</code>, אך סובל מ-<strong>Head-of-Line Blocking</strong>: בקשה אחת איטית בצינור מעכבת את כל הבקשות שאחריה (הדפדפן נאלץ לפתוח עד 6 חיבורי TCP במקביל).</td></tr>
<tr><td><strong>HTTP/2</strong> (2015)</td><td>TCP</td><td>בינארי. הציג <strong>Multiplexing</strong> (עשרות בקשות במקביל על חיבור TCP יחיד ב-Streams) ודחיסת כותרות (<code>HPACK</code>). אך אם חבילת TCP אחת אובדת — כל ה-Streams עוצרים יחד!</td></tr>
<tr><td><strong>HTTP/3</strong> (2022)</td><td><strong>QUIC (מעל UDP)</strong></td><td>רץ מעל <strong>QUIC</strong> (של גוגל): משלב לחיצת יד של תובלה + TLS 1.3 ב-<strong>1-RTT (או 0-RTT!)</strong>, מבטל את ה-Head-of-Line Blocking בין Streams, ושורד מעבר בין WiFi ל-5G בזכות <code>Connection ID</code>!</td></tr>
</table>

<div class="did-you-know">📡 <strong>הידעתם?</strong> תנור המיקרוגל במטבח שלכם פועל בדיוק בתדר <code>2.45 GHz</code> — כי זהו תדר התהודה של מולקולות מים! לכן תדר ה-WiFi הישן (<code>2.4 GHz</code>) הוא חופשי מרישוי בעולם, וגם זו הסיבה שהפעלת מיקרוגל ישן עלולה לגרום להפרעות וקפיצות פינג ב-WiFi בתדר 2.4GHz.</div>

<div class="section-title">השכבה הפיזית (Layer 1) — נחושת, סיבים אופטיים וגלי רדיו</div>
<p class="prose">בסופו של דבר, כל חבילת IP וכל דף HTML חייבים להפוך לאותות פיזיים של <code>0</code> ו-<code>1</code>. לכל תווך פיזי יש מאפייני מהירות, מרחק וחסינות להפרעות אלקטרומגנטיות (EMI):</p>

<table class="data-table">
<tr><th>תווך פיזי (Medium)</th><th>ייצוג 0 ו-1</th><th>קצב העברה מקסימלי</th><th>טווח ללא מגבר</th><th>יתרון ושימוש מרכזי</th></tr>
<tr><td><strong>כבל נחושת שזור (Cat5e / Cat6 / Cat6a)</strong></td><td>הפרשי מתח חשמלי ב-4 זוגות חוטים שזורים (Twisted Pair לביטול רעשים)</td><td><code>1 Gbps</code> (Cat5e) עד <code>10 Gbps</code> (Cat6a)</td><td>עד <code>100 מטר</code></td><td>זול, אמין, מספק גם חשמל למצלמות ונקודות גישה (<strong>PoE — Power over Ethernet</strong>)</td></tr>
<tr><td><strong>סיב אופטי Multi-Mode (MMF)</strong></td><td>פולסי אור מדיודת LED בצינור זכוכית רחב יחסית</td><td><code>10–100 Gbps</code></td><td>עד <code>500 מטר – 2 ק"מ</code></td><td>חיבור בין ארונות תקשורת ושרתים בתוך קמפוס או חוות שרתים (Data Center)</td></tr>
<tr><td><strong>סיב אופטי Single-Mode (SMF)</strong></td><td>קרן לייזר ממוקדת בליבת זכוכית דקיקה (9 מיקרון)</td><td><code>100+ Tbps</code> (בריבוב אור DWDM)</td><td><code>40–100+ ק"מ</code> (ועד אלפי ק"מ בים)</td><td>אפס הפרעות חשמליות, תשתית הסיבים עד הבית (FTTH) וכבלים תת-ימיים</td></tr>
<tr><td><strong>אלחוטי — WiFi 6 / 6E / 7 (802.11ax/be)</strong></td><td>אפנון גלי רדיו מתקדם (OFDMA &amp; QAM)</td><td>עד <code>9.6 Gbps</code> (WiFi 6) / <code>46 Gbps</code> (WiFi 7)</td><td><code>30–70 מטר</code> במבנה</td><td>ניידות מלאה ללא כבלים עבור טלפונים, לפטופים ו-IoT</td></tr>
</table>

<div class="section-title">תדרי WiFi: 2.4 GHz מול 5 GHz מול 6 GHz</div>
<p class="prose">בחוקי הפיזיקה קיים כלל ברזל: <strong>ככל שהתדר נמוך יותר (אורך גל ארוך) — הוא חודר קירות ומגיע רחוק יותר, אך נושא פחות מידע בשנייה</strong>. ככל שהתדר גבוה יותר — המהירות מזנקת, אך קירות בטון בולעים אותו:</p>

<table class="data-table">
<tr><th>מאפיין</th><th>2.4 GHz (ותיק)</th><th>5 GHz (הסוס העובד)</th><th>6 GHz (WiFi 6E / WiFi 7)</th></tr>
<tr><td><strong>חדירת קירות וטווח</strong></td><td>מצוין — עובר קירות וממ"דים</td><td>בינוני — נחלש אחרי 1-2 קירות</td><td>קצר — מיועד לאותו חדר / קו ראייה</td></tr>
<tr><td><strong>ערוצים לא-חופפים (Non-overlapping)</strong></td><td><strong>רק 3 ערוצים!</strong> (ערוצים 1, 6, 11)</td><td>25 ערוצים רחבים</td><td>59 ערוצים (אוטוסטרדה פנויה!)</td></tr>
<tr><td><strong>עומס והפרעות</strong></td><td>פקוק מאוד (שכנים, Bluetooth, מיקרוגל)</td><td>נקי ומהיר משמעותית</td><td>כמעט אפס הפרעות, השהיה מינימלית</td></tr>
</table>

<div class="section-title">CSMA/CA ובעיית הצומת הנסתר (Hidden Node Problem)</div>
<p class="prose">בכבל Ethernet מודרני המחובר ל-Switch יש חוטים נפרדים לשליחה ולקבלה (<strong>Full-Duplex</strong>) — אין התנגשויות! לעומת זאת, באוויר (WiFi) התדר משותף לכולם (<strong>Half-Duplex Shared Medium</strong>): אם שני מכשירים ישדרו באותו תדר בו-זמנית, גלי הרדיו יתנגשו ויהרסו זה את זה. לכן WiFi משתמש בפרוטוקול <strong>CSMA/CA (Carrier Sense Multiple Access with Collision Avoidance)</strong>:</p>
<ol class="prose">
<li><strong>Listen Before Talk (האזנה):</strong> כרטיס הרשת מאזין לתדר. אם מישהו משדר — הוא ממתין.</li>
<li><strong>Random Backoff (המתנה אקראית):</strong> גם כשהאוויר מתפנה, המכשיר ממתין מספר אקראי של מיקרו-שניות לפני שידור כדי ששני מכשירים שחיכו יחד לא יתנגשו מיד.</li>
<li><strong>Link-Layer ACK:</strong> בניגוד לכבל נחושת, באוויר כל Frame חייב לקבל אישור קבלה מיידי מהנתב!</li>
<li><strong>Hidden Node Problem (RTS/CTS):</strong> מה קורה אם מכשיר A בסלון ומכשיר B במרפסת קולטים שניהם את הנתב שבאמצע, אך רחוקים מכדי לשמוע זה את זה? שניהם יחשבו שהאוויר פנוי וישדרו יחד! הפתרון: הודעות <code>RTS (Request to Send)</code> ו-<code>CTS (Clear to Send)</code> שבהן הנתב משתיק את כל השאר לשבריר שנייה.</li>
</ol>

<div class="section-title">Bandwidth מול Latency מול Jitter מול Packet Loss</div>
<table class="data-table">
<tr><th>מדד ביצועים</th><th>משמעות הנדסית (אנלוגיית הכביש)</th><th>יחידות</th><th>מתי הוא צוואר הבקבוק הקריטי?</th></tr>
<tr><td><strong>Bandwidth (רוחב פס)</strong></td><td>כמה נתיבים יש בכביש (הקיבולת המקסימלית התאורטית)</td><td><code>Mbps / Gbps</code></td><td>הורדת משחק של 100GB, הזרמת וידאו 4K ב-Netflix</td></tr>
<tr><td><strong>Throughput (תפוקה בפועל)</strong></td><td>כמה מכוניות באמת עברו בכביש בשנייה (אחרי פקקים ותקורות)</td><td><code>Mbps</code></td><td>מהירות ההורדה האמיתית שאתם רואים בדפדפן</td></tr>
<tr><td><strong>Latency / Ping (השהיה / RTT)</strong></td><td>כמה מילישניות לוקח למכונית אחת לנסוע הלוך-חזור (מהירות האור בסיב היא ~200,000 ק"מ/שנייה)</td><td><code>ms (מילישניות)</code></td><td>משחקי רשת תחרותיים (דורש <code>&lt;30ms</code>), מסחר יומי, שיחות וידאו</td></tr>
<tr><td><strong>Jitter (ריצוד)</strong></td><td>חוסר יציבות ב-Latency (למשל: חבילה אחת ב-10ms והבאה ב-140ms)</td><td><code>ms</code></td><td>שיחות קול וזום (גורם לקול רובוטי מקוטע ולפריימים קפואים)</td></tr>
</table>

<div class="section-title">אבטחת WiFi: מ-WEP השבור ועד WPA3</div>
<p class="prose">שם הרשת (<strong>SSID</strong>) הוא רק תווית זיהוי גלויה באוויר. כדי להצפין את גלי הרדיו בין המכשיר לנתב, התפתחו ארבעה דורות: <strong>WEP (1997)</strong> — שבור לחלוטין (ניתן לפריצה ב-2 דקות); <strong>WPA (2003)</strong> — מיושן; <strong>WPA2-AES (2004)</strong> — הסטנדרט הנפוץ כיום (מבוסס 4-Way Handshake עם הצפנת AES-CCMP, אך חשוף למתקפת מילון Offline אם הסיסמה חלשה); ו-<strong>WPA3 (2018)</strong> — הדור המודרני שמשתמש בפרוטוקול <strong>SAE (Simultaneous Authentication of Equals / Dragonfly)</strong> שמגן מפני ניחוש סיסמאות Offline ומספק Forward Secrecy גם ברשתות פתוחות (OWE)!</p>

<div class="section-title">הנתב הביתי המשולב — 6 מכשירים בקופסה אחת</div>
<table class="data-table">
<tr><th>רכיב לוגי בקופסה</th><th>תפקיד מדויק</th><th>שכבת OSI</th></tr>
<tr><td><strong>Modem / ONT</strong></td><td>ממיר את האות הפיזי של הספק (אור בסיב אופטי / נחושת) לאות דיגיטלי של Ethernet</td><td>שכבה 1 (Physical)</td></tr>
<tr><td><strong>Switch (מתג 4 כניסות LAN)</strong></td><td>מעביר מסגרות (Frames) בין המחשבים שמחוברים בכבל בבית לפי כתובת <code>MAC</code></td><td>שכבה 2 (Data Link)</td></tr>
<tr><td><strong>WAP (Wireless Access Point)</strong></td><td>מגשר בין הרשת הקווית לגלי רדיו ב-WiFi (<code>802.11</code>)</td><td>שכבות 1–2</td></tr>
<tr><td><strong>Router (נתב) + NAT</strong></td><td>מחבר בין תת-הרשת הביתית (<code>192.168.1.0/24</code>) לבין האינטרנט העולמי (WAN)</td><td>שכבה 3 (Network)</td></tr>
<tr><td><strong>Stateful Firewall</strong></td><td>מגן על הרשת הביתית מפני חיבורים זרים מבחוץ</td><td>שכבות 3–4</td></tr>
<tr><td><strong>DHCP &amp; DNS Forwarder</strong></td><td>מחלק כתובות IP אוטומטית למכשירים בבית ומעביר שאילתות DNS</td><td>שכבה 7 (Application)</td></tr>
</table>

<div class="section-title">Hub (L1) מול Switch (L2) מול Router (L3)</div>
<p class="prose">אחת השאלות הנפוצות ביותר בראיונות עבודה ברשתות וסייבר היא ההבחנה בין שלושת מכשירי התקשורת וכיצד מתג (Switch) לומד לבד היכן נמצא כל מחשב:</p>
<ol class="prose">
<li><strong>למידת כתובות (MAC Learning):</strong> כשמחשב A שולח Frame מפורט 1 במתג אל מחשב B, ה-Switch מסתכל על <strong>כתובת ה-Source MAC</strong> ורושם בטבלת ה-CAM שלו: <code>Port 1 = MAC_A</code>.</li>
<li><strong>העברה חכמה (Unicast Forwarding vs Flooding):</strong> אם כתובת היעד (<code>Dest MAC</code>) כבר מופיעה בטבלה (למשל בפורט 3), ה-Switch ישלח את ה-Frame <strong>אך ורק לפורט 3</strong>! אם היעד עדיין לא מוכר (Unknown Unicast) או שהוא Broadcast (<code>FF:FF:FF:FF:FF:FF</code>) — ה-Switch ישכפל אותו לכל הפורטים (Flooding) חוץ מהפורט שממנו הגיע.</li>
</ol>

<table class="data-table">
<tr><th>מאפיין</th><th>Hub (מרכזת — היסטורי)</th><th>Switch (מתג — רשת מקומית)</th><th>Router (נתב — בין רשתות)</th></tr>
<tr><td><strong>שכבת פעולה וכתובת</strong></td><td>שכבה 1 (Bits) — עיוור לכתובות</td><td>שכבה 2 (Frames) — בודק <strong>MAC Address</strong></td><td>שכבה 3 (Packets) — בודק <strong>IP Address</strong></td></tr>
<tr><td><strong>Collision Domain (תחום התנגשות)</strong></td><td>משותף לכולם! שני מחשבים משדרים יחד = התנגשות</td><td><strong>כל פורט הוא תחום נפרד</strong> (Full-Duplex ללא התנגשויות)</td><td>כל ממשק נפרד</td></tr>
<tr><td><strong>Broadcast Domain (תחום שידור)</strong></td><td>משותף לכולם</td><td>משותף לכולם (אלא אם הגדרנו <strong>VLANs</strong>)</td><td><strong>עוצר ומפריד Broadcast Domains!</strong></td></tr>
</table>

<div class="section-title">Firewall (חומת אש) ו-VPN — אבטחת גבולות הרשת</div>
<table class="data-table">
<tr><th>סוג מערכת אבטחה</th><th>שכבות</th><th>כיצד פועלת ומה היא עוצרת?</th></tr>
<tr><td><strong>Stateless Firewall (ACL)</strong></td><td>3–4</td><td>בודקת כל חבילה בנפרד לפי חוקים סטטיים (IP מקור/יעד, פורט). לא זוכרת אם חבילה נכנסת היא תשובה לבקשה שיצאה מבפנים!</td></tr>
<tr><td><strong>Stateful Firewall</strong></td><td>3–4</td><td>שומרת <strong>State Table (טבלת חיבורים פעילים)</strong>: מתירה אוטומטית לחבילות חוזרות של חיבור שנוצר מבפנים, וחוסמת כל ניסיון חיבור לא קשור מבחוץ.</td></tr>
<tr><td><strong>NGFW (Next-Gen Firewall)</strong></td><td>3–7</td><td>מבצעת <strong>DPI (Deep Packet Inspection)</strong>, זיהוי אפליקציות, סינון כתובות URL ומניעת חדירות (IPS).</td></tr>
<tr><td><strong>WAF (Web Application Firewall)</strong></td><td>7</td><td>יושבת לפני שרתי Web ומגינה מפני מתקפות אפליקטיביות כמו <code>SQL Injection</code>, <code>XSS</code> ו-<code>DDoS</code> בשכבה 7.</td></tr>
<tr><td><strong>VPN (WireGuard / IPsec / OpenVPN)</strong></td><td>3–4</td><td>יוצר <strong>מנהרה מוצפנת (Encrypted Tunnel)</strong> על גבי האינטרנט הציבורי: עוטף את כל חבילות ה-IP הפנימיות בחבילה מוצפנת חדשה, כך שספק האינטרנט או תוקף ב-WiFi הציבורי לא רואים לאן אתם גולשים!</td></tr>
</table>

<div class="section-title">צבעים ב-Wireshark, Follow TCP Stream וזיהוי אנומליות סייבר</div>
<table class="data-table">
<tr><th>כלי / תופעה ב-Wireshark</th><th>איך זה נראה ומה זה אומר?</th></tr>
<tr><td><strong>קידוד צבעים (Coloring Rules)</strong></td><td>🟢 ירוק בהיר = תעבורת TCP/HTTP תקינה · 🔵 כחול בהיר = תעבורת UDP/DNS · ⚫ <strong>שחור עם טקסט אדום</strong> = חבילות פגומות, <code>Retransmissions</code> או <code>Duplicate ACKs</code> · 🔴 אדום/צהוב = <code>TCP RST</code> או אזהרות <code>ARP</code>.</td></tr>

<div class="section-title">CDN, Anycast ו-Load Balancers — איך ענקיות האינטרנט משרתות מיליארדים?</div>
<p class="prose">איך ייתכן שחיפוש בגוגל או צפייה ב-Netflix לוקחים מילישניות בודדות למרות שמשרדי החברות בקליפורניה? הסוד בנוי משלוש טכנולוגיות תשתית:</p>
<ol class="prose">
<li><strong>CDN (Content Delivery Network — רשת הפצת תוכן):</strong> חברות כמו Cloudflare, Akamai, Fastly וגוגל מחזיקות אלפי שרתי קצה (<strong>Edge Servers / PoPs</strong>) בתוך ספקי האינטרנט בכל מדינה (כולל בישראל, ב-IL-IX). תמונות, סרטונים, קבצי JS/CSS ואפילו תגובות API נשמרים במטמון במרחק של <code>2–8ms</code> מכם!</li>
<li><strong>Anycast Routing:</strong> קסם של פרוטוקול BGP שבו מאות שרתים ברחבי העולם מפרסמים <strong>בדיוק את אותה כתובת IP</strong> (למשל <code>1.1.1.1</code> או <code>8.8.8.8</code>). נתבי האינטרנט מנתבים את החבילה שלכם אוטומטית לשרת הפיזי הקרוב ביותר גאוגרפית ורשתית!</li>
<li><strong>Load Balancer (מאזן עומסים — L4 / L7):</strong> עומד בכניסה לחוות השרתים, מקבל מיליוני בקשות בשנייה, בודק אילו שרתים פנימיים בריאים (<strong>Health Checks</strong>), ומחלק את העומס ביניהם (בשיטות כמו <code>Round Robin</code> או <code>Least Connections</code>).</li>
</ol>

`<div class="sc"><div class="sc-head">🌐 האינטרנט — כיצד עובד</div>
<div class="sc-card"><div class="sc-label">הבסיס</div><div class="sc-text">האינטרנט הוא תשתית פיזית — כבלים תת-ימיים, נתבים, חיבורים. רשת האינטרנט העולמית (WWW) היא <strong>שירות אחד</strong> שרץ עליה. מייל, זום, וואטסאפ — שירותים נוספים על אותה תשתית.</div></div>

<div class="sc-card"><div class="sc-label">שיטות HTTP</div><div class="sc-text">GET = בקש מידע. POST = שלח מידע. PUT/PATCH = עדכן. DELETE = מחק. קודי תגובה: 200 = הצליח, 404 = לא נמצא, 500 = שרת קרס.</div></div>

<div class="sc-card"><div class="sc-label">תדרי WiFi</div><div class="sc-text">2.4 גיגהרץ = טווח ארוך, חודר קירות, עמוס מאוד. 5 גיגהרץ = מהיר, טווח בינוני. 6 גיגהרץ = הכי מהיר, טווח קצר. חדר רחוק = 2.4. ליד הנתב = 5 או 6.</div></div>

<div class="did-you-know">🌊 <strong>Did You Know?</strong> Over 99% of intercontinental internet traffic (including WhatsApp messages, YouTube videos, and Zoom calls) doesn't travel via satellites in space — it travels through ~550 submarine fiber-optic cables laid across the ocean floor, spanning over 1.4 million kilometers!</div>

<div class="section-title">The Internet — Not a Cloud, Not Wireless. Physical Cables.</div>
<p class="prose">When people say "I uploaded to the cloud", most imagine data floating in the air. The reality: <strong>the internet is a massive physical engineering infrastructure</strong>: submarine cables as thick as a human arm (armored with steel, copper, and polyethylene against sharks and anchors), massive Data Centers, and core routers firing laser pulses. WiFi or cellular (5G) is only the "Last Mile" — the final hop from your home router or cell tower to your device.</p>

<div class="callout idea">💡 <strong>Internet vs. WWW:</strong> The Internet = the physical roads and infrastructure (cables, routers, protocols). The World Wide Web (WWW — websites) = just one service driving on those roads. Email (SMTP), Zoom, WhatsApp, and online gaming are other services sharing the same infrastructure.</div>

<div class="section-title">Packet Switching — The Invention Everything Is Built On</div>
<p class="prose">Before 1969, a phone call used <strong>Circuit Switching</strong>, reserving a dedicated physical wire for the entire call. In 1969 (ARPANET), <strong>Packet Switching</strong> revolutionized networking:</p>
<p class="prose">Every file or message is chopped into small <strong>Packets</strong> (typically up to <code>1,500 Bytes</code> — the Ethernet <strong>MTU</strong>). Each packet gets a header containing the Source IP, Destination IP, and Sequence Number. Each router along the way forwards each packet independently in real time. Congested router? Packets route around it. Cut cable? BGP finds an alternative path. At the destination, TCP reassembles them in exact order.</p>

<table class="data-table">
<tr><th>Feature</th><th>Circuit Switching (Old Telecom)</th><th>Packet Switching (Modern Internet)</th></tr>
<tr><td><strong>Path</strong></td><td>Fixed, dedicated physical line for the entire call</td><td>Dynamic — each packet independently routes in real time</td></tr>
<tr><td><strong>Fault Tolerance</strong></td><td>Cut wire = call drops immediately</td><td>Automatic rerouting around failed links in milliseconds</td></tr>
<tr><td><strong>Bandwidth Efficiency</strong></td><td>Line sits 100% idle during silence</td><td>Statistical multiplexing — thousands share the same fiber</td></tr>
</table>

<div class="section-title">IP Address — Every Device's Home Address on the Network</div>
<p class="prose">Every device connected to the internet gets an <strong>IP address</strong>. Without it, you can't send data and receive a reply. Like a home address: mail doesn't arrive without a precise address.</p>

<table class="data-table">
<tr><th>Type</th><th>Example</th><th>What it is</th><th>Where it comes from</th></tr>
<tr><td>Private IPv4</td><td>192.168.1.5</td><td>Inside home network only</td><td>Router (DHCP)</td></tr>
<tr><td>Public IPv4</td><td>85.250.12.44</td><td>What the world sees</td><td>ISP</td></tr>
<tr><td>IPv6</td><td>2001:db8::1</td><td>128 bits — 340 undecillion addresses</td><td>ISP / network</td></tr>
<tr><td>Loopback</td><td>127.0.0.1</td><td>Computer talking to itself</td><td>Built into OS</td></tr>
</table>

<div class="callout warn">⚠️ <strong>IPv4 ran out in 2011.</strong> Only 4.2 billion addresses — fewer than the number of devices. Solution: <strong>NAT</strong> — your router gets one public IP and hides all your devices behind it. From outside: looks like one computer. From inside: dozens of devices.</div>

<div class="section-title">DNS — The Internet's Phone Book (Working in 20ms)</div>
<p class="prose">Computers work with numbers (142.250.185.46). Humans remember names (google.com). DNS translates. When you type google.com, up to 8 queries happen — but with cache it usually finishes in 1:</p>
<ol class="prose">
<li><strong>Local cache</strong> — Computer remembers? Done (0ms)</li>
<li><strong>Router cache</strong> — Router remembers? Done (1ms)</li>
<li><strong>ISP cache</strong> — ISP's DNS server (5ms)</li>
<li><strong>Root Name Servers (<code>.</code>)</strong> — 13 clusters worldwide, know where every TLD is</li>
<li><strong>.com Name Server</strong> — knows where every .com domain is</li>
<li><strong>google.com Name Server</strong> — returns the final IP</li>
</ol>

<div class="section-title">Routing — How Packets Find Their Way</div>
<p class="prose">When a packet leaves, every <strong>router</strong> checks the destination address and decides where to forward it next. This decision happens in nanoseconds based on a <strong>Routing Table</strong> that updates automatically via protocols like BGP.</p>

<div style="margin-top:10px;padding:9px 12px;direction:ltr;text-align:left;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;font-size:12px;font-family:var(--sans);color:#78350f;line-height:1.6">7 hops = 7 routers traversed. Each hop adds latency. Hop 4 = Internet Exchange Point (IXP) where traffic crosses from your ISP into Google's network.</div></div></div>

<div class="section-title">BGP — The Protocol Holding the Internet Together</div>
<p class="prose"><strong>BGP</strong> (Border Gateway Protocol) is the protocol between ISPs — each ISP announces which IP ranges it holds, and BGP distributes this knowledge globally. A BGP misconfiguration in 2021 took Facebook, Instagram and WhatsApp offline for 6 hours.</p>

<div class="section-title">The Problem — IP Is Completely Unreliable</div>
<p class="prose">IP is <strong>best-effort</strong> — "I'll do my best". No guarantee a packet arrives. Packets can: get lost (overwhelmed router drops them), arrive out of order (each took a different path), arrive duplicated (rare router bug). For browsing, email, files — this is impossible to work with. Enter TCP.</p>

<p class="prose">Before the first byte passes, TCP performs a <strong>3-Way Handshake</strong>. Note the sequence numbers — they're the secret to reliability:</p>

      <strong>Step 1 — <code>SYN (Synchronize)</code>:</strong> Client (<code>192.168.1.5:54321</code>) sends a segment to Server (<code>142.250.185.46:443</code>) with flag <code>SYN=1</code> and an Initial Sequence Number <code>SEQ = 1000</code>. Client state becomes <code>SYN_SENT</code>.

<div class="section-title">How TCP Guarantees Reliability</div>
<table class="data-table">
<tr><th>Mechanism</th><th>How it works</th></tr>
<tr><td><strong>Sequence Numbers</strong></td><td>Every byte gets a number. Receiver knows exactly what arrived and what's missing</td></tr>
<tr><td><strong>ACK</strong></td><td>Receiver acknowledges each group of bytes. Without ACK — sender retransmits</td></tr>
<tr><td><strong>Retransmission</strong></td><td>Without ACK within timeout — packet sent again automatically</td></tr>
<tr><td><strong>Flow Control</strong></td><td>Window size — receiver tells sender how many bytes it can handle</td></tr>
<tr><td><strong>Congestion Control</strong></td><td>TCP detects network congestion and slows down automatically</td></tr>
</table>

<div class="section-title">TCP vs. UDP — When to Use Each</div>
<table class="data-table">
<tr><th>Use case</th><th>Protocol</th><th>Why</th></tr>
<tr><td>Web browsing (HTTP/HTTPS)</td><td>TCP</td><td>HTML must arrive complete and in order</td></tr>
<tr><td>File downloads</td><td>TCP</td><td>One missing byte = corrupted file</td></tr>
<tr><td>Email (SMTP/IMAP)</td><td>TCP</td><td>Email must arrive complete</td></tr>
<tr><td>Gaming, Zoom</td><td>UDP</td><td>Old frame (50ms) = trash. Better to drop and get next</td></tr>
<tr><td>DNS</td><td>UDP</td><td>Short question + short answer. TCP handshake = unnecessary overhead</td></tr>
<tr><td>Streaming (Netflix)</td><td>TCP+QUIC</td><td>TCP for control, QUIC for video stream</td></tr>
</table>

<div class="section-title">HTTP — The Browser's Language</div>
<p class="prose">HTTP (HyperText Transfer Protocol) is a request-response protocol: browser sends <strong>request</strong>, server returns <strong>response</strong>. Every click, every page load, every form submission — one of these. HTTP operates at Application layer (layer 7) and runs on top of TCP.</p>

<tr><td>DELETE</td><td>Delete</td><td>Delete a post</td><td>Usually not</td></tr>
<tr><td>HEAD</td><td>Like GET, headers only</td><td>Check file size before download</td><td>No</td></tr>
