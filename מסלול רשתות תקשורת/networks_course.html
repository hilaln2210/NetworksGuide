<div class="section-title">HTTPS — Why the Lock Matters</div>
<p class="prose">After TCP, HTTPS adds <strong>TLS</strong>. In TLS 1.3 (current version) this happens in <strong>one round trip only</strong>:</p>
<ol class="prose">
<li><strong>Step 1 — Client Hello</strong> — "I support TLS 1.3, these are the cipher suites I support"</li>
<li><strong>Step 2 — Server Hello + Certificate</strong> — "Choosing AES-256-GCM, here's my identity certificate (signed by DigiCert/Let's Encrypt)"</li>
<li><strong>Step 3 — Key Exchange (ECDHE)</strong> — Both sides compute a shared key without the key itself ever traveling the network</li>
<li><strong>Step 4 — Finished</strong> — From now on everything is encrypted with a key nobody else has</li>
</ol>
<p class="prose"><strong>Perfect Forward Secrecy (PFS)</strong> — a fresh ephemeral key is generated for every session. Even if someone records today's traffic and steals the server's private key in the future, they cannot decrypt past sessions.</p>

<div class="section-title">WiFi — Shared Medium and CSMA/CA</div>
<p class="prose">WiFi is a <strong>Shared Medium</strong> — everyone uses the frequency together. Like a meeting room with one microphone. To prevent collisions, WiFi uses <strong>CSMA/CA</strong>:</p>
<ol class="prose">
<li><strong>Carrier Sense (Listen Before Talk)</strong> — Listens to the air: is anyone transmitting?</li>
<li><strong>Random Backoff</strong> — Waits a random number of microseconds so devices don't collide</li>
<li><strong>Collision Avoidance &amp; Link ACK</strong> — Every wireless frame must be explicitly acknowledged; RTS/CTS solves the Hidden Node Problem</li>
</ol>

<table class="data-table">

<tr><td>Range</td><td>Long — penetrates walls</td><td>Medium</td><td>Short — needs line of sight</td></tr>

<tr><td>When to use</td><td>Far room, IoT</td><td>Near router, streaming</td><td>New router, low latency</td></tr>

<tr><td><strong>Bandwidth</strong></td><td>Data per second — "road width"</td><td>Mbps, Gbps</td><td>Netflix 4K (25 Mbps), downloads</td></tr>
<tr><td><strong>Latency (RTT)</strong></td><td>Round trip time of one packet — "road length"</td><td>ms</td><td>Gaming (&lt;20ms), Zoom, API calls</td></tr>
<tr><td><strong>Jitter</strong></td><td>Variability in latency between packets</td><td>ms</td><td>Zoom, voice calls</td></tr>
<tr><td><strong>Packet Loss</strong></td><td>Percentage of packets that don't arrive</td><td>%</td><td>Everything — 1% loss = TCP slows dramatically</td></tr>
</table>

<div class="section-title">One Second — Ten Steps Happening Behind the Scenes</div>
<p class="prose">You type <code>google.com</code> and press Enter. The browser looks calm. What's really happening:</p>

<div class="td"><div class="td-bar"><div class="td-dots"><span class="td-dot td-r"></span><span class="td-dot td-y"></span><span class="td-dot td-g"></span></div><div class="td-url">🚀&nbsp;https://www.google.com — End-to-End Network Timeline</div></div><div class="td-title">🌐 The Full Journey — All 10 Steps in 150ms</div><div class="td-body"><div style="direction:ltr;font-family:var(--sans)">
<div class="td-row"><span class="td-k">1. URL &amp; HSTS (0–2ms)</span><span class="td-v">Browser parses scheme (<code>https</code>), host (<code>www.google.com</code>) &amp; path (<code>/</code>). Checks <code>HSTS</code> preload list enforcing HTTPS on port 443.</span></div>
<div class="td-row"><span class="td-k">2. DNS Lookup (2–20ms)</span><span class="td-v">Browser Cache ➔ OS Cache &amp; <code>hosts</code> file ➔ ISP Recursive Resolver (UDP 53) ➔ Root NS (<code>.</code>) ➔ TLD (<code>.com</code>) ➔ Google Authoritative NS returns <code>142.250.185.46</code>.</span></div>
<div class="td-row"><span class="td-k">3. ARP Request (20–22ms)</span><span class="td-v">OS sees <code>142.250.185.46</code> is outside <code>192.168.1.0/24</code>. Broadcasts ARP "Who has 192.168.1.1?" ➔ receives Default Gateway MAC <code>aa:bb:cc:11:22:33</code>.</span></div>
<div class="td-row"><span class="td-k">4. NAT &amp; BGP (22–34ms)</span><span class="td-v">Home router translates private IP via <code>NAT/PAT</code> and forwards packet across ISP &amp; IXP routers via <code>BGP</code> to Google's nearest Edge node.</span></div>
<div class="td-row"><span class="td-k">5. TCP Handshake (34–46ms)</span><span class="td-v">3-Way Handshake on port 443: <code>SYN</code> ➔ <code>SYN-ACK</code> ➔ <code>ACK</code>. Socket enters <code>ESTABLISHED</code> state.</span></div>
<div class="td-row"><span class="td-k">6. TLS 1.3 (46–60ms)</span><span class="td-v">Single round-trip (1-RTT): <code>Client/Server Hello</code>, CA certificate verification, and ECDHE shared key derivation (<code>AES-256-GCM</code>).</span></div>
<div class="td-row"><span class="td-k">7. HTTP/2 GET (60–65ms)</span><span class="td-v">Sends encrypted <code>HEADERS: GET /</code> frame with <code>Host</code>, <code>User-Agent</code>, <code>Accept-Encoding: br, gzip</code>, and cookies.</span></div>
<div class="td-row"><span class="td-k">8. Load Balancer (65–95ms)</span><span class="td-v">Google Anycast Load Balancer forwards request to a healthy backend server, returning status <code>200 OK</code> with compressed HTML (~50KB).</span></div>
<div class="td-row"><span class="td-k">9. Sub-resources (95–125ms)</span><span class="td-v">Browser multiplexes 80+ parallel streams for CSS, JS, fonts, and images from <code>CDN</code> edge servers over the same connection.</span></div>
<div class="td-row"><span class="td-k">10. Rendering (125–150ms)</span><span class="td-v">Builds <code>DOM</code> &amp; <code>CSSOM</code> trees ➔ Layout calculation ➔ Paint &amp; Composite — google.com is live on screen! 🎉</span></div>
<div style="margin-top:10px;padding:9px 12px;direction:ltr;text-align:left;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;font-size:12px;font-family:var(--sans);color:#78350f;line-height:1.6">Every step is a distinct protocol at a distinct layer. Wireshark captures the packets; browser DevTools visualizes the timeline.</div></div></div>

<div class="section-title">DNS in Detail — What Happens in Step 1</div>
<p class="prose">DNS looks simple — but behind one query is a complete hierarchy:</p>
<ol class="prose">
<li><strong>Computer cache</strong> — OS stores DNS results. <code>ipconfig /flushdns</code> (Windows) clears it</li>
<li><strong>Router cache</strong> — Home router also caches recent lookups</li>
<li><strong>ISP Recursive Resolver</strong> — Server that performs the iterative lookup on your behalf</li>
<li><strong>Root Name Servers (<code>.</code>)</strong> — 13 logical root clusters worldwide. Replies: "Ask the .com TLD server"</li>
<li><strong>.com TLD Server</strong> — Replies: "google.com is managed by ns1.google.com"</li>
<li><strong>Google Authoritative NS</strong> — Returns the final IP address with its TTL</li>
</ol>

<div class="section-title">CDN — Why Netflix and YouTube Are Fast</div>
<p class="prose">Netflix's headquarters are in California. How does 4K video arrive in 50ms? <strong>CDN (Content Delivery Network)</strong> — cache servers distributed worldwide:</p>
<ol class="prose">
<li>Netflix uploads video to central origin server</li>
<li>CDN distributes copies to Edge servers (PoPs) in every major city worldwide</li>
<li>When you request video — Anycast / DNS returns the IP of the <strong>nearest server to you</strong></li>
<li>You get 5ms latency instead of 150ms</li>
</ol>

<div class="section-title">QUIC — The Protocol Replacing TCP for the Internet</div>
<table class="data-table">
<tr><th>Feature</th><th>TCP + TLS 1.3</th><th>QUIC (HTTP/3)</th></tr>
<tr><td>Round trips to connect</td><td>2 RTT (1 TCP + 1 TLS)</td><td>1 RTT (or 0-RTT on resumption!)</td></tr>
<tr><td>Switched WiFi to cellular?</td><td>Connection breaks — must reconnect</td><td>Seamless migration via <code>Connection ID</code></td></tr>
<tr><td>Head-of-Line Blocking</td><td>One lost packet stalls all streams</td><td>Independent streams — only the affected stream waits</td></tr>
<tr><td>Usage in Chrome</td><td>~35% of traffic</td><td>~65% of traffic</td></tr>
</table>

function openEscapeRoom() {
  for(var i = 0; i < TOTAL_CHAPTERS; i++) {
    var ch = document.getElementById('ch-' + i);
    if(ch) ch.classList.remove('active');
    var nb = document.getElementById('nav-' + i);
    if(nb) nb.classList.remove('active');
  }
  state.cur = 'escape';
  var escCh = document.getElementById('ch-escape');
  if(escCh) escCh.classList.add('active');
  var escBtn = document.getElementById('nav-escape');
  if(escBtn) escBtn.classList.add('active');
  var hdrEsc = document.getElementById('headerEscapeBtn');
  if(hdrEsc) hdrEsc.classList.add('active');
  var hdrName = document.getElementById('headerChName');
  if(hdrName) hdrName.textContent = currentLang === 'en' ? '🎯 Packet Escape Room' : '🎯 חדר בריחה: מסע החבילה';
  window.scrollTo(0, 0);
  renderEscapeRoom();
}

function awardEscapeRoomXP() {
  try {
    var key = 'ng_networks_escape_room_xp';
    var already = localStorage.getItem(key) === '1';
    if(!already) {
      localStorage.setItem(key, '1');
      if(typeof window.ngXP === 'function') {
        window.ngXP(150);
      } else {
        window.parent.postMessage({ type: 'ng_xp', amount: 150 }, '*');
      }
      return true;
    }
  } catch(e) {
    try { window.parent.postMessage({ type: 'ng_xp', amount: 150 }, '*'); } catch(err) {}
    return true;
  }
  return false;
}

      + '<div class="td-body" style="padding:10px;font-size:11px">'
      + '<div style="display:grid;grid-template-columns:32px 60px 105px 105px 60px 1fr;gap:1px;background:#cbd5e1;border-radius:6px;overflow:hidden;color:#0f172a">'
      + '<div style="background:#f1f5f9;padding:4px 6px;font-weight:800">No.</div><div style="background:#f1f5f9;padding:4px 6px;font-weight:800">Time</div><div style="background:#f1f5f9;padding:4px 6px;font-weight:800">Source</div><div style="background:#f1f5f9;padding:4px 6px;font-weight:800">Destination</div><div style="background:#f1f5f9;padding:4px 6px;font-weight:800">Proto</div><div style="background:#f1f5f9;padding:4px 6px;font-weight:800">Info</div>'
      + '<div style="background:#fef9c3;padding:4px 6px">1</div><div style="background:#fef9c3;padding:4px 6px">0.021</div><div style="background:#fef9c3;padding:4px 6px">192.168.1.5</div><div style="background:#fef9c3;padding:4px 6px">Broadcast</div><div style="background:#fef9c3;padding:4px 6px;font-weight:700">ARP</div><div style="background:#fef9c3;padding:4px 6px">Who has 192.168.1.1? Tell 192.168.1.5</div>'
      + '<div style="background:#e0f2fe;padding:4px 6px">2</div><div style="background:#e0f2fe;padding:4px 6px">0.004</div><div style="background:#e0f2fe;padding:4px 6px">192.168.1.5</div><div style="background:#e0f2fe;padding:4px 6px">8.8.8.8</div><div style="background:#e0f2fe;padding:4px 6px;font-weight:700">DNS</div><div style="background:#e0f2fe;padding:4px 6px">Standard query 0x4a1b A www.google.com</div>'
      + '<div style="background:#fee2e2;padding:4px 6px">3</div><div style="background:#fee2e2;padding:4px 6px">0.072</div><div style="background:#fee2e2;padding:4px 6px">192.168.1.5</div><div style="background:#fee2e2;padding:4px 6px">142.250.185.78</div><div style="background:#fee2e2;padding:4px 6px;font-weight:700;color:#b91c1c">TCP</div><div style="background:#fee2e2;padding:4px 6px">[TCP Retransmission] 54321 → 443 [SYN] Seq=100</div>'
      + '<div style="background:#dcfce7;padding:4px 6px">4</div><div style="background:#dcfce7;padding:4px 6px">0.118</div><div style="background:#dcfce7;padding:4px 6px">142.250.185.78</div><div style="background:#dcfce7;padding:4px 6px">192.168.1.5</div><div style="background:#dcfce7;padding:4px 6px;font-weight:700;color:#15803d">HTTP/2</div><div style="background:#dcfce7;padding:4px 6px">HEADERS[1]: 200 OK, DATA[1] (application/xhtml+xml, gzip)</div>'
      + '</div></div></div>';
    puzzleHtml = wsTable + buildChoiceOptions(st, isSolved);
  } else {
    puzzleHtml = buildChoiceOptions(st, isSolved);
  }

  var fbClass = 'er-feedback';
  var fbText = '';
  if(isSolved) {
    fbClass += ' show ok';
    fbText = st.okMsg;
  } else if(erState.feedback === 'err') {
    fbClass += ' show err';
    fbText = st.errMsg;
  }

  var nextBtnHtml = '';
  if(isSolved) {
    if(stIdx < 5) {
      nextBtnHtml = '<button class="btn btn-primary" onclick="nextEscapeStation()">' + d.nextBtn + '</button>';
    } else {
      nextBtnHtml = '<button class="escape-launch-btn" onclick="finishEscapeRoom()">' + d.finishBtn + '</button>';
    }
  }

  var html = '<div class="ch-hero" style="padding:14px 0 12px;margin-bottom:14px">'
    + '<div class="ch-tag">' + d.tag + '</div>'
    + '<h1 class="ch-title" style="font-size:22px;margin-bottom:4px">' + d.title + '</h1>'

    + '</div>'
    + '<div class="er-wrap" style="padding-bottom:160px">'
    + '<div class="er-hud">'

    + '<div class="er-timers">'
    + '<div class="er-latency-pill"><span class="pulse-dot"></span><span>⏱ ' + curMs + 'ms / 150ms' + (penaltyMs ? ' (+' + penaltyMs + 'ms)' : '') + '</span></div>'
    + '</div>'
    + '</div>'
    + '<div class="er-stepper">' + stepperHtml + '</div>'
    + packetBarHtml
    + '</div>'
    + '<div class="er-station-card" id="er-station-card">'
    + '<div class="er-st-header"><div><div class="er-st-badge">' + st.badge + '</div><h2 class="er-st-title">' + st.title + '</h2></div></div>'
    + '<div class="er-st-story">' + st.story + '</div>'
    + puzzleHtml
    + '<div class="' + fbClass + '" id="er-feedback-box">' + fbText + (nextBtnHtml ? '<div style="margin-top:12px">' + nextBtnHtml + '</div>' : '') + '</div>'
    + '<div class="er-hint-box' + (erState.hintShown ? ' show' : '') + '">💡 ' + st.hint + '</div>'
    + '<div class="er-actions-bar">'

  mount.innerHTML = html;
}

function buildChoiceOptions(st, isSolved) {
  return '<div class="er-options">' + st.options.map(function(opt, idx) {
    var cls = 'er-opt-btn';
    if(isSolved && opt.correct) cls += ' correct';
    else if(!isSolved && erState.selectedChoice === idx && !opt.correct) cls += ' wrong';
    return '<button class="' + cls + '" ' + (isSolved ? 'disabled' : '') + ' onclick="selectEscapeOption(' + idx + ')">'
      + '<span class="er-opt-key">' + opt.key + '</span>'
      + '<span>' + opt.text + '</span>'
      + '</button>';
  }).join('') + '</div>';
}

function pickDnsNode(id) {
  if(erState.solved[0] || erState.dnsChain.length >= 4) return;
  if(erState.dnsChain.indexOf(id) >= 0) return;
  erState.dnsChain.push(id);
  erState.feedback = null;
  if(erState.dnsChain.length === 4) {
    verifyDnsOrder();
    return;
  }
  renderEscapeRoom();
}

function removeDnsNode(slotIdx) {
  if(erState.solved[0]) return;
  erState.dnsChain.splice(slotIdx, 1);
  erState.feedback = null;
  renderEscapeRoom();
}

function resetDnsOrder() {
  erState.dnsChain = [];
  erState.feedback = null;
  renderEscapeRoom();
}

function scrollEscapeFeedback() {
  setTimeout(function() {
    var fb = document.getElementById('er-feedback-box');
    if(fb) {
      try { fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch(e) {}
    }
  }, 60);
}

function verifyDnsOrder() {
  var st = (ER_DATA[currentLang] || ER_DATA.he).stations[0];
  var ok = erState.dnsChain.length === 4 && erState.dnsChain.every(function(val, i) { return val === st.correctOrder[i]; });
  if(ok) {
    erState.solved[0] = true;
    erState.feedback = 'ok';
    try { if(typeof window.ngXP === 'function') window.ngXP(20); } catch(e) {}
  } else {
    erState.mistakes++;
    erState.feedback = 'err';
    erState.dnsChain = [];
  }
  renderEscapeRoom();
  scrollEscapeFeedback();
}

function selectEscapeOption(idx) {
  var stIdx = erState.station;
  if(erState.solved[stIdx]) return;
  var st = (ER_DATA[currentLang] || ER_DATA.he).stations[stIdx];
  var opt = st.options[idx];
  erState.selectedChoice = idx;
  if(opt && opt.correct) {
    erState.solved[stIdx] = true;
    erState.feedback = 'ok';
    try { if(typeof window.ngXP === 'function') window.ngXP(20); } catch(e) {}
  } else {
    erState.mistakes++;
    erState.feedback = 'err';
  }
  renderEscapeRoom();
  scrollEscapeFeedback();
}

function toggleEscapeHint() {
  erState.hintShown = !erState.hintShown;
  renderEscapeRoom();
}

function nextEscapeStation() {
  if(erState.station < 5) {
    erState.station++;
    erState.selectedChoice = null;
    erState.feedback = null;
    erState.hintShown = false;
    renderEscapeRoom();
    setTimeout(function() {
      var card = document.getElementById('er-station-card');
      if(card) { try { card.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch(e) {} }
    }, 50);
  }
}

function jumpEscapeStation(idx) {
  erState.station = idx;
  erState.selectedChoice = null;
  erState.feedback = null;
  erState.hintShown = false;
  renderEscapeRoom();
  setTimeout(function() {
    var card = document.getElementById('er-station-card');
    if(card) { try { card.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch(e) {} }
  }, 50);
}

function finishEscapeRoom() {
  erState.station = 6;
  markNetChDone(7);
  window.scrollTo(0, 0);
  renderEscapeRoom();
}

function resetEscapeRoom() {
  erState = {
    station: 0,
    solved: [false, false, false, false, false, false],
    dnsChain: [],
    mistakes: 0,
    hintShown: false,
    selectedChoice: null,
    feedback: null
  };
  window.scrollTo(0, 0);
  renderEscapeRoom();
}

function showNextChapter(n) {
  if(n + 1 >= TOTAL_CHAPTERS) {
    openEscapeRoom();
    return;
  }
  showChapter(n + 1);
}

function showTab(chId, tabName) {
  state.tabs[chId] = tabName;
  activateTab(chId, tabName);
}

function activateTab(chId, tabName) {
  var ch = document.getElementById('ch-' + chId);
  if(!ch) return;
  ch.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.classList.remove('active');
    if(btn.getAttribute('onclick') && btn.getAttribute('onclick').indexOf("'" + tabName + "'") >= 0)
      btn.classList.add('active');
  });
  ch.querySelectorAll('.tab-panel').forEach(function(p) {
    p.classList.toggle('active', p.id === chId + '-' + tabName);
  });
  if(tabName === 'quiz') renderQuiz(chId);
  if(tabName === 'game') renderMatchGame(chId);
}

function renderMatchGame(chId) {
  var el = document.getElementById('game-' + chId);
  if(!el) return;
  if(!state.game[chId]) state.game[chId] = {phase:'idle',sel:null,matched:[],pairs:[]};
  var gs = state.game[chId];
  if(gs.phase === 'idle' || !gs.pairs.length) {
    var d = (currentLang === 'en' ? MATCH_DATA_EN : MATCH_DATA)[chId];
    if(!d || !d.pairs || !d.pairs.length) {
      el.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text2)">אין זוגות לפרק זה</div>';
      return;
    }
    var p = d.pairs.slice();
    for(var i = p.length-1; i > 0; i--) {
      var j = Math.floor(Math.random()*(i+1)); var t=p[i]; p[i]=p[j]; p[j]=t;
    }
    gs.pairs=p; gs.matched=[]; gs.sel=null; gs.phase='play';
  }
  buildMatchBoard(chId);
}

function buildMatchBoard(chId) {
  var el = document.getElementById('game-'+chId);
  var gs = state.game[chId], pairs = gs.pairs;
  var rights = pairs.map(function(p,i){return{text:p[1],idx:i};});
  for(var i=rights.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=rights[i];rights[i]=rights[j];rights[j]=t;}
  var ad = gs.matched.length===pairs.length;
  var html = '<div class="match-board">';
  if(ad){
    html+='<div class="match-success">🎉 '+(currentLang==='en'?'All matched!':'!כל הזוגות הותאמו')+'</div>';
    html+='<div style="text-align:center;margin-top:12px"><button class="match-restart-btn" onclick="restartMatch('+chId+')">'+(currentLang==='en'?'↺ Play Again':'↺ שחק שוב')+'</button></div>';
  }
  html+='<div class="match-cols"><div class="match-col">';
  for(var i=0;i<pairs.length;i++){
    var dn=gs.matched.indexOf(i)>=0, sn=gs.sel&&gs.sel.side==='left'&&gs.sel.idx===i;
    html+='<div class="match-card'+(dn?' match-done':'')+(sn?' match-sel':'')+'" data-side="left" data-idx="'+i+'" onclick="matchClick('+chId+',this)">'+pairs[i][0]+'</div>';
  }
  html+='</div><div class="match-col">';
  for(var i=0;i<rights.length;i++){
    var ri=rights[i], dn=gs.matched.indexOf(ri.idx)>=0, sn=gs.sel&&gs.sel.side==='right'&&gs.sel.ridx===i;
    html+='<div class="match-card'+(dn?' match-done':'')+(sn?' match-sel':'')+'" data-side="right" data-idx="'+ri.idx+'" data-ridx="'+i+'" onclick="matchClick('+chId+',this)">'+ri.text+'</div>';
  }
  html+='</div></div></div>';
  el.innerHTML=html;
}

function matchClick(chId, el) {
  var gs=state.game[chId];
  if(!gs||gs.phase!=='play') return;
  var side=el.getAttribute('data-side'), idx=parseInt(el.getAttribute('data-idx')), ridx=el.hasAttribute('data-ridx')?parseInt(el.getAttribute('data-ridx')):-1;
  if(gs.matched.indexOf(idx)>=0) return;
  if(!gs.sel){gs.sel={side:side,idx:idx,ridx:ridx};buildMatchBoard(chId);return;}
  if(gs.sel.side===side){gs.sel={side:side,idx:idx,ridx:ridx};buildMatchBoard(chId);return;}
  var li=side==='left'?idx:gs.sel.idx, ri=side==='right'?idx:gs.sel.idx;
  gs.sel=null;
  if(li===ri){
    gs.matched.push(li);
    if(gs.matched.length===gs.pairs.length) gs.phase='done';
    buildMatchBoard(chId);
  } else {
    buildMatchBoard(chId);
    document.querySelectorAll('#game-'+chId+' .match-card').forEach(function(c){
      var ci=parseInt(c.getAttribute('data-idx')), cs=c.getAttribute('data-side');
      if((cs==='left'&&ci===li||cs==='right'&&ci===ri)&&gs.matched.indexOf(ci)<0){
        c.classList.add('match-wrong');
        setTimeout(function(){c.classList.remove('match-wrong');},600);
      }
    });
  }
}

function restartMatch(chId) {
  state.game[chId]={phase:'idle',sel:null,matched:[],pairs:[]};
  renderMatchGame(chId);
}

function renderQuiz(chId) {
  var wrap = document.getElementById('quiz-' + chId);
  if(!wrap) return;
  var isEn = currentLang === 'en';
  var qs = NET_QUIZ_DATA[chId] || [];
  if(!state.quiz[chId]) state.quiz[chId] = { cur: 0, answers: {}, score: 0, done: false };
  var st = state.quiz[chId];

  if(st.done) {
    var pct = Math.round((st.score / qs.length) * 100);
    wrap.innerHTML = '<div class="quiz-result">' +
      '<div class="qr-score">' + st.score + '/' + qs.length + ' (' + pct + '%)</div>' +
      '<div class="qr-label">' + (isEn ? '🎉 Chapter Quiz Completed!' : '🎉 השלמת את חידון הפרק!') + '</div>' +
      '<button class="btn btn-primary" onclick="resetChapterQuiz(' + chId + ')">' + (isEn ? '↺ Try Again' : '↺ נסה שוב') + '</button>' +
    '</div>';
    return;
  }

  var qObj = qs[st.cur];
  var picked = st.answers[st.cur];
  var letters = isEn ? ['A', 'B', 'C', 'D'] : ['א', 'ב', 'ג', 'ד'];
  var opts = isEn ? qObj.optsEn : qObj.optsHe;

  var pips = qs.map(function(_, i) {
    var cls = 'quiz-pip';
    if(st.answers[i] !== undefined) cls += ' done';
    else if(i === st.cur) cls += ' cur';
    return '<div class="' + cls + '"></div>';
  }).join('');

  var optsHtml = opts.map(function(txt, oi) {
    var cls = 'quiz-opt';
    if(picked !== undefined) {
      if(oi === qObj.ans) cls += ' correct';
      else if(oi === picked) cls += ' wrong';
    }
    return '<button class="' + cls + '" ' + (picked !== undefined ? 'disabled' : '') + ' onclick="pickQuizOpt(' + chId + ',' + oi + ')">' +
      '<span class="opt-letter">' + letters[oi] + '</span>' +
      '<span>' + txt + '</span>' +
    '</button>';
  }).join('');

  var expHtml = picked !== undefined
    ? '<div class="quiz-exp"><strong>' + (picked === qObj.ans ? (isEn ? '✅ Correct!' : '✅ תשובה נכונה!') : (isEn ? '❌ Explanation:' : '❌ הסבר:')) + '</strong> ' + qObj.expHe + '</div>'
    : '';

  var nextBtn = picked !== undefined
    ? '<button class="btn btn-primary" onclick="nextQuizQ(' + chId + ')">' + (st.cur + 1 < qs.length ? (isEn ? 'Next Question →' : '← השאלה הבאה') : (isEn ? 'Finish Quiz 🏆' : 'סיום חידון 🏆')) + '</button>'
    : '';

  wrap.innerHTML = '<div class="quiz-prog">' + pips + '</div>' +
    '<div class="quiz-q-card active">' +
      '<div class="quiz-meta">' + (isEn ? ('Question ' + (st.cur + 1) + ' of ' + qs.length) : ('שאלה ' + (st.cur + 1) + ' מתוך ' + qs.length)) + '</div>' +
      '<div class="quiz-q">' + (isEn ? qObj.qEn : qObj.qHe) + '</div>' +
      '<div class="quiz-opts">' + optsHtml + '</div>' +
      expHtml +
      '<div class="quiz-nav">' + nextBtn + '</div>' +
    '</div>';
}

function pickQuizOpt(chId, oi) {
  var st = state.quiz[chId];
  if(!st || st.answers[st.cur] !== undefined) return;
  st.answers[st.cur] = oi;
  if(oi === NET_QUIZ_DATA[chId][st.cur].ans) {
    st.score++;
    try { if(typeof window.ngXP === 'function') window.ngXP(10); } catch(e) {}
  }
  renderQuiz(chId);
}

function nextQuizQ(chId) {
  var st = state.quiz[chId];
  var qs = NET_QUIZ_DATA[chId];
  if(st.cur + 1 < qs.length) {
    st.cur++;
  } else {
    st.done = true;
    markNetChDone(chId);
    try { if(typeof window.ngXP === 'function') window.ngXP(25); } catch(e) {}
  }
  renderQuiz(chId);
}

function resetChapterQuiz(chId) {
  state.quiz[chId] = { cur: 0, answers: {}, score: 0, done: false };
  renderQuiz(chId);
}

document.addEventListener('DOMContentLoaded', function() {
  applyLang('he');
  showChapter(0);
});

document.addEventListener('keydown', function(e) {
  if(e.key==='Escape') closeReview();
});

</script>
